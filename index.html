<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Finanzas"/>

<title>Finanzas · Marta</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --navy:#0A0F1E;
  --navy2:#111827;
  --blue:#2563EB;
  --blue-light:#EFF6FF;
  --red:#DC2626;
  --red-light:#FEF2F2;
  --dark:#18181B;
  --dark-light:#F4F4F5;
  --green:#059669;
  --green-light:#ECFDF5;
  --purple:#7C3AED;
  --purple-light:#F5F3FF;
  --amber:#B45309;
  --amber-light:#FFFBEB;
  --amber-border:#FDE68A;
  --rose:#E11D48;
  --rose-light:#FFF1F2;
  --bg:#F8FAFC;
  --card:#FFFFFF;
  --border:#E2E8F0;
  --border2:#F1F5F9;
  --text:#0F172A;
  --text2:#475569;
  --text3:#94A3B8;
  --text4:#CBD5E1;
  --radius:16px;
  --radius-sm:10px;
  --shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 4px 16px rgba(0,0,0,.08);
}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:88px;-webkit-font-smoothing:antialiased}

/* ── TOPBAR ── */
.topbar{background:var(--navy);padding:52px 20px 28px;position:relative;overflow:hidden}
.topbar-noise{position:absolute;inset:0;background:radial-gradient(ellipse at 80% 0%,rgba(37,99,235,.15) 0%,transparent 60%),radial-gradient(ellipse at 20% 100%,rgba(124,58,237,.1) 0%,transparent 50%)}
.topbar-inner{position:relative;z-index:1}
.topbar-label{font-size:11px;font-weight:500;color:rgba(255,255,255,.4);letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
.topbar-amount{font-size:38px;font-weight:800;color:#fff;letter-spacing:-1px;line-height:1}
.topbar-date{font-size:12px;color:rgba(255,255,255,.35);margin-top:8px;font-weight:400}

/* ── ACCOUNT CARDS ── */
.accounts-row{display:flex;gap:10px;overflow-x:auto;padding:20px 20px 0;scrollbar-width:none}
.accounts-row::-webkit-scrollbar{display:none}
.acct-card{flex-shrink:0;width:148px;border-radius:var(--radius);padding:16px;position:relative;overflow:hidden}
.acct-card .ac-bank{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;opacity:.75;margin-bottom:10px}
.acct-card .ac-amount{font-size:22px;font-weight:800;line-height:1;margin-bottom:4px}
.acct-card .ac-date{font-size:10px;opacity:.55;font-weight:400}
.acct-card::after{content:'';position:absolute;width:80px;height:80px;border-radius:50%;background:rgba(255,255,255,.06);top:-20px;right:-20px}
.ac-bb{background:linear-gradient(135deg,#1D4ED8,#2563EB);color:#fff;border:none}
.ac-sa{background:var(--red);color:#fff}
.ac-tr{background:var(--dark);color:#fff}

/* ── INV ROW ── */
.inv-row{display:flex;gap:8px;overflow-x:auto;padding:12px 20px 0;scrollbar-width:none}
.inv-row::-webkit-scrollbar{display:none}
.inv-pill{flex-shrink:0;background:var(--card);border:1px solid var(--border);border-radius:100px;padding:8px 14px;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow)}
.inv-pill .ip-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.inv-pill .ip-label{font-size:11px;color:var(--text3);font-weight:500}
.inv-pill .ip-val{font-size:13px;font-weight:700;color:var(--text)}

/* ── BOTTOM NAV ── */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.92);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-top:1px solid var(--border2);display:flex;padding:8px 0 env(safe-area-inset-bottom);z-index:100}
.bottom-nav button{flex:1;padding:6px 4px;border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;transition:.2s}
.nav-icon{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;transition:.2s}
.nav-label{font-size:9px;font-weight:600;color:var(--text3);letter-spacing:.02em;transition:.2s}
.bottom-nav button.active .nav-icon{background:var(--blue-light)}
.bottom-nav button.active .nav-label{color:var(--blue)}
.nav-svg{width:16px;height:16px;stroke:var(--text3);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:.2s}
.bottom-nav button.active .nav-svg{stroke:var(--blue)}

/* ── SECTIONS ── */
.sec{display:none;padding:16px 20px}
.sec.active{display:block}
.page-title{font-size:22px;font-weight:800;color:var(--text);letter-spacing:-.4px;margin-bottom:16px}

/* ── CARDS ── */
.card{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:var(--shadow);border:1px solid var(--border2)}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.card-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--text3)}
.card-value{font-size:13px;font-weight:700;color:var(--text2)}

/* ── ROWS ── */
.row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--border2)}
.row:last-child{border-bottom:none}
.rn{flex:1}
.rn-main{font-size:13px;font-weight:500;color:var(--text)}
.rn-sub{font-size:11px;color:var(--text3);margin-top:1px}
.ra{font-size:14px;font-weight:700;white-space:nowrap}
.c-blue{color:var(--blue)}.c-red{color:var(--red)}.c-dark{color:var(--dark)}.c-green{color:var(--green)}.c-purple{color:var(--purple)}.c-amber{color:var(--amber)}.c-rose{color:var(--rose)}
.neg{color:var(--red)}.pos{color:var(--green)}.muted{color:var(--text3)}

/* ── TAG PILLS ── */
.tag{display:inline-flex;align-items:center;font-size:10px;font-weight:600;padding:3px 8px;border-radius:100px;letter-spacing:.02em}
.tag-blue{background:var(--blue-light);color:var(--blue)}
.tag-green{background:var(--green-light);color:var(--green)}
.tag-red{background:var(--red-light);color:var(--red)}
.tag-amber{background:var(--amber-light);color:var(--amber)}
.tag-purple{background:var(--purple-light);color:var(--purple)}
.tag-rose{background:var(--rose-light);color:var(--rose)}
.tag-slate{background:var(--dark-light);color:var(--text2)}

/* ── TOTBAR ── */
.totbar{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px}
.totbox{background:var(--card);border-radius:var(--radius-sm);padding:10px;text-align:center;border:1px solid var(--border2);box-shadow:var(--shadow)}
.totbox-label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);margin-bottom:4px}
.totbox-val{font-size:16px;font-weight:800}

/* ── FORMS ── */
.fr{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.fr label{font-size:11px;font-weight:700;color:var(--text2);letter-spacing:.03em}
.fr input,.fr select,.fr textarea{padding:11px 14px;font-size:14px;border-radius:var(--radius-sm);border:1.5px solid var(--border);background:#fff;color:var(--text);width:100%;font-family:inherit;-webkit-appearance:none;transition:border-color .2s}
.fr input:focus,.fr select:focus{outline:none;border-color:var(--blue)}
.fg2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn-primary{width:100%;padding:14px;border-radius:var(--radius-sm);border:none;font-size:14px;font-weight:700;cursor:pointer;color:#fff;background:var(--blue);font-family:inherit;letter-spacing:.02em;transition:.2s}
.btn-primary:active{transform:scale(.98)}
.btn-primary.red{background:var(--red)}
.btn-primary.green{background:var(--green)}
.btn-primary.dark{background:var(--dark)}
.btn-primary.purple{background:var(--purple)}
.btn-ghost{padding:8px 14px;border-radius:var(--radius-sm);border:1.5px solid var(--border);background:transparent;color:var(--text2);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}

/* ── BAR ── */
.bar-bg{height:5px;border-radius:3px;background:var(--border);overflow:hidden}
.bar-fill{height:100%;border-radius:3px;transition:.4s}
.prog-bar{height:6px;border-radius:3px;background:var(--border);overflow:hidden;margin:8px 0}
.prog-fill{height:100%;border-radius:3px;background:var(--green);transition:.5s}

/* ── INFO BLOCKS ── */
.info-block{background:var(--bg);border-radius:var(--radius-sm);padding:14px;margin-bottom:12px;border:1px solid var(--border2)}
.info-block-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);margin-bottom:10px}

/* ── DEUDA / IVA ITEMS ── */
.list-item{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--border2)}
.list-item:last-child{border-bottom:none}
.item-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.item-body{flex:1;min-width:0}
.item-title{font-size:13px;font-weight:600;color:var(--text)}
.item-sub{font-size:11px;color:var(--text3);margin-top:1px}
.item-amount{font-size:14px;font-weight:800;white-space:nowrap}
.item-action{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:.2s;background:transparent}
.item-action.done{background:var(--green);border-color:var(--green)}

/* ── SUMMARY BLOCKS ── */
.summary-block{border-radius:var(--radius);padding:18px;margin-bottom:12px;border:1px solid transparent}
.sb-blue{background:var(--blue-light);border-color:rgba(37,99,235,.12)}
.sb-green{background:var(--green-light);border-color:rgba(5,150,105,.12)}
.sb-purple{background:var(--purple-light);border-color:rgba(124,58,237,.12)}
.sb-rose{background:var(--rose-light);border-color:rgba(225,29,72,.12)}
.sb-amber{background:var(--amber-light);border-color:rgba(217,119,6,.12)}
.sb-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--text3);margin-bottom:6px}
.sb-value{font-size:26px;font-weight:800;letter-spacing:-.5px;line-height:1;margin-bottom:4px}
.sb-sub{font-size:11px;color:var(--text3);font-weight:400}

/* ── FACTURAS ── */
.fi{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--border2);cursor:pointer;user-select:none;-webkit-user-select:none;transition:.15s}
.fi:last-child{border-bottom:none}
.fi-check{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:.2s}
.fi.chk .fi-check{background:var(--green);border-color:var(--green)}
.fi.nap{opacity:.3;pointer-events:none}
.fi-body{flex:1}
.fi-name{font-size:13px;font-weight:600;color:var(--text)}
.fi.chk .fi-name{color:var(--text3);text-decoration:line-through}
.fi-sub{font-size:11px;color:var(--text3);margin-top:1px}
.fi-amt{font-size:13px;font-weight:700;color:var(--text2)}

/* ── OBJ ── */
.obj-card{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:10px;border:1px solid var(--border2);box-shadow:var(--shadow)}
.countdown-badge{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:100px;font-size:12px;font-weight:700}
.cb-ok{background:var(--green-light);color:var(--green)}
.cb-soon{background:var(--amber-light);color:var(--amber)}
.cb-urgent{background:var(--red-light);color:var(--red)}
.cb-none{background:var(--dark-light);color:var(--text3)}

/* ── CAL ── */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-top:8px}
.ch{font-size:10px;text-align:center;font-weight:700;color:var(--text3);padding:4px;letter-spacing:.04em}
.cd{font-size:12px;text-align:center;padding:7px 2px;border-radius:8px;color:var(--text3);font-weight:400}
.cd.bill{background:var(--blue-light);color:var(--blue);font-weight:700}
.cd.paid{background:var(--green-light);color:var(--green);font-weight:700}
.cd.today{outline:2px solid var(--blue);outline-offset:-2px;font-weight:700}
.cd.empty{opacity:0}

/* ── EDIT PANEL ── */
.edit-panel{background:var(--bg);border-radius:var(--radius-sm);padding:14px;margin-top:10px;display:none;border:1px solid var(--border2)}

/* ── MISC ── */
.divider{height:1px;background:var(--border2);margin:14px 0}
.section-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text3);margin:16px 0 8px}
.msg-ok{font-size:13px;font-weight:600;color:var(--green);text-align:center;padding:12px;background:var(--green-light);border-radius:var(--radius-sm);margin-top:10px}
.msg-err{font-size:13px;font-weight:600;color:var(--red);text-align:center;padding:12px;background:var(--red-light);border-radius:var(--radius-sm);margin-top:10px}
.recibo-baja{opacity:.35}
.chip-group{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{padding:5px 12px;border-radius:100px;border:1.5px solid var(--border);font-size:12px;font-weight:600;color:var(--text2);background:#fff;cursor:pointer;transition:.15s}
.chip.selected{border-color:var(--blue);color:var(--blue);background:var(--blue-light)}

/* ── BACKUP BAR ── */
.backup-bar{position:fixed;top:0;right:0;z-index:300;padding:12px 16px;display:flex;gap:8px}
.bk-btn{display:flex;align-items:center;gap:5px;padding:6px 12px;border-radius:100px;font-size:11px;font-weight:600;cursor:pointer;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.8);font-family:inherit;transition:.2s}
</style>
</head>

function loadDB(){try{const r=localStorage.getItem(SK);if(r){const t=JSON.parse(r);if(t._v>=7)DB=t;}}catch(e){}}

function fmt(n){return n!=null?parseFloat(n).toFixed(2).replace('.',',')+' €':'—';}
function mesKey(y,m){return`${y}-${String(m).padStart(2,'0')}`;}
function isPast(dia,y,m){const ty=hoy.getFullYear(),tm=hoy.getMonth(),td=hoy.getDate();if(y<ty||(y===ty&&m<tm))return true;if(y===ty&&m===tm&&dia<td)return true;return false;}
function reciboActivo(r,y,m){if(r.finAnio!==undefined&&r.finMes!==undefined)if(y>r.finAnio||(y===r.finAnio&&m>r.finMes))return false;return true;}
function reciboAplica(r,y,m){if(!reciboActivo(r,y,m))return false;if(r.frec==='monthly')return true;if(r.frec==='quarterly')return r.meses&&r.meses.includes(m);if(r.frec==='annual')return r.mesAnual===m;if(r.frec==='once')return r.mesAnual===m&&(!r.anio||r.anio===y);return false;}
function getBBVABills(y,m){return DB.recibos.filter(r=>r.cuenta==='bbva'&&(r.tipo==='gasto'||r.tipo==='fraccionado')&&reciboAplica(r,y,m)).sort((a,b)=>a.dia-b.dia);}
function diasRestantes(f){if(!f)return null;const fd=new Date(f);fd.setHours(0,0,0,0);const hd=new Date();hd.setHours(0,0,0,0);return Math.ceil((fd-hd)/(1000*60*60*24));}
function calcCuotasPagadas(){const ini=new Date('2026-05-01');if(hoy<ini)return 0;const m=(hoy.getFullYear()-ini.getFullYear())*12+(hoy.getMonth()-ini.getMonth());return Math.min(m+1,DB.prestamo.total);}
function ivaTotal(){return(DB.iva||[]).reduce((s,i)=>s+i.importe,0);}
function cuentaLabel(c){return c==='bbva'?'BBVA':c==='san'?'Santander':'Trade Republic';}

function addMovimiento(){
  const tipo=document.getElementById('mTipo').value;
  const nombre=document.getElementById('mN')?.value.trim();
  const importe=parseFloat(document.getElementById('mI')?.value);
  const msg=document.getElementById('mMsg');
  if(!nombre||isNaN(importe)||importe<=0){msg.className='msg-err';msg.textContent='⚠ Nombre e importe obligatorios.';return;}
  if(tipo==='gasto'){
    const frec=document.getElementById('mF').value,cuenta=document.getElementById('mC').value;
    const dia=parseInt(document.getElementById('mD').value)||1,notas=document.getElementById('mNt').value.trim();
    const esF=document.getElementById('mEF').value==='si';
    const r={id:Date.now(),nombre,importe,tipo:'gasto',frec,cuenta,dia,notas};
    if(frec==='quarterly')r.meses=[0,3,6,9];
    if(frec==='annual'||frec==='once'){r.mesAnual=hoy.getMonth();if(frec==='once')r.anio=hoy.getFullYear();}
    if(esF){const k=mesKey(hoy.getFullYear(),hoy.getMonth());if(!FACT[k])FACT[k]={checks:{},extras:[]};FACT[k].extras.push({id:Date.now()+1,name:nombre,amt:importe,checked:false});saveFact();}
    DB.recibos.push(r);
  }
  if(tipo==='fraccionado'){
    const cuenta=document.getElementById('mC').value,dia=parseInt(document.getElementById('mD').value)||1;
    const notas=document.getElementById('mNt').value.trim();
    const fini=document.getElementById('mFini').value,ffin=document.getElementById('mFfin').value;
    if(!fini||!ffin){msg.className='msg-err';msg.textContent='⚠ Indica mes inicio y fin.';return;}
    const[iniY,iniM]=fini.split('-').map(Number);const[finY,finM]=ffin.split('-').map(Number);
    let y=iniY,m=iniM-1;
    while(y<finY||(y===finY&&m<=finM-1)){
      DB.recibos.push({id:Date.now()+Math.random(),nombre,importe,tipo:'fraccionado',frec:'once',cuenta,dia,notas,mesAnual:m,anio:y});
      m++;if(m>11){m=0;y++;}
    }
  }
  if(tipo==='iva'){const fecha=document.getElementById('mFini').value,notas=document.getElementById('mNt').value.trim();if(!DB.iva)DB.iva=[];DB.iva.push({id:Date.now(),nombre,importe,fecha,notas});}
  if(tipo==='deuda'){const notas=document.getElementById('mNt').value.trim();if(!DB.deudas)DB.deudas=[];DB.deudas.push({id:Date.now(),nombre,importe,notas,pagada:false,fecha:hoy.toISOString().split('T')[0]});}
  saveDB();msg.className='msg-ok';msg.textContent='✓ Guardado correctamente';
  setTimeout(()=>renderMovimientos(),1500);
}

  document.getElementById('calTitle').textContent=mesesC[curMonth]+' '+curYear;
  const bills=getBBVABills(curYear,curMonth);
  const byDay={};bills.forEach(b=>{if(!byDay[b.dia])byDay[b.dia]=[];byDay[b.dia].push(b);});
  let total=0,paid=0,pending=0;
  bills.forEach(b=>{total+=b.importe;if(isPast(b.dia,curYear,curMonth))paid+=b.importe;else pending+=b.importe;});
  document.getElementById('tTotal').textContent=fmt(total);
  document.getElementById('tPaid').textContent=fmt(paid);
  document.getElementById('tPend').textContent=fmt(pending);
  const firstDay=new Date(curYear,curMonth,1).getDay(),offset=firstDay===0?6:firstDay-1;
  const daysInM=new Date(curYear,curMonth+1,0).getDate();
  let html='';
  for(let i=0;i<offset;i++)html+=`<div class="cd empty">·</div>`;
  for(let d=1;d<=daysInM;d++){
    const hb=byDay[d],isToday=hoy.getFullYear()===curYear&&hoy.getMonth()===curMonth&&d===hoy.getDate();
    const past=isPast(d,curYear,curMonth);
    html+=`<div class="cd${hb?(past?' paid':' bill'):''}${isToday?' today':''}">${d}</div>`;
  }
  document.getElementById('calDays').innerHTML=html;
  let lh=`<div class="card-header"><span class="card-title">BBVA · ${mesesC[curMonth]}</span><span class="neg" style="font-weight:700">Pendiente ${fmt(pending)}</span></div>`;
  bills.forEach(b=>{const past=isPast(b.dia,curYear,curMonth);lh+=`<div class="row"><div class="item-icon" style="background:var(--bg);width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0"><span style="font-size:10px;font-weight:700;color:var(--blue)">d.${b.dia}</span></div><div class="rn"><div class="rn-main">${b.nombre}</div></div><span class="tag ${past?'tag-green':'tag-amber'}">${past?'Pagado':'Pendiente'}</span><div class="ra ${past?'muted':'c-blue'}" style="margin-left:6px">${past?'':'-'}${fmt(b.importe)}</div></div>`;});
  lh+=`<div style="background:var(--blue-light);border-radius:var(--radius-sm);padding:10px 12px;margin-top:8px;display:flex;justify-content:space-between;align-items:center"><span style="font-size:12px;font-weight:700;color:var(--blue)">Total BBVA ${mesesC[curMonth]}</span><span style="font-size:15px;font-weight:800;color:var(--blue)">−${fmt(total)}</span></div>`;
  document.getElementById('calList').innerHTML=lh;
}

// ── FACTURAS ─────────────────────────────────────────────
const FIJAS=[
  {id:'aje',name:'AJE',amt:48,frec:'quarterly',meses:[0,3,6,9]},
  {id:'neting',name:'Neting',amt:48.39,frec:'monthly'},
  {id:'google',name:'Google ONE',amt:2.99,frec:'monthly'},
  {id:'appwb',name:'App WB',amt:3.09,frec:'monthly'},
  {id:'arrabal',name:'Arrabal & Díaz',amt:60,frec:'quarterly',meses:[1,4,7,10]},
  {id:'alquiler',name:'Alquiler',amt:540,frec:'monthly'},
  {id:'ssalud',name:'Seguro de salud',amt:74.90,frec:'monthly'},
  {id:'shogar',name:'Seguro de hogar',amt:78.26,frec:'annual',mes:1},
  {id:'regular',name:'Regularización autónomo',amt:178.08,frec:'special',check:(y,m)=>y===2026&&[3,4,5].includes(m)},
];
function factAplica(f,y,m){if(f.frec==='monthly')return true;if(f.frec==='quarterly')return f.meses.includes(m);if(f.frec==='annual')return f.mes===m;if(f.frec==='special')return f.check(y,m);return false;}
function tagFact(f){if(f.frec==='monthly')return'tag-blue';if(f.frec==='quarterly')return'tag-amber';if(f.frec==='annual')return'tag-purple';return'tag-rose';}
function tagLabel(f){if(f.frec==='monthly')return'Mensual';if(f.frec==='quarterly')return'Trimestral';if(f.frec==='annual')return'Anual';return'Especial';}
let factY=hoy.getFullYear(),factM=hoy.getMonth();
function getFactMes(y,m){const k=mesKey(y,m);if(!FACT[k])FACT[k]={checks:{},extras:[]};return FACT[k];}
function renderFacturas(){
  const e=getFactMes(factY,factM);
  const disp=FIJAS.filter(f=>factAplica(f,factY,factM)),noDisp=FIJAS.filter(f=>!factAplica(f,factY,factM));
  const totalF=disp.length+e.extras.length,okF=disp.filter(f=>e.checks[f.id]).length+e.extras.filter(x=>x.checked).length;
  const pct=totalF?Math.round(okF/totalF*100):0;
  let html=`<div class="page-title">Facturas</div>
    <div style="display:flex;gap:10px;margin-bottom:14px;align-items:center">
      <button class="btn-ghost" style="padding:8px 12px" onclick="changeFactMes(-1)">←</button>
      <span style="flex:1;text-align:center;font-size:18px;font-weight:800;letter-spacing:-.3px">${mesesC[factM]} ${factY}</span>
      <button class="btn-ghost" style="padding:8px 12px" onclick="changeFactMes(1)">→</button>
    </div>
    <div class="totbar">
      <div class="totbox"><div class="totbox-label">Total</div><div class="totbox-val">${totalF}</div></div>
      <div class="totbox"><div class="totbox-label">Guardadas</div><div class="totbox-val pos">${okF}</div></div>
      <div class="totbox"><div class="totbox-label">Pendientes</div><div class="totbox-val neg">${totalF-okF}</div></div>
    </div>
    <div style="margin-bottom:14px">
      <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text3);font-weight:600;margin-bottom:6px"><span>Progreso del mes</span><span>${pct}%</span></div>
      <div class="prog-bar"><div class="prog-fill" style="width:${pct}%"></div></div>
    </div>
    <div class="card">
      <div class="card-header"><span class="card-title">Facturas deducibles</span></div>
      ${disp.map(f=>{const chk=!!e.checks[f.id];return`<div class="fi${chk?' chk':''}" onclick="toggleFact('${f.id}')">
        <div class="fi-check">${chk?`<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`:''}</div>
        <div class="fi-body"><div class="fi-name">${f.name} <span class="tag ${tagFact(f)}">${tagLabel(f)}</span></div><div class="fi-sub">${chk?'Guardada en carpeta compartida':'Pendiente de guardar'}</div></div>
        <div class="fi-amt">${fmt(f.amt)}</div>
      </div>`;}).join('')}
    </div>`;
  if(noDisp.length){
    html+=`<div class="card">
      <div class="card-header"><span class="card-title" style="color:var(--text3)">No aplican este mes</span></div>
      ${noDisp.map(f=>`<div class="fi nap">
        <div class="fi-check"></div>
        <div class="fi-body"><div class="fi-name">${f.name} <span class="tag ${tagFact(f)}">${tagLabel(f)}</span></div></div>
        <div class="fi-amt muted">${fmt(f.amt)}</div>
      </div>`).join('')}
    </div>`;
  }
  html+=`<div class="card">
    <div class="card-header"><span class="card-title">Gastos extra</span></div>
    ${e.extras.map(x=>`<div class="fi${x.checked?' chk':''}" onclick="toggleExtra(${x.id})">
      <div class="fi-check">${x.checked?`<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`:''}</div>
      <div class="fi-body"><div class="fi-name">${x.name} <span class="tag tag-rose">Extra</span></div><div class="fi-sub">${x.checked?'Guardada':'Pendiente'}</div></div>
      <div class="fi-amt">${fmt(x.amt)}</div>
    </div>`).join('')||`<div style="font-size:13px;color:var(--text3);padding:8px 0">Sin gastos extra este mes</div>`}
    <div style="display:flex;gap:8px;margin-top:12px">
      <input type="text" id="eC" placeholder="Concepto" style="flex:1;padding:10px 12px;font-size:13px;border-radius:var(--radius-sm);border:1.5px solid var(--border);background:#fff;color:var(--text);font-family:inherit"/>
      <input type="number" id="eI" placeholder="€" inputmode="decimal" style="width:72px;padding:10px;font-size:13px;border-radius:var(--radius-sm);border:1.5px solid var(--border);background:#fff;color:var(--text);font-family:inherit"/>
      <button class="btn-primary" style="width:auto;padding:10px 14px" onclick="addExtra()">+</button>
    </div>
  </div>
  <button class="btn-ghost" style="width:100%;margin-top:4px" onclick="resetFactMes()">Reiniciar mes</button>`;
  document.getElementById('s-facturas').innerHTML=html;
}
function changeFactMes(d){factM+=d;if(factM>11){factM=0;factY++;}if(factM<0){factM=11;factY--;}renderFacturas();}
function resetFactMes(){if(!confirm(`¿Reiniciar ${mesesC[factM]} ${factY}?`))return;const k=mesKey(factY,factM);if(FACT[k]){FACT[k].checks={};FACT[k].extras=[];}saveFact();renderFacturas();}
function toggleFact(id){const e=getFactMes(factY,factM);e.checks[id]=!e.checks[id];saveFact();renderFacturas();}
function toggleExtra(id){const e=getFactMes(factY,factM);const x=e.extras.find(x=>x.id===id);if(x){x.checked=!x.checked;saveFact();renderFacturas();}}
function addExtra(){
  const c=document.getElementById('eC').value.trim(),i=parseFloat(document.getElementById('eI').value);
  if(!c)return;
  const e=getFactMes(factY,factM);
  e.extras.push({id:Date.now(),name:c,amt:isNaN(i)?null:i,checked:false});
  saveFact();renderFacturas();
}

// ── BACKUP ───────────────────────────────────────────────
function exportarDatos(){
  const b={db:DB,fact:FACT,exportado:new Date().toISOString()};
  const blob=new Blob([JSON.stringify(b,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=`finanzas-${new Date().toLocaleDateString('es-ES').replace(/\//g,'-')}.json`;
  document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
  alert('✓ Backup exportado. Guárdalo en Google Drive.');
}
function importarDatos(event){
  const file=event.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const b=JSON.parse(e.target.result);
      if(!b.db||!b.db._v){alert('⚠ Archivo no válido.');return;}
      if(!confirm(`¿Restaurar backup del ${new Date(b.exportado).toLocaleDateString('es-ES')}?`))return;
      DB=b.db;FACT=b.fact||{};saveDB();saveFact();renderResumen();alert('✓ Restaurado.');
    }catch(e){alert('⚠ Error al leer el archivo.');}
  };
  reader.readAsText(file);event.target.value='';
}

const renders={resumen:renderResumen,cuentas:renderCuentas,movimientos:renderMovimientos,inversiones:renderInversiones,objetivos:renderObjetivos,calendario:renderCalendario,facturas:renderFacturas};
loadDB();loadFact();renderResumen();
</script>
