<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>Finanzas · Marta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F0F4FB;--surf:#FFF;--c2:#F7F9FE;
  --brd:#E4EAF4;--brd2:#EEF2FA;
  --bl:#4A7BE8;--bl-l:#EBF1FD;--bl-m:#C5D6FA;
  --gr:#2BAA82;--gr-l:#E6F7F2;--gr-m:#A8DFD0;
  --re:#E0595A;--re-l:#FDEAEA;--re-m:#F5BBBB;
  --am:#C87D12;--am-l:#FDF4E3;--am-m:#F5D8A0;
  --tr:#6E7EC0;--tr-l:#ECEFFE;--tr-m:#C4CAE8;
  --tx:#1A1F36;--t2:#6B7399;--t3:#B0B8D4;
  --r:18px;--rs:12px;--sh:0 2px 14px rgba(100,120,200,.09);
  --num:'Outfit',sans-serif;
}
body{font-family:'DM Sans',-apple-system,sans-serif;background:var(--bg);color:var(--tx);-webkit-font-smoothing:antialiased;padding-bottom:90px;min-height:100vh;overscroll-behavior:none}
.sec{display:none;padding:14px 15px 8px;animation:fi .2s ease}.sec.active{display:block}
@keyframes fi{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}

/* ── HERO ── */
.hero{background:linear-gradient(155deg,#C8D8F8 0%,#D4E4FA 35%,#DFF0EC 100%);padding:52px 20px 20px;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;top:-70px;right:-50px;width:240px;height:240px;border-radius:50%;background:rgba(255,255,255,.3)}
.hero::after{content:'';position:absolute;bottom:-60px;left:-20px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.18)}
.hero-in{position:relative;z-index:1}
.hero-lbl{font-size:11px;font-weight:700;color:rgba(74,123,232,.7);letter-spacing:.1em;text-transform:uppercase;margin-bottom:5px}
.hero-num{font-family:var(--num);font-size:42px;font-weight:800;color:var(--tx);letter-spacing:-.5px;line-height:1}
.hero-date{font-size:11px;color:rgba(74,123,232,.55);margin-top:6px;font-weight:500}

/* ── ACCOUNT STRIP ── */
.acs{display:flex;gap:10px;overflow-x:auto;padding:14px 15px 6px;scrollbar-width:none}
.acs::-webkit-scrollbar{display:none}
.ac{flex-shrink:0;width:148px;border-radius:16px;padding:14px;position:relative;overflow:hidden;color:#fff;cursor:pointer}
.ac::after{content:'';position:absolute;width:90px;height:90px;border-radius:50%;background:rgba(255,255,255,.1);top:-22px;right:-22px}
.ac-lbl{font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;opacity:.68;margin-bottom:8px}
.ac-val{font-family:var(--num);font-size:21px;font-weight:800;line-height:1;margin-bottom:3px;position:relative;z-index:1}
.ac-date{font-size:10px;opacity:.42}
.ac-bb{background:linear-gradient(135deg,#4A7BE8,#7BAEFF)}
.ac-sa{background:linear-gradient(135deg,#E07585,#F5A0AC)}
.ac-tr{background:linear-gradient(135deg,#6E7EC0,#9DAED8)}

/* ── NAV ── */
.bnav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.95);backdrop-filter:blur(28px);border-top:1px solid var(--brd);display:flex;padding:8px 2px calc(8px + env(safe-area-inset-bottom));z-index:100;box-shadow:0 -4px 24px rgba(100,120,200,.09)}
.nb{flex:1;padding:3px 2px;border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;font-family:inherit;transition:.15s}
.ni{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;transition:.18s}
.nl{font-size:9px;font-weight:700;color:var(--t3);letter-spacing:.03em;transition:.18s}
.ns{width:16px;height:16px;stroke:var(--t3);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:.18s}
.nb.on .ni{background:var(--bl-l)}.nb.on .nl{color:var(--bl)}.nb.on .ns{stroke:var(--bl)}

/* ── FAB ── */
.fab{position:fixed;bottom:calc(76px + env(safe-area-inset-bottom));right:16px;width:52px;height:52px;border-radius:50%;background:var(--bl);color:#fff;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:300;z-index:200;box-shadow:0 4px 20px rgba(74,123,232,.4);transition:.2s}
.fab:active{transform:scale(.93)}

/* ── QUICK SHEET ── */
.sheet-overlay{position:fixed;inset:0;background:rgba(10,15,35,.45);z-index:300;opacity:0;pointer-events:none;transition:opacity .25s;backdrop-filter:blur(3px)}
.sheet-overlay.open{opacity:1;pointer-events:all}
.sheet{position:fixed;bottom:0;left:0;right:0;background:var(--surf);border-radius:24px 24px 0 0;padding:18px 18px calc(28px + env(safe-area-inset-bottom));z-index:301;transform:translateY(100%);transition:transform .3s cubic-bezier(.4,0,.2,1)}
.sheet.open{transform:none}
.sheet-handle{width:40px;height:4px;background:var(--brd);border-radius:2px;margin:0 auto 18px}
.sheet-title{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--t2);margin-bottom:14px}
.sheet-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sheet-btn{padding:14px 12px;border-radius:14px;border:1.5px solid var(--brd);background:var(--c2);color:var(--tx);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;text-align:left;display:flex;flex-direction:column;gap:5px;transition:.15s}
.sheet-btn:active{transform:scale(.97)}
.sheet-btn-ico{font-size:22px}
.sheet-btn-lbl{font-size:12px;font-weight:700;color:var(--tx)}
.sheet-btn-sub{font-size:10px;font-weight:600;color:var(--t2)}

/* ── CARDS ── */
.card{background:var(--surf);border-radius:var(--r);padding:16px;margin-bottom:12px;border:1px solid var(--brd2);box-shadow:var(--sh)}
.chdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.ctit{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--t2)}
.ptit{font-size:22px;font-weight:800;letter-spacing:-.4px;margin-bottom:15px}

/* ── DISPONIBLE CARD ── */
.disp-card{background:linear-gradient(135deg,var(--bl),#6E9FF5);border-radius:var(--r);padding:18px;margin-bottom:12px;box-shadow:0 4px 20px rgba(74,123,232,.28)}
.disp-lbl{font-size:11px;font-weight:700;color:rgba(255,255,255,.7);letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
.disp-num{font-family:var(--num);font-size:38px;font-weight:800;color:#fff;letter-spacing:-.5px;line-height:1;margin-bottom:6px}
.disp-sub{font-size:12px;font-weight:600;color:rgba(255,255,255,.65)}

/* ── ALERTA DE URGENCIA ── */
.urgent-card{background:var(--re-l);border:1.5px solid var(--re-m);border-radius:var(--r);padding:14px 16px;margin-bottom:12px}
.urgent-card.warn{background:var(--am-l);border-color:var(--am-m)}
.urgent-ico{font-size:18px;margin-bottom:6px}
.urgent-txt{font-size:13px;font-weight:700;color:var(--re)}
.urgent-card.warn .urgent-txt{color:var(--am)}
.urgent-sub{font-size:11px;font-weight:600;color:var(--re);opacity:.8;margin-top:3px}
.urgent-card.warn .urgent-sub{color:var(--am)}

/* ── LIST ITEMS ── */
.li{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--brd2)}
.li:last-child{border-bottom:none}
.li-ico{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:10px;font-weight:800}
.li-body{flex:1;min-width:0}
.li-name{font-size:13px;font-weight:600;color:var(--tx)}
.li-sub{font-size:11px;color:var(--t2);margin-top:2px}
.li-amt{font-family:var(--num);font-size:14px;font-weight:700;white-space:nowrap}
.li-act{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--brd);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;background:transparent}

/* ── PROGRESS ── */
.prog{height:7px;border-radius:4px;background:var(--brd);overflow:hidden;margin:7px 0}
.pf{height:100%;border-radius:4px;transition:.7s}
.pf-bl{background:linear-gradient(90deg,#4A7BE8,#7BAEFF)}
.pf-gr{background:linear-gradient(90deg,#2BAA82,#4DC8A0)}
.pf-re{background:linear-gradient(90deg,#E0595A,#F07070)}
.pf-tr{background:linear-gradient(90deg,#6E7EC0,#9CAAD8)}
.pf-am{background:linear-gradient(90deg,#C87D12,#E8A040)}

/* ── FORMS ── */
.fr{display:flex;flex-direction:column;gap:5px;margin-bottom:11px}
.fr label{font-size:11px;font-weight:700;color:var(--t2);letter-spacing:.04em}
.fr input,.fr select{padding:11px 13px;font-size:14px;border-radius:var(--rs);border:1.5px solid var(--brd);background:var(--c2);color:var(--tx);width:100%;font-family:inherit;-webkit-appearance:none;transition:.2s}
.fr input:focus,.fr select:focus{outline:none;border-color:var(--bl);background:#fff;box-shadow:0 0 0 3px rgba(74,123,232,.1)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}

/* ── BUTTONS ── */
.btn{width:100%;padding:13px;border-radius:var(--rs);border:none;font-size:14px;font-weight:700;cursor:pointer;color:#fff;font-family:inherit;transition:.15s}
.btn:active{transform:scale(.98)}
.btn-bl{background:var(--bl)}.btn-re{background:var(--re)}.btn-gr{background:var(--gr)}
.btn-am{background:var(--am)}.btn-tr{background:var(--tr)}
.btn-dk{background:var(--c2);border:1.5px solid var(--brd);color:var(--tx)}
.btn-gh{padding:9px 14px;border-radius:var(--rs);border:1.5px solid var(--brd);background:var(--surf);color:var(--t2);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;transition:.15s}
.btn-pg{padding:6px 11px;border-radius:8px;border:1.5px solid var(--gr-m);background:var(--gr-l);color:var(--gr);font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;transition:.15s;flex-shrink:0}
.btn-pg.done{background:var(--gr);color:#fff;border-color:var(--gr)}

/* ── TAGS ── */
.tag{display:inline-flex;align-items:center;font-size:10px;font-weight:700;padding:3px 8px;border-radius:100px;flex-shrink:0}
.t-bl{background:var(--bl-l);color:var(--bl)}.t-re{background:var(--re-l);color:var(--re)}
.t-gr{background:var(--gr-l);color:var(--gr)}.t-am{background:var(--am-l);color:var(--am)}
.t-gy{background:var(--c2);color:var(--t2)}.t-tr{background:var(--tr-l);color:var(--tr)}

/* ── P&L BOX ── */
.pnl{border-radius:var(--rs);padding:14px 16px;margin-bottom:12px;border:1px solid transparent}
.pnl-pos{background:var(--gr-l);border-color:var(--gr-m)}
.pnl-neg{background:var(--re-l);border-color:var(--re-m)}
.pnl-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.pnl-val{font-family:var(--num);font-size:26px;font-weight:800;letter-spacing:-.3px}
.pnl-sub{font-size:11px;margin-top:4px;font-weight:600}

/* ── MISC ── */
.ep{background:var(--c2);border-radius:var(--rs);padding:13px;margin-top:10px;display:none;border:1px solid var(--brd2)}
.dlbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--t3);margin:13px 0 8px}
.mok{font-size:13px;font-weight:700;color:var(--gr);padding:11px;background:var(--gr-l);border-radius:var(--rs);margin-top:10px;text-align:center;border:1px solid var(--gr-m)}
.merr{font-size:13px;font-weight:700;color:var(--re);padding:11px;background:var(--re-l);border-radius:var(--rs);margin-top:10px;text-align:center}
.sbox{background:var(--surf);border-radius:14px;padding:14px;border:1px solid var(--brd2);box-shadow:var(--sh)}
.slbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--t2);margin-bottom:5px}
.sval{font-family:var(--num);font-size:20px;font-weight:800}
.ssub{font-size:11px;color:var(--t2);margin-top:3px}
.baja{opacity:.3}
.mnav{display:flex;gap:10px;margin-bottom:14px;align-items:center}
.mnav span{flex:1;text-align:center;font-size:18px;font-weight:800;letter-spacing:-.3px}
.trow{display:flex;gap:6px;margin-bottom:14px;background:var(--c2);padding:5px;border-radius:12px;border:1px solid var(--brd2)}
.tbtn{flex:1;padding:9px;border-radius:9px;border:none;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;background:transparent;color:var(--t2);transition:.18s}
.tbtn.on{background:var(--surf);color:var(--tx);box-shadow:var(--sh)}

/* ── CALENDAR ── */
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-top:8px}
.ch{font-size:9px;text-align:center;font-weight:700;color:var(--t3);padding:4px}
.cd{font-family:var(--num);font-size:12px;font-weight:500;text-align:center;padding:7px 2px;border-radius:8px;color:var(--t2)}
.cd.hb{background:var(--bl-l);color:var(--bl);font-weight:700}
.cd.hb.san{background:var(--re-l);color:var(--re)}
.cd.pd{background:var(--gr-l);color:var(--gr);font-weight:700}
.cd.today{outline:2px solid var(--bl);outline-offset:-2px;font-weight:800;color:var(--tx)}
.cd.empty{opacity:0}
.cd.urg{background:var(--re-l);color:var(--re);font-weight:800;animation:urgpulse 2s ease infinite}
@keyframes urgpulse{0%,100%{opacity:1}50%{opacity:.6}}

/* ── OBJETIVOS ── */
.oc{background:var(--surf);border-radius:var(--r);padding:16px;margin-bottom:10px;border:1px solid var(--brd2);box-shadow:var(--sh)}
.oc.done{background:linear-gradient(135deg,#E6F7F2,#F0FCF8);border-color:var(--gr-m)}
.oc.cumplido{opacity:.5}
.dbd{display:inline-flex;align-items:center;padding:4px 10px;border-radius:100px;font-size:11px;font-weight:700}
.d-ok{background:var(--gr-l);color:var(--gr)}.d-sn{background:var(--am-l);color:var(--am)}
.d-urg{background:var(--re-l);color:var(--re)}.d-no{background:var(--c2);color:var(--t2)}


.sdot{position:fixed;bottom:84px;right:14px;width:9px;height:9px;border-radius:50%;z-index:199;opacity:0;transition:opacity .4s}
.sdot.saving{opacity:1;background:var(--am);animation:pulse 1s ease infinite}
.sdot.saved{opacity:1;background:var(--gr)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
</style>
</head>
<body>

<!-- SYNC DOT -->
<div class="sdot" id="sdot"></div>

<!-- HERO + ACCOUNTS -->
<div class="hero" id="hero"><div class="hero-in">
  <div class="hero-lbl">Patrimonio total</div>
  <div class="hero-num" id="heroNum">—</div>
  <div class="hero-date" id="heroDate"></div>
</div></div>
<div class="acs" id="acctBar"></div>

<!-- SECTIONS -->
<div class="sec active" id="s-dash"></div>
<div class="sec" id="s-cal"></div>
<div class="sec" id="s-obj"></div>
<div class="sec" id="s-prod"></div>
<div class="sec" id="s-gest"></div>

<!-- NAV -->
<nav class="bnav">
  <button class="nb on" onclick="show('dash',this)">
    <div class="ni"><svg class="ns" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></div>
    <span class="nl">Hoy</span>
  </button>
  <button class="nb" onclick="show('cal',this)">
    <div class="ni"><svg class="ns" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></div>
    <span class="nl">Calendario</span>
  </button>
  <button class="nb" onclick="show('obj',this)">
    <div class="ni"><svg class="ns" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg></div>
    <span class="nl">Objetivos</span>
  </button>
  <button class="nb" onclick="show('prod',this)">
    <div class="ni"><svg class="ns" viewBox="0 0 24 24"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg></div>
    <span class="nl">Productos</span>
  </button>
  <button class="nb" onclick="show('gest',this)">
    <div class="ni"><svg class="ns" viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg></div>
    <span class="nl">Gestor</span>
  </button>
</nav>

<!-- FAB -->
<button class="fab" id="fab" onclick="openSheet()">+</button>

<!-- QUICK SHEET -->
<div class="sheet-overlay" id="sheetOverlay" onclick="closeSheet()"></div>
<div class="sheet" id="sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-title">¿Qué quieres añadir?</div>
  <div class="sheet-grid">
    <button class="sheet-btn" onclick="quickAction('fijo')"><div class="sheet-btn-ico">📌</div><div class="sheet-btn-lbl">Gasto fijo</div><div class="sheet-btn-sub">Mensual, trimestral o anual</div></button>
    <button class="sheet-btn" onclick="quickAction('fraccionado')"><div class="sheet-btn-ico">🔢</div><div class="sheet-btn-lbl">Fraccionado</div><div class="sheet-btn-sub">Con fecha inicio y fin</div></button>
    <button class="sheet-btn" onclick="quickAction('puntual')"><div class="sheet-btn-ico">💡</div><div class="sheet-btn-lbl">Gasto puntual</div><div class="sheet-btn-sub">Un mes concreto</div></button>
    <button class="sheet-btn" onclick="quickAction('bizum')"><div class="sheet-btn-ico">💬</div><div class="sheet-btn-lbl">Bizum / Deuda</div><div class="sheet-btn-sub">Lo que debo pagar</div></button>
    <button class="sheet-btn" onclick="quickAction('iva')"><div class="sheet-btn-ico">🧾</div><div class="sheet-btn-lbl">IVA</div><div class="sheet-btn-sub">Acumulado anual</div></button>
    <button class="sheet-btn" onclick="quickAction('saldo')"><div class="sheet-btn-ico">📊</div><div class="sheet-btn-lbl">Actualizar saldo</div><div class="sheet-btn-sub">BBVA · Santander · TR</div></button>
  </div>
</div>

<!-- QUICK FORM OVERLAY -->
<div class="sheet-overlay" id="qfOverlay" onclick="closeQF()" style="z-index:500"></div>
<div class="sheet" id="qfSheet" style="z-index:501;padding-bottom:calc(22px + env(safe-area-inset-bottom))">
  <div class="sheet-handle"></div>
  <div id="qfContent"></div>
</div>

<script>
// ══════════════════════════════════════════════════════
// CONSTANTS & UTILS
// ══════════════════════════════════════════════════════
const hoy=new Date();
const SK='marta-fin-v4';
const MN=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const MC=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const DS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
document.getElementById('heroDate').textContent=`${DS[hoy.getDay()]}, ${hoy.getDate()} de ${MN[hoy.getMonth()]} de ${hoy.getFullYear()}`;

const fmt=n=>n==null?'—':Math.abs(parseFloat(n)).toFixed(2).replace('.',',')+' €';
const fmtS=n=>{const v=parseFloat(n);return(v>=0?'+':'-')+Math.abs(v).toFixed(2).replace('.',',')+' €';}
const mk=(y,m)=>`${y}-${String(m).padStart(2,'0')}`;
const $=id=>document.getElementById(id);
function isPast(dia,y,m){
  const ty=hoy.getFullYear(),tm=hoy.getMonth(),td=hoy.getDate();
  if(y<ty||(y===ty&&m<tm))return true;
  return y===ty&&m===tm&&dia<=td; // <= so today counts as "past/done"
}
function isToday(dia,y,m){return hoy.getFullYear()===y&&hoy.getMonth()===m&&hoy.getDate()===dia;}
function gastoAplica(g,y,m){
  if(g.anulado)return false;
  // Check start date if defined
  if(g.iniAnio!==undefined){
    if(y<g.iniAnio||(y===g.iniAnio&&m<g.iniMes))return false;
  }
  if(g.tipo==='fijo'||g.tipo==='habitual'){
    if(g.finAnio!==undefined&&(y>g.finAnio||(y===g.finAnio&&m>g.finMes)))return false;
    if(g.frec==='monthly')return true;
    if(g.frec==='quarterly')return g.meses&&g.meses.includes(m);
    if(g.frec==='annual')return g.mesAnual===m;
    return false;
  }
  if(g.tipo==='fraccionado'){
    if(y<g.iniAnio||(y===g.iniAnio&&m<g.iniMes))return false;
    if(g.finAnio!==undefined&&(y>g.finAnio||(y===g.finAnio&&m>g.finMes)))return false;
    return true;
  }
  if(g.tipo==='puntual')return g.anio===y&&g.mesAnual===m;
  return false;

function diasRestantes(f){if(!f)return null;const fd=new Date(f);fd.setHours(0,0,0,0);const hd=new Date();hd.setHours(0,0,0,0);return Math.ceil((fd-hd)/864e5);}

function fromDate(f){if(!f)return'';const p=f.split('-');return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:''}

let _saveTimer=null;

function showS(s){const d=$('sdot');if(!d)return;d.className='sdot '+s;if(s==='saved')setTimeout(()=>{d.className='sdot';},2500);}

function saveLocal(){
  try{
    DB._ts=Date.now(); // timestamp para detectar conflictos
    localStorage.setItem(SK,JSON.stringify(DB));
  }catch(e){console.warn('localStorage write failed',e);}
}

function loadLocal(){
  try{
    const r=localStorage.getItem(SK);
    if(r){const t=JSON.parse(r);if(t._v>=4){DB=t;fixDB();}}
  }catch(e){}
}

// Cola de guardado: debounce 1s para no saturar Supabase
function save(){
  saveLocal();
  if(_saveTimer)clearTimeout(_saveTimer);
  _pendingSave=true;
  showS('saving');
  _saveTimer=setTimeout(flushSave,1200);
}

async function flushSave(retries=3){
  if(!_pendingSave)return;
  _pendingSave=false;
  for(let i=0;i<retries;i++){
    try{
      const r=await fetch(`${SB_URL}/rest/v1/${SB_TBL}`,{
        method:'POST',
        headers:{'apikey':SB_KEY,'Authorization':`Bearer ${SB_KEY}`,'Content-Type':'application/json','Prefer':'resolution=merge-duplicates'},
        body:JSON.stringify({id:'main',db_data:DB,updated_at:new Date().toISOString()})
      });
      if(r.ok){showS('saved');localStorage.removeItem(SK_QUEUE);return;}
    }catch(e){
      if(i<retries-1){await new Promise(r=>setTimeout(r,1500*(i+1)));}
    }
  }
  // Guardado fallido → encola para reintentar
  showS('');
  try{localStorage.setItem(SK_QUEUE,'1');}catch(e){}
  console.warn('Supabase save failed after retries. Data safe in localStorage.');
}

async function loadCloud(){
  try{
    const r=await fetch(`${SB_URL}/rest/v1/${SB_TBL}?id=eq.main&select=*`,{
      headers:{'apikey':SB_KEY,'Authorization':`Bearer ${SB_KEY}`,'Content-Type':'application/json'}
    });
    if(r.ok){
      const rows=await r.json();
      if(rows?.length>0&&rows[0].db_data?._v>=4){
        const cloud=rows[0].db_data;
        const localTs=DB._ts||0;
        const cloudTs=cloud._ts||0;
        // Solo carga cloud si es más reciente que local
        if(cloudTs>localTs){
          DB=cloud;fixDB();saveLocal();return true;
        }
      }
    }
  }catch(e){console.warn('cloud load:',e);}
  // Si había guardados pendientes en cola, reintentar
  if(localStorage.getItem(SK_QUEUE)){flushSave();}
  return false;
}

  $('s-dash').innerHTML=h;
}
function pagDeuda(id){const d=DB.deudas.find(x=>x.id===id);if(!d)return;d.pagada=true;d.pagadaMes=mk(hoy.getFullYear(),hoy.getMonth());save();renderDash();}

// ══════════════════════════════════════════════════════
// CALENDARIO
// ══════════════════════════════════════════════════════
let calY=hoy.getFullYear(),calM=hoy.getMonth(),calV='bbva';
function renderCal(){
  const y=calY,m=calM;
  const esBBVA=calV==='bbva';
  const col=esBBVA?'var(--bl)':'var(--re)';
  const colL=esBBVA?'var(--bl-l)':'var(--re-l)';
  const pfC=esBBVA?'pf-bl':'pf-re';
  const gastos=DB.gastos.filter(g=>g.cuenta===calV&&gastoAplica(g,y,m)).sort((a,b)=>dG(a)-dG(b));
  let tot=0,pag=0,pend=0;
  gastos.forEach(g=>{
    tot+=g.importe;
    // SOLO cuenta como pagado si el usuario lo ha marcado manualmente
    if(isPagado(g.id,y,m))pag+=g.importe;
    else pend+=g.importe;
  });
  const pct=tot>0?Math.round(pag/tot*100):0;

  // Calendar grid
  const byDay={};gastos.forEach(g=>{const d=dG(g);if(!byDay[d])byDay[d]=[];byDay[d].push(g);});
  const fd=new Date(y,m,1).getDay(),offset=fd===0?6:fd-1;
  const dInM=new Date(y,m+1,0).getDate();
  let cH='';
  for(let i=0;i<offset;i++)cH+=`<div class="cd empty">·</div>`;
  for(let d=1;d<=dInM;d++){
    const isT=hoy.getFullYear()===y&&hoy.getMonth()===m&&d===hoy.getDate();
    const bills=byDay[d];
    let cls='cd';
    if(bills){
      const allPaid=bills.every(g=>isPagado(g.id,y,m));
      const hasPast=isPast(d,y,m)&&!allPaid;
      if(allPaid) cls+=' pd';
      else if(hasPast) cls+=' urg'; // vencido sin pagar
      else cls+=esBBVA?' hb':' hb san';
    }
    if(isT)cls+=' today';
    cH+=`<div class="${cls}">${d}</div>`;
  }

  // List — SIEMPRE botón manual, nunca auto
  const lH=gastos.map(g=>{
    const pagM=isPagado(g.id,y,m);
    const vencido=isPast(dG(g),y,m)&&!pagM;
    const isHoy=isToday(dG(g),y,m);
    return `<div class="li" style="${vencido?'background:rgba(224,89,90,.06);border-radius:10px;margin:2px -4px;padding:10px 12px;':''}">
      <div class="li-ico" style="background:${pagM?'var(--gr-l)':vencido?'var(--re-l)':colL};color:${pagM?'var(--gr)':vencido?'var(--re)':col};font-size:9px;font-weight:800">${isHoy?'HOY':'d.'+dG(g)}</div>
      <div class="li-body">
        <div class="li-name">${g.nombre} ${finLbl(g)}</div>
        <div class="li-sub">${tipoLbl(g.tipo)}${g.frec?' · '+frecLbl(g.frec):''}${vencido?' · <span style="color:var(--re);font-weight:700">Pendiente de confirmar</span>':''}</div>
      </div>
      <div class="li-amt" style="color:${pagM?'var(--gr)':'var(--re)'};margin-right:8px">−${fmt(g.importe)}</div>
      <button class="btn-pg${pagM?' done':''}" onclick="togglePag(${g.id},${y},${m},renderCal)">
        ${pagM?'✓ Pagado':'Marcar pagado'}
      </button>
    </div>`;
  }).join('')||`<div style="font-size:13px;color:var(--t2);padding:16px 0;text-align:center">Sin gastos registrados este mes</div>`;

  $('s-cal').innerHTML=`
    <div class="mnav">
      <button class="btn-gh" style="padding:9px 18px;font-size:16px" onclick="calMes(-1)">←</button>
      <span>${MC[m]} ${y}</span>
      <button class="btn-gh" style="padding:9px 18px;font-size:16px" onclick="calMes(1)">→</button>
    </div>
    <div class="trow">
      <button class="tbtn${calV==='bbva'?' on':''}" onclick="calV='bbva';renderCal()">💳 BBVA</button>
      <button class="tbtn${calV==='san'?' on':''}" onclick="calV='san';renderCal()">🏦 Santander</button>
    </div>
    <div class="g3" style="margin-bottom:12px">
      <div class="sbox" style="padding:12px;text-align:center;border-top:3px solid ${col}"><div class="slbl">Total</div><div style="font-family:var(--num);font-size:17px;font-weight:800;color:${col}">−${fmt(tot)}</div></div>
      <div class="sbox" style="padding:12px;text-align:center"><div class="slbl">Pagado</div><div style="font-family:var(--num);font-size:17px;font-weight:800;color:var(--gr)">−${fmt(pag)}</div></div>
      <div class="sbox" style="padding:12px;text-align:center"><div class="slbl">Pendiente</div><div style="font-family:var(--num);font-size:17px;font-weight:800;color:var(--re)">−${fmt(pend)}</div></div>
    </div>
    <div class="card" style="padding:12px;margin-bottom:12px">
      <div class="cg"><div class="ch">L</div><div class="ch">M</div><div class="ch">X</div><div class="ch">J</div><div class="ch">V</div><div class="ch">S</div><div class="ch">D</div></div>
      <div class="cg">${cH}</div>
      <div style="margin-top:10px"><div class="prog" style="height:7px;margin:0"><div class="pf ${pfC}" style="width:${pct}%"></div></div><div style="font-size:11px;color:var(--t2);margin-top:4px">${pct}% pagado del mes</div></div>
    </div>
    <div class="card" style="border-top:3px solid ${col}">
      <div class="chdr"><span class="ctit" style="color:${col}">${esBBVA?'BBVA':'Santander'} · ${MC[m]} ${y}</span></div>
      ${lH}
    </div>`;
}
function calMes(d){calM+=d;if(calM>11){calM=0;calY++;}if(calM<0){calM=11;calY--;}renderCal();}

// ══════════════════════════════════════════════════════
// OBJETIVOS
// ══════════════════════════════════════════════════════
function renderObj(){
  const saldoTR=DB.saldos.tr?.val||0;
  const activos=DB.objetivos.filter(o=>!o.cumplido);
  const cumplidos=DB.objetivos.filter(o=>o.cumplido);
  const totalAsig=activos.reduce((s,o)=>s+(o.asignado||0),0);
  const libre=saldoTR-totalAsig;
  const ordenados=[...activos].sort((a,b)=>{if(!a.fecha&&!b.fecha)return 0;if(!a.fecha)return 1;if(!b.fecha)return-1;return new Date(a.fecha)-new Date(b.fecha);});

  let h=`<div class="ptit" style="color:var(--tr)">Objetivos · Trade Republic</div>
  <div class="card" style="border-top:3px solid var(--tr)">
    <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:12px">
      <div><div class="slbl" style="color:var(--tr)">Saldo TR disponible</div><div style="font-family:var(--num);font-size:32px;font-weight:800;margin-top:4px">${fmt(saldoTR)}</div></div>
      <div style="text-align:right"><div class="slbl">Sin asignar</div><div style="font-family:var(--num);font-size:20px;font-weight:800;margin-top:4px;color:${libre<0?'var(--re)':libre<50?'var(--am)':'var(--gr)'}">${fmt(libre)}</div></div>
    </div>
    <div class="prog" style="height:8px"><div class="pf pf-tr" style="width:${saldoTR>0?Math.min(100,totalAsig/saldoTR*100).toFixed(1):0}%"></div></div>
    <div style="font-size:11px;color:var(--t2);margin-top:4px">${fmt(totalAsig)} asignado · ${fmt(libre)} libre</div>
    <div style="margin-top:13px;padding-top:13px;border-top:1px solid var(--brd2)">
      <div class="g2">
        <div class="fr"><label>Actualizar saldo TR (€)</label><input type="number" id="trS" value="${saldoTR}" step="0.01" inputmode="decimal"/></div>
        <div class="fr"><label>Fecha</label><input type="date" id="trF" value="${toDate(DB.saldos.tr?.fecha)}"/></div>
      </div>
      <button class="btn btn-tr" onclick="actTR()">Actualizar</button>
    </div>
  </div>`;

  h+=ordenados.map((o,idx)=>{
    const asig=o.asignado||0,faltan=Math.max(0,o.meta-asig);
    const pct=o.meta>0?Math.min(100,Math.round(asig/o.meta*100)):0,cub=pct>=100;
    const dias=diasRestantes(o.fecha);
    let dCls='d-no',dTxt='Sin fecha';
    if(dias!==null){if(dias<0){dTxt='Vencido';dCls='d-urg';}else if(dias<=30){dTxt=`${dias}d`;dCls='d-urg';}else if(dias<=90){dTxt=`${dias}d`;dCls='d-sn';}else{dTxt=`${dias}d`;dCls='d-ok';}}
    return `<div class="oc${cub?' done':''}">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
        <div style="width:26px;height:26px;border-radius:50%;background:${cub?'var(--gr)':'var(--tr-l)'};color:${cub?'#fff':'var(--tr)'};display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex-shrink:0">${cub?'✓':idx+1}</div>
        <div style="flex:1"><div style="font-size:16px;font-weight:800;color:${cub?'var(--gr)':'var(--tx)'}">${o.nombre}</div><div style="font-size:11px;color:var(--t2);margin-top:2px">${o.fecha?new Date(o.fecha).toLocaleDateString('es-ES',{day:'2-digit',month:'long',year:'numeric'}):'Sin fecha límite'}</div></div>
        <span class="dbd ${dCls}">${dTxt}</span>
      </div>
      <div style="display:flex;align-items:center;gap:12px;padding:14px;background:var(--c2);border-radius:var(--rs);margin-bottom:10px">
        <div style="flex:1">
          <div style="font-size:10px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px">€ Asignado de mi TR</div>
          <input type="number" value="${asig}" step="5" min="0" inputmode="decimal"
            style="font-family:var(--num);font-size:26px;font-weight:800;width:100%;padding:6px 10px;border-radius:10px;border:2px solid ${cub?'var(--gr-m)':'var(--tr-m)'};background:#fff;color:${cub?'var(--gr)':'var(--tr)'};text-align:center;-webkit-appearance:none"
            onchange="asigObj(${o.id},this.value)" onfocus="this.select()"/>
        </div>
        <div style="text-align:right;flex-shrink:0">
          <div style="font-size:10px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px">Meta</div>
          <div style="font-family:var(--num);font-size:18px;font-weight:800">${fmt(o.meta)}</div>
          ${faltan>0
            ?`<div style="font-size:11px;font-weight:700;color:var(--re);margin-top:3px">Faltan ${fmt(faltan)}</div>`
            :`<div style="font-size:18px;margin-top:3px">✅</div>`
          }
        </div>
      </div>
      <div class="prog" style="margin-bottom:6px"><div class="pf ${cub?'pf-gr':'pf-tr'}" style="width:${pct}%"></div></div>
      <div style="font-size:11px;color:var(--t2);margin-bottom:12px">${pct}% cubierto</div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-gr" style="flex:2;padding:11px;font-size:13px" onclick="marcarCump(${o.id})">✓ Cumplido</button>
        <button class="btn-gh" style="flex:1;padding:11px;font-size:12px" onclick="et('eo-${o.id}')">✏️ Editar</button>
      </div>
      <div id="eo-${o.id}" class="ep">
        <div class="g2"><div class="fr"><label>Nombre</label><input type="text" id="oN-${o.id}" value="${o.nombre}"/></div><div class="fr"><label>Meta (€)</label><input type="number" id="oM-${o.id}" value="${o.meta}" step="0.01" inputmode="decimal"/></div><div class="fr"><label>Fecha límite</label><input type="date" id="oF-${o.id}" value="${o.fecha||''}"/></div></div>
        <div style="display:flex;gap:8px">
          <button class="btn btn-gr" style="flex:1;padding:10px" onclick="guardarObj(${o.id})">Guardar</button>
          <button class="btn btn-re" style="flex:1;padding:10px" onclick="borrarObj(${o.id})">Eliminar</button>
        </div>
      </div>
    </div>`;
  }).join('');

  // Cumplidos
  if(cumplidos.length) h+=`<div class="card" style="opacity:.55">
    <div class="chdr"><span class="ctit">Cumplidos 🎉</span></div>
    ${cumplidos.map(o=>`<div class="li">
      <div class="li-ico" style="background:var(--gr-l);color:var(--gr)">✓</div>
      <div class="li-body"><div class="li-name" style="text-decoration:line-through;color:var(--t2)">${o.nombre}</div></div>
      <button class="btn-gh" style="font-size:11px;padding:5px 10px;flex-shrink:0" onclick="descump(${o.id})">Desmarcar</button>
      <div class="li-act" onclick="borrarObj(${o.id})" style="border:none;margin-left:4px"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="var(--t2)" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></div>
    </div>`).join('')}
  </div>`;

  h+=`<div class="card" style="border:2px dashed var(--brd)">
    <div class="ctit" style="margin-bottom:13px">Nuevo objetivo</div>
    <div class="g2"><div class="fr"><label>Nombre</label><input type="text" id="oNN" placeholder="Ej: Viaje Roma"/></div><div class="fr"><label>Meta (€)</label><input type="number" id="oNM" step="0.01" inputmode="decimal" placeholder="0,00"/></div><div class="fr"><label>Fecha límite</label><input type="date" id="oNF"/></div></div>
    <button class="btn btn-tr" onclick="addObj()">Guardar objetivo</button>
  </div>`;
  $('s-obj').innerHTML=h;
}
function actTR(){const v=parseFloat($('trS').value),f=fromDate($('trF').value);if(isNaN(v))return;DB.saldos.tr={val:v,fecha:f};save();renderObj();}
function asigObj(id,val){const o=DB.objetivos.find(x=>x.id===id);if(!o)return;o.asignado=Math.max(0,parseFloat(val)||0);save();}
function marcarCump(id){const o=DB.objetivos.find(x=>x.id===id);if(!o)return;o.cumplido=true;save();renderObj();}
function descump(id){const o=DB.objetivos.find(x=>x.id===id);if(!o)return;o.cumplido=false;save();renderObj();}
function guardarObj(id){const o=DB.objetivos.find(x=>x.id===id);if(!o)return;const n=$('oN-'+id)?.value.trim();if(n)o.nombre=n;const m=parseFloat($('oM-'+id)?.value);if(!isNaN(m))o.meta=m;const f=$('oF-'+id)?.value;if(f!==undefined)o.fecha=f;save();renderObj();}
function borrarObj(id){DB.objetivos=DB.objetivos.filter(x=>x.id!==id);save();renderObj();}
function addObj(){const n=$('oNN').value.trim(),m=parseFloat($('oNM').value),f=$('oNF').value;if(!n||isNaN(m))return;DB.objetivos.push({id:Date.now(),nombre:n,meta:m,asignado:0,fecha:f,cumplido:false});save();renderObj();}

function updNExtra(){const t=$('nT')?.value,el=$('nExtra');if(!el)return;if(t==='fijo'||t==='habitual')el.innerHTML=`<div class="g2"><div class="fr"><label>Frecuencia</label><select id="nF"><option value="monthly">Mensual</option><option value="quarterly">Trimestral</option><option value="annual">Anual</option></select></div><div class="fr"><label>Fin (opcional)</label><input type="month" id="nFin"/></div></div>`;else if(t==='fraccionado')el.innerHTML=`<div class="g2"><div class="fr"><label>Mes inicio</label><input type="month" id="nIni" value="${hoy.getFullYear()}-${String(hoy.getMonth()+1).padStart(2,'0')}"/></div><div class="fr"><label>Mes fin</label><input type="month" id="nFin"/></div></div>`;else if(t==='puntual')el.innerHTML=`<div class="fr"><label>Mes</label><input type="month" id="nMes" value="${hoy.getFullYear()}-${String(hoy.getMonth()+1).padStart(2,'0')}"/></div>`;else el.innerHTML='';}
function addG(){
  const n=$('nN').value.trim(),i=parseFloat($('nI').value),d=parseInt($('nD').value)||1,c=$('nC').value,t=$('nT').value,msg=$('nMsg');
  if(!n||isNaN(i)||i<=0){msg.className='merr';msg.textContent='⚠ Nombre e importe obligatorios';return;}
  const g={id:Date.now(),nombre:n,importe:i,cuenta:c,tipo:t,dia:d};
  if(t==='fijo'||t==='habitual'){g.frec=$('nF')?.value||'monthly';if(g.frec==='quarterly')g.meses=[0,3,6,9];if(g.frec==='annual')g.mesAnual=hoy.getMonth();const fin=$('nFin')?.value;if(fin){const[fy,fm]=fin.split('-').map(Number);g.finAnio=fy;g.finMes=fm-1;}}
  if(t==='fraccionado'){const ini=$('nIni')?.value,fin=$('nFin')?.value;if(!ini||!fin){msg.className='merr';msg.textContent='⚠ Indica mes inicio y fin';return;}const[iy,im]=ini.split('-').map(Number);const[fy,fm]=fin.split('-').map(Number);g.iniAnio=iy;g.iniMes=im-1;g.finAnio=fy;g.finMes=fm-1;}
  if(t==='puntual'){const mes=$('nMes')?.value;if(mes){const[y,m]=mes.split('-').map(Number);g.anio=y;g.mesAnual=m-1;}else{g.anio=hoy.getFullYear();g.mesAnual=hoy.getMonth();}}
  DB.gastos.push(g);save();msg.className='mok';msg.textContent='✓ Añadido correctamente';setTimeout(()=>renderGest(),800);
}
function guardarG(id){
  const g=DB.gastos.find(x=>x.id===id);if(!g)return;
  const n=$('gN-'+id)?.value.trim();if(n)g.nombre=n;
  const i=parseFloat($('gI-'+id)?.value);if(!isNaN(i))g.importe=i;
  const d=parseInt($('gD-'+id)?.value);if(!isNaN(d)&&d>=1&&d<=31)g.dia=d;
  const c=$('gC-'+id)?.value;if(c)g.cuenta=c;
  const t=$('gT-'+id)?.value;if(t)g.tipo=t;
  const f=$('gF-'+id)?.value;if(f)g.frec=f;
  // Fecha inicio — siempre presente ahora
  const iniAll=$('gIniAll-'+id)?.value;
  if(iniAll){const[iy,im]=iniAll.split('-').map(Number);g.iniAnio=iy;g.iniMes=im-1;}
  else{delete g.iniAnio;delete g.iniMes;}
  // Trimestral: recalcular meses desde iniMes
  if(g.frec==='quarterly'&&g.iniMes!==undefined)g.meses=calcMeses(g.iniMes);
  if(g.frec==='annual'&&g.iniMes!==undefined)g.mesAnual=g.iniMes;
  const fin=$('gFin-'+id)?.value;
  if(fin){const[fy,fm]=fin.split('-').map(Number);g.finAnio=fy;g.finMes=fm-1;}else{delete g.finAnio;delete g.finMes;}
  const finF=$('gFinF-'+id)?.value;
  if(finF&&g.tipo==='fraccionado'){const[fy,fm]=finF.split('-').map(Number);g.finAnio=fy;g.finMes=fm-1;}
  const mes=$('gMes-'+id)?.value;
  if(mes&&g.tipo==='puntual'){const[y,m]=mes.split('-').map(Number);g.anio=y;g.mesAnual=m-1;}
  save();renderGest();
}
function anularG(id){const g=DB.gastos.find(x=>x.id===id);if(!g)return;g.anulado=true;save();renderGest();}
function reactivarG(id){const g=DB.gastos.find(x=>x.id===id);if(!g)return;delete g.anulado;save();renderGest();}
function borrarG(id){DB.gastos=DB.gastos.filter(x=>x.id!==id);save();renderGest();}
function limpiarAnul(){DB.gastos=DB.gastos.filter(x=>!x.anulado);save();renderGest();}
function addIVA(){const n=$('ivaN').value.trim(),i=parseFloat($('ivaI').value);if(!n||isNaN(i))return;DB.iva.push({id:Date.now(),nombre:n,importe:i,fecha:hoy.toLocaleDateString('es-ES')});save();renderGest();}
function borrarIVA(id){DB.iva=DB.iva.filter(x=>x.id!==id);save();renderGest();}
function liquidarIVA(){DB.iva=[];save();renderGest();}
function addDeuda(){const n=$('dN').value.trim(),i=parseFloat($('dI').value),nt=$('dNt').value.trim(),msg=$('dMsg');if(!n||isNaN(i)||i<=0){msg.className='merr';msg.textContent='⚠ Nombre e importe obligatorios';return;}DB.deudas.push({id:Date.now(),nombre:n,importe:i,notas:nt,pagada:false});save();msg.className='mok';msg.textContent='✓ Añadido';setTimeout(()=>renderGest(),800);}
function toggleDeuda(id){const d=DB.deudas.find(x=>x.id===id);if(!d)return;d.pagada=!d.pagada;d.pagadaMes=mk(hoy.getFullYear(),hoy.getMonth());save();renderGest();}
function borrarDeuda(id){DB.deudas=DB.deudas.filter(x=>x.id!==id);save();renderGest();}
function actS(c,si,fi){const v=parseFloat($(si).value),f=fromDate($(fi).value);if(isNaN(v))return;DB.saldos[c]={val:v,fecha:f};save();const m=$('sMsg');if(m){m.className='mok';m.textContent='✓ Guardado';setTimeout(()=>{if(m)m.textContent='';},2000);}}

// ══════════════════════════════════════════════════════
// FAB + QUICK SHEET + QUICK FORMS
// ══════════════════════════════════════════════════════
function openSheet(){$('sheetOverlay').classList.add('open');$('sheet').classList.add('open');}
function closeSheet(){$('sheetOverlay').classList.remove('open');$('sheet').classList.remove('open');}
function openQF(html){$('qfContent').innerHTML=html;$('qfOverlay').classList.add('open');$('qfSheet').classList.add('open');}
function closeQF(){$('qfOverlay').classList.remove('open');$('qfSheet').classList.remove('open');}

const mesCurrent=`${hoy.getFullYear()}-${String(hoy.getMonth()+1).padStart(2,'0')}`;
function calcMeses(sm){return[sm,(sm+3)%12,(sm+6)%12,(sm+9)%12];}

function quickAction(type){
  closeSheet();
  if(type==='fijo') openQF(`
    <div class="sheet-title">📌 Gasto fijo</div>
    <div class="fr"><label>Concepto</label><input type="text" id="qN" placeholder="Ej: Cuota gimnasio" autofocus/></div>
    <div class="g2">
      <div class="fr"><label>Importe (€)</label><input type="number" id="qI" step="0.01" inputmode="decimal" placeholder="0,00"/></div>
      <div class="fr"><label>Día de cargo</label><input type="number" id="qD" min="1" max="31" placeholder="${hoy.getDate()}"/></div>
    </div>
    <div class="g2">
      <div class="fr"><label>Banco</label><select id="qC"><option value="bbva">BBVA</option><option value="san">Santander</option></select></div>
      <div class="fr"><label>Frecuencia</label><select id="qF" onchange="updFijoExtra()"><option value="monthly">Mensual</option><option value="quarterly">Trimestral</option><option value="annual">Anual</option></select></div>
    </div>
    <div id="qFrecInfo" style="font-size:12px;color:var(--bl);font-weight:600;margin-bottom:11px"></div>
    <div class="fr"><label>Mes de inicio</label><input type="month" id="qIni" value="${mesCurrent}" onchange="updFijoExtra()"/></div>
    <div id="qFrecPreview"></div>
    <button class="btn btn-bl" style="margin-top:4px" onclick="saveFijo()">Guardar</button>
    <div id="qMsg"></div>`);

  if(type==='fraccionado') openQF(`
    <div class="sheet-title">🔢 Gasto fraccionado</div>
    <div class="fr"><label>Concepto</label><input type="text" id="qN" placeholder="Ej: Sofá a plazos" autofocus/></div>
    <div class="g2">
      <div class="fr"><label>Importe/mes (€)</label><input type="number" id="qI" step="0.01" inputmode="decimal" placeholder="0,00"/></div>
      <div class="fr"><label>Día de cargo</label><input type="number" id="qD" min="1" max="31" placeholder="${hoy.getDate()}"/></div>
    </div>
    <div class="fr"><label>Banco</label><select id="qC"><option value="bbva">BBVA</option><option value="san">Santander</option></select></div>
    <div class="g2">
      <div class="fr"><label>Mes inicio</label><input type="month" id="qIni" value="${mesCurrent}"/></div>
      <div class="fr"><label>Mes fin</label><input type="month" id="qFin"/></div>
    </div>
    <button class="btn btn-am" style="margin-top:4px" onclick="saveFraccionado()">Guardar</button>
    <div id="qMsg"></div>`);

  if(type==='puntual') openQF(`
    <div class="sheet-title">💡 Gasto puntual</div>
    <div class="fr"><label>Concepto</label><input type="text" id="qN" placeholder="Ej: Compra Zara, Dentista..." autofocus/></div>
    <div class="g2">
      <div class="fr"><label>Importe (€)</label><input type="number" id="qI" step="0.01" inputmode="decimal" placeholder="0,00"/></div>
      <div class="fr"><label>Día (opcional)</label><input type="number" id="qD" min="1" max="31" placeholder="${hoy.getDate()}"/></div>
    </div>
    <div class="g2">
      <div class="fr"><label>Banco</label><select id="qC"><option value="san">Santander</option><option value="bbva">BBVA</option></select></div>
      <div class="fr"><label>Mes</label><input type="month" id="qMes" value="${mesCurrent}"/></div>
    </div>
    <button class="btn btn-re" style="margin-top:4px" onclick="savePuntual()">Guardar</button>
    <div id="qMsg"></div>`);

  if(type==='bizum') openQF(`
    <div class="sheet-title">💬 Bizum / Deuda</div>
    <div class="fr"><label>¿A quién?</label><input type="text" id="qN" placeholder="Ej: María, cena sábado" autofocus/></div>
    <div class="g2">
      <div class="fr"><label>Importe (€)</label><input type="number" id="qI" step="0.01" inputmode="decimal" placeholder="0,00"/></div>
      <div class="fr"><label>Notas</label><input type="text" id="qNt" placeholder="Opcional"/></div>
    </div>
    <button class="btn btn-re" style="margin-top:4px" onclick="saveBizum()">Guardar</button>
    <div id="qMsg"></div>`);

  if(type==='iva') openQF(`
    <div class="sheet-title">🧾 IVA</div>
    <div class="fr"><label>Concepto</label><input type="text" id="qN" placeholder="Ej: Factura cliente mayo" autofocus/></div>
    <div class="fr"><label>Importe IVA (€)</label><input type="number" id="qI" step="0.01" inputmode="decimal" placeholder="0,00"/></div>
    <button class="btn btn-tr" style="margin-top:4px" onclick="saveIVAQ()">Guardar</button>
    <div id="qMsg"></div>`);

  if(type==='saldo'){gV='saldos';show('gest',document.querySelectorAll('.nb')[4]);}
}

const MN_short=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
function updFijoExtra(){
  const f=$('qF')?.value,ini=$('qIni')?.value,el=$('qFrecPreview'),info=$('qFrecInfo');
  if(!el||!info)return;
  if(!f||!ini){el.innerHTML='';info.textContent='';return;}
  const[,im]=ini.split('-').map(Number);const startM=im-1;
  if(f==='quarterly'){
    const meses=calcMeses(startM);
    info.textContent='Se cargará en:';
    el.innerHTML=`<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:11px">${meses.map(m=>`<span class="tag t-bl">${MN_short[m]}</span>`).join('')}</div>`;
  } else if(f==='annual'){
    info.textContent='';
    el.innerHTML=`<div style="background:var(--bl-l);border-radius:var(--rs);padding:10px 13px;margin-bottom:11px;font-size:12px;font-weight:600;color:var(--bl)">📅 Cada año en ${MN_short[startM]}</div>`;
  } else {
    info.textContent='';el.innerHTML='';
  }
}

function qMsg(ok,txt){const m=$('qMsg');if(m){m.className=ok?'mok':'merr';m.textContent=ok?'✓ '+(txt||'Guardado'):'⚠ '+(txt||'Nombre e importe obligatorios');if(ok)setTimeout(closeQF,900);}}

function saveFijo(){
  const n=$('qN').value.trim(),i=parseFloat($('qI').value),d=parseInt($('qD').value)||hoy.getDate();
  const c=$('qC').value,f=$('qF').value,ini=$('qIni').value;
  if(!n||isNaN(i)||i<=0){qMsg(false);return;}
  const g={id:Date.now(),nombre:n,importe:i,cuenta:c,tipo:'fijo',frec:f,dia:d};
  if(ini){const[iy,im]=ini.split('-').map(Number);g.iniAnio=iy;g.iniMes=im-1;}
  if(f==='quarterly'){const sm=ini?parseInt(ini.split('-')[1])-1:hoy.getMonth();g.meses=calcMeses(sm);}
  if(f==='annual'){g.mesAnual=ini?parseInt(ini.split('-')[1])-1:hoy.getMonth();}
  DB.gastos.push(g);save();qMsg(true);
  setTimeout(()=>{if(currentSec==='dash')renderDash();if(currentSec==='cal')renderCal();if(currentSec==='gest')renderGest();},950);
}
function saveFraccionado(){
  const n=$('qN').value.trim(),i=parseFloat($('qI').value),d=parseInt($('qD').value)||hoy.getDate();
  const c=$('qC').value,ini=$('qIni').value,fin=$('qFin').value;
  if(!n||isNaN(i)||i<=0){qMsg(false);return;}
  if(!ini||!fin){qMsg(false,'Indica mes inicio y fin');return;}
  const[iy,im]=ini.split('-').map(Number);const[fy,fm]=fin.split('-').map(Number);
  DB.gastos.push({id:Date.now(),nombre:n,importe:i,cuenta:c,tipo:'fraccionado',dia:d,iniAnio:iy,iniMes:im-1,finAnio:fy,finMes:fm-1});
  save();qMsg(true);
  setTimeout(()=>{if(currentSec==='dash')renderDash();if(currentSec==='cal')renderCal();if(currentSec==='gest')renderGest();},950);
}
function savePuntual(){
  const n=$('qN').value.trim(),i=parseFloat($('qI').value),d=parseInt($('qD').value)||hoy.getDate();
  const c=$('qC').value,mes=$('qMes').value;
  if(!n||isNaN(i)||i<=0){qMsg(false);return;}
  const[y,m]=mes?mes.split('-').map(Number):[hoy.getFullYear(),hoy.getMonth()+1];
  DB.gastos.push({id:Date.now(),nombre:n,importe:i,cuenta:c,tipo:'puntual',dia:d,anio:y,mesAnual:m-1});
  save();qMsg(true);
  setTimeout(()=>{if(currentSec==='dash')renderDash();if(currentSec==='cal')renderCal();if(currentSec==='gest')renderGest();},950);
}
function saveBizum(){
  const n=$('qN').value.trim(),i=parseFloat($('qI').value),nt=$('qNt')?.value.trim()||'';
  if(!n||isNaN(i)||i<=0){qMsg(false);return;}
  DB.deudas.push({id:Date.now(),nombre:n,importe:i,notas:nt,pagada:false});
  save();qMsg(true);setTimeout(()=>{if(currentSec==='dash')renderDash();},950);
}
function saveIVAQ(){
  const n=$('qN').value.trim(),i=parseFloat($('qI').value);
  if(!n||isNaN(i)||i<=0){qMsg(false);return;}
  DB.iva.push({id:Date.now(),nombre:n,importe:i,fecha:hoy.toLocaleDateString('es-ES')});
  save();qMsg(true);setTimeout(()=>{if(currentSec==='dash')renderDash();},950);
}
