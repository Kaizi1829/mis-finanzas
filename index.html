<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>Mis Finanzas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F0F4FB;--surf:#FFF;--card2:#F7F9FE;--brd:#E4EAF4;--brd2:#EEF2FA;
  --blue:#4A7BE8;--blue-l:#EBF1FD;--blue-m:#C5D6FA;
  --green:#2BAA82;--green-l:#E6F7F2;--green-m:#A8DFD0;
  --red:#E0595A;--red-l:#FDEAEA;--red-m:#F5BBBB;
  --amber:#C87D12;--amber-l:#FDF4E3;--amber-m:#F5D8A0;
  --tr:#6E7EC0;--tr-l:#ECEFFE;--tr-m:#C4CAE8;
  --tx:#1A1F36;--t2:#6B7399;--t3:#B0B8D4;
  --r:18px;--rs:12px;--sh:0 2px 12px rgba(100,120,200,.08);
  --num:'Outfit',sans-serif;
}
body{font-family:'DM Sans',-apple-system,sans-serif;background:var(--bg);color:var(--tx);-webkit-font-smoothing:antialiased;padding-bottom:90px}
.sec{display:none;padding:14px 15px 8px;animation:fi .2s ease}.sec.active{display:block}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* HERO */
.hero{background:linear-gradient(160deg,#C8D8F8 0%,#D8E8F8 40%,#E0F0EC 100%);padding:50px 20px 22px;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;top:-60px;right:-40px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.35)}
.hero::after{content:'';position:absolute;bottom:-50px;left:-20px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.2)}
.hero-inner{position:relative;z-index:1}
.hero-lbl{font-size:11px;font-weight:700;color:rgba(74,123,232,.75);letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px}
.hero-total{font-family:var(--num);font-size:44px;font-weight:800;color:var(--tx);letter-spacing:-.5px;line-height:1}
.hero-date{font-size:11px;color:rgba(74,123,232,.6);margin-top:6px;font-weight:500}
.accts{display:flex;gap:10px;overflow-x:auto;padding:14px 15px 6px;scrollbar-width:none}
.accts::-webkit-scrollbar{display:none}
.ac{flex-shrink:0;width:148px;border-radius:16px;padding:15px;position:relative;overflow:hidden;color:#fff}
.ac::after{content:'';position:absolute;width:90px;height:90px;border-radius:50%;background:rgba(255,255,255,.12);top:-25px;right:-25px}
.ac-lbl{font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;opacity:.7;margin-bottom:10px}
.ac-val{font-family:var(--num);font-size:22px;font-weight:800;line-height:1;margin-bottom:4px;position:relative;z-index:1}
.ac-date{font-size:10px;opacity:.45}
.ac-bb{background:linear-gradient(135deg,#5B8EF0,#82AEFF)}
.ac-sa{background:linear-gradient(135deg,#E07585,#F5A0AC)}
.ac-tr{background:linear-gradient(135deg,#7E8FC4,#A0AFDC)}

/* NAV */
.bnav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.96);backdrop-filter:blur(24px);border-top:1px solid var(--brd);display:flex;padding:10px 2px calc(10px + env(safe-area-inset-bottom));z-index:100;box-shadow:0 -4px 20px rgba(100,120,200,.08)}
.nb{flex:1;padding:3px 2px;border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;font-family:inherit}
.ni{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;transition:.18s}
.nl{font-size:9px;font-weight:700;color:var(--t3);letter-spacing:.03em;transition:.18s}
.ns{width:16px;height:16px;stroke:var(--t3);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:.18s}
.nb.on .ni{background:var(--blue-l)}.nb.on .nl{color:var(--blue)}.nb.on .ns{stroke:var(--blue)}

/* CARDS */
.card{background:var(--surf);border-radius:var(--r);padding:16px;margin-bottom:12px;border:1px solid var(--brd2);box-shadow:var(--sh)}
.chdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}
.ctitle{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--t2)}
.ptitle{font-size:22px;font-weight:800;letter-spacing:-.4px;margin-bottom:15px}

/* LIST ITEMS */
.li{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--brd2)}
.li:last-child{border-bottom:none}
.li-ico{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:10px;font-weight:800}
.li-body{flex:1;min-width:0}
.li-name{font-size:13px;font-weight:600;color:var(--tx)}
.li-sub{font-size:11px;color:var(--t2);margin-top:2px}
.li-amt{font-family:var(--num);font-size:14px;font-weight:700;white-space:nowrap}
.li-btn{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--brd);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;background:transparent}

/* FORMS */
.fr{display:flex;flex-direction:column;gap:5px;margin-bottom:11px}
.fr label{font-size:11px;font-weight:700;color:var(--t2);letter-spacing:.04em}
.fr input,.fr select{padding:11px 13px;font-size:14px;border-radius:var(--rs);border:1.5px solid var(--brd);background:var(--card2);color:var(--tx);width:100%;font-family:inherit;-webkit-appearance:none;transition:.2s}
.fr input:focus,.fr select:focus{outline:none;border-color:var(--blue);background:#fff;box-shadow:0 0 0 3px rgba(74,123,232,.1)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}

/* BUTTONS */
.btn{width:100%;padding:13px;border-radius:var(--rs);border:none;font-size:14px;font-weight:700;cursor:pointer;color:#fff;font-family:inherit;transition:.15s}
.btn:active{transform:scale(.98)}
.btn-bl{background:var(--blue)}.btn-re{background:var(--red)}.btn-gr{background:var(--green)}
.btn-am{background:var(--amber)}.btn-tr{background:var(--tr)}
.btn-dk{background:var(--card2);border:1.5px solid var(--brd);color:var(--tx)}
.btn-gh{padding:9px 14px;border-radius:var(--rs);border:1.5px solid var(--brd);background:var(--surf);color:var(--t2);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
.btn-pg{padding:6px 11px;border-radius:8px;border:1.5px solid var(--green-m);background:var(--green-l);color:var(--green);font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;transition:.15s;flex-shrink:0}
.btn-pg.done{background:var(--green);color:#fff;border-color:var(--green)}

/* TAGS */
.tag{display:inline-flex;align-items:center;font-size:10px;font-weight:700;padding:3px 8px;border-radius:100px;flex-shrink:0}
.tbl{background:var(--blue-l);color:var(--blue)}.tre{background:var(--red-l);color:var(--red)}
.tgr{background:var(--green-l);color:var(--green)}.tam{background:var(--amber-l);color:var(--amber)}
.tgy{background:var(--card2);color:var(--t2)}.ttr{background:var(--tr-l);color:var(--tr)}

/* PROGRESS */
.prog{height:7px;border-radius:4px;background:var(--brd);overflow:hidden;margin:6px 0}
.pf{height:100%;border-radius:4px;transition:.6s}
.pfbl{background:linear-gradient(90deg,#4A7BE8,#82AEFF)}
.pfgr{background:linear-gradient(90deg,#2BAA82,#5BC9A8)}
.pfre{background:linear-gradient(90deg,#E0595A,#F5A0A0)}
.pftr{background:linear-gradient(90deg,#6E7EC0,#9CAAE0)}

/* P&L BOX */
.pnl{border-radius:var(--rs);padding:14px 16px;margin-bottom:12px;border:1px solid transparent}
.pnl-pos{background:var(--green-l);border-color:var(--green-m)}
.pnl-neg{background:var(--red-l);border-color:var(--red-m)}
.pnl-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.pnl-val{font-family:var(--num);font-size:26px;font-weight:800;letter-spacing:-.3px}
.pnl-sub{font-size:11px;margin-top:4px;font-weight:600}

/* MISC */
.ep{background:var(--card2);border-radius:var(--rs);padding:13px;margin-top:10px;display:none;border:1px solid var(--brd2)}
.dlbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--t3);margin:13px 0 8px}
.mok{font-size:13px;font-weight:700;color:var(--green);padding:11px;background:var(--green-l);border-radius:var(--rs);margin-top:10px;text-align:center;border:1px solid var(--green-m)}
.merr{font-size:13px;font-weight:700;color:var(--red);padding:11px;background:var(--red-l);border-radius:var(--rs);margin-top:10px;text-align:center}
.sbox{background:var(--surf);border-radius:14px;padding:14px;border:1px solid var(--brd2);box-shadow:var(--sh)}
.slbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--t2);margin-bottom:6px}
.sval{font-family:var(--num);font-size:22px;font-weight:800}
.ssub{font-size:11px;color:var(--t2);margin-top:3px}
.baja{opacity:.3}
.mnav{display:flex;gap:10px;margin-bottom:14px;align-items:center}
.mnav span{flex:1;text-align:center;font-size:18px;font-weight:800;letter-spacing:-.3px}

/* TOGGLE ROW */
.trow{display:flex;gap:6px;margin-bottom:14px;background:var(--card2);padding:5px;border-radius:12px;border:1px solid var(--brd2)}
.tbtn{flex:1;padding:9px;border-radius:9px;border:none;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;background:transparent;color:var(--t2);transition:.18s}
.tbtn.on{background:var(--surf);color:var(--tx);box-shadow:var(--sh)}

/* CALENDAR */
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-top:8px}
.ch{font-size:9px;text-align:center;font-weight:700;color:var(--t3);padding:4px}
.cd{font-family:var(--num);font-size:12px;font-weight:500;text-align:center;padding:7px 2px;border-radius:8px;color:var(--t2)}
.cd.hb{background:var(--blue-l);color:var(--blue);font-weight:700}
.cd.hb.san{background:var(--red-l);color:var(--red)}
.cd.paid{background:var(--green-l);color:var(--green);font-weight:700}
.cd.today{outline:2px solid var(--blue);outline-offset:-2px;font-weight:800;color:var(--tx)}
.cd.empty{opacity:0}

/* OBJ */
.oc{background:var(--surf);border-radius:var(--r);padding:16px;margin-bottom:10px;border:1px solid var(--brd2);box-shadow:var(--sh)}
.oc.done{background:linear-gradient(135deg,#E6F7F2,#F0FCF8);border-color:var(--green-m)}
.dbd{display:inline-flex;align-items:center;padding:4px 10px;border-radius:100px;font-size:11px;font-weight:700}
.d-ok{background:var(--green-l);color:var(--green)}.d-sn{background:var(--amber-l);color:var(--amber)}
.d-urg{background:var(--red-l);color:var(--red)}.d-no{background:var(--card2);color:var(--t2)}

/* BKBAR */
.bkbar{position:fixed;top:0;right:0;z-index:300;padding:10px 13px;display:flex;gap:8px;pointer-events:none}
.bkbtn{display:flex;align-items:center;gap:5px;padding:6px 12px;border-radius:100px;font-size:11px;font-weight:700;cursor:pointer;background:rgba(255,255,255,.88);backdrop-filter:blur(12px);border:1px solid var(--blue-m);color:var(--blue);font-family:inherit;box-shadow:var(--sh);pointer-events:all}
.sdot{position:fixed;bottom:84px;right:14px;width:9px;height:9px;border-radius:50%;z-index:200;opacity:0;transition:opacity .4s}
.sdot.saving{opacity:1;background:var(--amber);animation:pulse 1s ease infinite}
.sdot.saved{opacity:1;background:var(--green)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
</style>
</head>
<body>

<div class="sdot" id="sdot"></div>
<div class="bkbar">
  <button class="bkbtn" onclick="doExport()">
    <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>Exportar</button>
  <label class="bkbtn" style="cursor:pointer">
    <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>Importar
    <input type="file" accept=".json" style="display:none" onchange="doImport(event)"/>
  </label>
</div>

<div class="hero" id="hero"><div class="hero-inner">
  <div class="hero-lbl">Patrimonio total</div>
  <div class="hero-total" id="heroTotal">—</div>
  <div class="hero-date" id="heroDate"></div>
</div></div>
<div class="accts" id="acctBar"></div>

<div class="sec active" id="s-inicio"></div>
<div class="sec" id="s-cal"></div>
<div class="sec" id="s-obj"></div>
<div class="sec" id="s-prod"></div>
<div class="sec" id="s-gastos"></div>

<nav class="bnav">
  <button class="nb on" onclick="show('inicio',this)">
    <div class="ni"><svg class="ns" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></div>
    <span class="nl">Inicio</span>
  </button>
  <button class="nb" onclick="show('cal',this)">
    <div class="ni"><svg class="ns" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></div>
    <span class="nl">Calendario</span>
  </button>
  <button class="nb" onclick="show('obj',this)">
    <div class="ni"><svg class="ns" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg></div>
    <span class="nl">Objetivos</span>
  </button>
  <button class="nb" onclick="show('prod',this)">
    <div class="ni"><svg class="ns" viewBox="0 0 24 24"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg></div>
    <span class="nl">Productos</span>
  </button>
  <button class="nb" onclick="show('gastos',this)">
    <div class="ni"><svg class="ns" viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg></div>
    <span class="nl">Gastos</span>
  </button>
</nav>

<script>
// ═══════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════
const hoy=new Date();
const SK='marta-v3';
const MN=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const MC=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const DS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
document.getElementById('heroDate').textContent=`${DS[hoy.getDay()]}, ${hoy.getDate()} de ${MN[hoy.getMonth()]} de ${hoy.getFullYear()}`;

const fmt=n=>n==null?'—':Math.abs(parseFloat(n)).toFixed(2).replace('.',',')+' €';
const mk=(y,m)=>`${y}-${String(m).padStart(2,'0')}`;
function isPast(dia,y,m){
  const ty=hoy.getFullYear(),tm=hoy.getMonth(),td=hoy.getDate();
  if(y<ty||(y===ty&&m<tm))return true;
  return y===ty&&m===tm&&dia<td;
}
function gastoAplica(g,y,m){
  // Check if gasto applies in this year/month
  if(g.anulado)return false;
  if(g.tipo==='fijo'||g.tipo==='habitual'){
    if(g.finAnio!==undefined&&(y>g.finAnio||(y===g.finAnio&&m>g.finMes)))return false;
    if(g.frec==='monthly')return true;
    if(g.frec==='quarterly')return g.meses&&g.meses.includes(m);
    if(g.frec==='annual')return g.mesAnual===m;
    return false;
  }
  if(g.tipo==='fraccionado'){
    const sy=g.iniAnio,sm=g.iniMes,ey=g.finAnio,em=g.finMes;
    if(y<sy||(y===sy&&m<sm))return false;
    if(ey!==undefined&&(y>ey||(y===ey&&m>em)))return false;
    return true;
  }
  if(g.tipo==='puntual'){return g.mesAnual===m&&g.anio===y;}
  return false;
}
function diaGasto(g){return g.dia||1;}
function diasRestantes(f){
  if(!f)return null;
  const fd=new Date(f);fd.setHours(0,0,0,0);
  const hd=new Date();hd.setHours(0,0,0,0);
  return Math.ceil((fd-hd)/864e5);
}
function calcCuotas(){
  const ini=new Date('2026-05-01');if(hoy<ini)return 0;
  const m=(hoy.getFullYear()-ini.getFullYear())*12+(hoy.getMonth()-ini.getMonth());
  return Math.min(m+1,DB.prestamo.total);
}
function toDate(f){
  if(!f)return hoy.toISOString().split('T')[0];
  if(f.includes('-'))return f;
  const p=f.split('/');return p.length===3?`${p[2]}-${p[1].padStart(2,'0')}-${p[0].padStart(2,'0')}`:hoy.toISOString().split('T')[0];
}
function fromDate(f){if(!f)return'';const p=f.split('-');return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:''}
function isPagado(gid,y,m){return(DB.pagados[mk(y,m)]||[]).includes(Number(gid));}
function togglePagado(gid,y,m,fn){
  const k=mk(y,m);if(!DB.pagados[k])DB.pagados[k]=[];
  const n=Number(gid),i=DB.pagados[k].indexOf(n);
  if(i>=0)DB.pagados[k].splice(i,1);else DB.pagados[k].push(n);
  save();fn();
}
function et(id){const e=document.getElementById(id);if(e)e.style.display=e.style.display==='block'?'none':'block';}
function eid(id){return document.getElementById(id);}
function tipoLabel(t){return{fijo:'Fijo',fraccionado:'Fraccionado',puntual:'Puntual',habitual:'Habitual',iva:'IVA',bizum:'Bizum'}[t]||t;}
function frecLabel(f){return{monthly:'Mensual',quarterly:'Trimestral',annual:'Anual'}[f]||'';}

// ═══════════════════════════════════════════
// DATABASE
// ═══════════════════════════════════════════
function defaultDB(){return{_v:3,
  saldos:{
    bbva:{val:512,fecha:'22/04/2026'},
    san:{val:12.98,fecha:'22/04/2026'},
    tr:{val:60.87,fecha:'22/04/2026'}
  },
  // GASTOS UNIFICADOS — todos los gastos/recibos en un solo array
  gastos:[
    // BBVA fijos
    {id:1,nombre:'Neting',importe:48.39,cuenta:'bbva',tipo:'fijo',frec:'monthly',dia:7},
    {id:2,nombre:'PIAS',importe:50,cuenta:'bbva',tipo:'fijo',frec:'monthly',dia:10},
    {id:3,nombre:'Dr Smile',importe:41.46,cuenta:'bbva',tipo:'fijo',frec:'monthly',dia:10,finAnio:2026,finMes:5},
    {id:4,nombre:'Aspiradora',importe:26.75,cuenta:'bbva',tipo:'fijo',frec:'monthly',dia:10,finAnio:2026,finMes:11},
    {id:5,nombre:'Google ONE',importe:2.99,cuenta:'bbva',tipo:'fijo',frec:'monthly',dia:10},
    {id:6,nombre:'Comparsa',importe:16,cuenta:'bbva',tipo:'fijo',frec:'monthly',dia:16},
    {id:7,nombre:'App WB',importe:3.09,cuenta:'bbva',tipo:'fijo',frec:'monthly',dia:24},
    {id:8,nombre:'DIGI',importe:10,cuenta:'bbva',tipo:'fijo',frec:'monthly',dia:30},
    {id:9,nombre:'Legado Activo AXA',importe:20,cuenta:'bbva',tipo:'fijo',frec:'monthly',dia:30},
    {id:10,nombre:'Cuota autónomo',importe:302.65,cuenta:'bbva',tipo:'fijo',frec:'monthly',dia:30},
    {id:11,nombre:'AJE',importe:48,cuenta:'bbva',tipo:'fijo',frec:'quarterly',dia:1,meses:[0,3,6,9]},

let calY=hoy.getFullYear(),calM=hoy.getMonth(),calV='bbva';
function renderCal(){
  const y=calY,m=calM;
  const cuenta=calV;
  const col=cuenta==='bbva'?'var(--blue)':'var(--red)';
  const colL=cuenta==='bbva'?'var(--blue-l)':'var(--red-l)';
  const pfC=cuenta==='bbva'?'pfbl':'pfre';
  const gastos=DB.gastos.filter(g=>g.cuenta===cuenta&&gastoAplica(g,y,m)).sort((a,b)=>diaGasto(a)-diaGasto(b));
  let total=0,pagado=0,pendiente=0;
  gastos.forEach(g=>{
    total+=g.importe;
    if(isPast(diaGasto(g),y,m)||isPagado(g.id,y,m))pagado+=g.importe;
    else pendiente+=g.importe;
  });
  const pct=total>0?Math.round(pagado/total*100):0;

  // Calendario visual
  const byDay={};
  gastos.forEach(g=>{const d=diaGasto(g);if(!byDay[d])byDay[d]=[];byDay[d].push(g);});
  const firstDay=new Date(y,m,1).getDay(),offset=firstDay===0?6:firstDay-1;
  const daysInM=new Date(y,m+1,0).getDate();
  let calH='';
  for(let i=0;i<offset;i++)calH+=`<div class="cd empty">·</div>`;
  for(let d=1;d<=daysInM;d++){
    const isToday=hoy.getFullYear()===y&&hoy.getMonth()===m&&d===hoy.getDate();
    const bills=byDay[d];
    let cls='cd';
    if(bills){
      const allP=bills.every(g=>isPast(diaGasto(g),y,m)||isPagado(g.id,y,m));
      cls+=allP?' paid':cuenta==='bbva'?' hb':' hb san';
    }
    if(isToday)cls+=' today';
    calH+=`<div class="${cls}">${d}</div>`;
  }

  const listaH=gastos.map(g=>{
    const past=isPast(diaGasto(g),y,m),pagadoM=isPagado(g.id,y,m),esPagado=past||pagadoM;
    return `<div class="li">
      <div class="li-ico" style="background:${colL};color:${col};font-size:9px;font-weight:800">d.${diaGasto(g)}</div>
      <div class="li-body">
        <div class="li-name">${g.nombre}</div>
        <div class="li-sub">${tipoLabel(g.tipo)}${g.frec?' · '+frecLabel(g.frec):''}</div>
      </div>
      <div class="li-amt" style="color:${esPagado?'var(--t2)':'var(--red)'};margin-right:8px">−${fmt(g.importe)}</div>
      ${past
        ?`<span class="tag tgr">Auto ✓</span>`
        :`<button class="btn-pg${pagadoM?' done':''}" onclick="togglePagado(${g.id},${y},${m},renderCal)">${pagadoM?'✓ Pagado':'Marcar pagado'}</button>`
      }
    </div>`;
  }).join('')||`<div style="font-size:13px;color:var(--t2);padding:14px 0;text-align:center">Sin gastos este mes</div>`;

  eid('s-cal').innerHTML=`
    <div class="mnav">
      <button class="btn-gh" style="padding:9px 18px;font-size:16px" onclick="calMes(-1)">←</button>
      <span>${MC[m]} ${y}</span>
      <button class="btn-gh" style="padding:9px 18px;font-size:16px" onclick="calMes(1)">→</button>
    </div>
    <div class="trow">
      <button class="tbtn${calV==='bbva'?' on':''}" onclick="calV='bbva';renderCal()">💳 BBVA</button>
      <button class="tbtn${calV==='san'?' on':''}" onclick="calV='san';renderCal()">🏦 Santander</button>
    </div>
    <div class="g3" style="margin-bottom:12px">
      <div class="sbox" style="padding:11px;text-align:center;border-top:3px solid ${col}">
        <div class="slbl">Total</div><div class="sval" style="font-size:16px;color:${col}">−${fmt(total)}</div>
      </div>
      <div class="sbox" style="padding:11px;text-align:center">
        <div class="slbl">Pagado</div><div class="sval" style="font-size:16px;color:var(--green)">−${fmt(pagado)}</div>
      </div>
      <div class="sbox" style="padding:11px;text-align:center">
        <div class="slbl">Pendiente</div><div class="sval" style="font-size:16px;color:var(--red)">−${fmt(pendiente)}</div>
      </div>
    </div>
    <div class="card" style="padding:12px;margin-bottom:12px">
      <div class="cg"><div class="ch">L</div><div class="ch">M</div><div class="ch">X</div><div class="ch">J</div><div class="ch">V</div><div class="ch">S</div><div class="ch">D</div></div>
      <div class="cg">${calH}</div>
      <div style="margin-top:10px">
        <div class="prog" style="height:7px;margin-bottom:0"><div class="pf ${pfC}" style="width:${pct}%"></div></div>
        <div style="font-size:11px;color:var(--t2);margin-top:4px">${pct}% pagado</div>
      </div>
    </div>
    <div class="card" style="border-top:3px solid ${col}">
      <div class="chdr"><span class="ctitle" style="color:${col}">${cuenta==='bbva'?'BBVA':'Santander'} · ${MC[m]}</span></div>
      ${listaH}
    </div>`;
}

function actTR(){const v=parseFloat(eid('trS').value),f=fromDate(eid('trF').value);if(isNaN(v))return;DB.saldos.tr={val:v,fecha:f};save();renderObj();}
function asignarObj(id,val){const o=DB.objetivos.find(x=>x.id===id);if(!o)return;o.asignado=Math.max(0,parseFloat(val)||0);save();}
function marcarCumplido(id){const o=DB.objetivos.find(x=>x.id===id);if(!o)return;o.cumplido=true;save();renderObj();}
function desmarcarCumplido(id){const o=DB.objetivos.find(x=>x.id===id);if(!o)return;o.cumplido=false;save();renderObj();}
function guardarObj(id){const o=DB.objetivos.find(x=>x.id===id);if(!o)return;const n=eid('oN-'+id)?.value.trim();if(n)o.nombre=n;const m=parseFloat(eid('oM-'+id)?.value);if(!isNaN(m))o.meta=m;const f=eid('oF-'+id)?.value;if(f!==undefined)o.fecha=f;save();renderObj();}
function borrarObj(id){DB.objetivos=DB.objetivos.filter(x=>x.id!==id);save();renderObj();}
function addObj(){const n=eid('oNN').value.trim(),m=parseFloat(eid('oNM').value),f=eid('oNF').value;if(!n||isNaN(m))return;DB.objetivos.push({id:Date.now(),nombre:n,meta:m,asignado:0,fecha:f,cumplido:false});save();renderObj();}

    if(anulados.length) h+=`<div class="card" style="opacity:.5">
      <div class="chdr"><span class="ctitle">Anulados</span><button class="btn-gh" style="font-size:11px;padding:5px 10px" onclick="limpiarAnulados()">Limpiar todo</button></div>
      ${anulados.map(g=>`<div class="li"><div class="li-ico" style="background:var(--card2);color:var(--t2);font-size:9px">✗</div><div class="li-body"><div class="li-name" style="text-decoration:line-through">${g.nombre}</div><div class="li-sub">${g.cuenta==='bbva'?'BBVA':'Santander'}</div></div><div class="li-amt" style="color:var(--t2);margin-right:8px">−${fmt(g.importe)}</div><button class="btn-gh" style="font-size:11px;padding:5px 10px;flex-shrink:0" onclick="reactivarG(${g.id})">Reactivar</button></div>`).join('')}
    </div>`;

    // Añadir nuevo gasto
    h+=`<div class="card" style="border:2px dashed var(--brd)">
      <div class="ctitle" style="margin-bottom:13px">Añadir gasto / recibo</div>
      <div class="fr"><label>Nombre</label><input type="text" id="nN" placeholder="Ej: Netflix, Compra Zara..."/></div>
      <div class="g2">
        <div class="fr"><label>Importe (€)</label><input type="number" id="nI" step="0.01" inputmode="decimal" placeholder="0,00"/></div>
        <div class="fr"><label>Día de cargo</label><input type="number" id="nD" min="1" max="31" placeholder="1"/></div>
      </div>
      <div class="g2">
        <div class="fr"><label>Cuenta</label><select id="nC"><option value="bbva">BBVA</option><option value="san">Santander</option></select></div>
        <div class="fr"><label>Tipo</label><select id="nT" onchange="renderTipoExtra()"><option value="fijo">Fijo (recurrente)</option><option value="fraccionado">Fraccionado</option><option value="puntual">Puntual (este mes)</option><option value="habitual">Habitual</option></select></div>
      </div>
      <div id="nExtra"></div>
      <button class="btn btn-bl" onclick="addG()" style="margin-top:4px">Añadir</button>
      <div id="nMsg"></div>
    </div>`;
  }

  if(gV==='iva'){
    h+=`<div class="card" style="border-top:3px solid var(--tr)">
      <div class="chdr"><span class="ctitle" style="color:var(--tr)">IVA acumulado ${hoy.getFullYear()}</span><span style="font-family:var(--num);font-size:20px;font-weight:800;color:var(--tr)">${fmt(ivaT)}</span></div>
      <div style="font-size:12px;color:var(--t2);margin-bottom:12px">${iva.length} concepto${iva.length!==1?'s':''} · Liquidación anual</div>
      ${iva.map(i=>`<div class="li">
        <div class="li-ico" style="background:var(--tr-l);color:var(--tr);font-size:9px;font-weight:800">IVA</div>
        <div class="li-body"><div class="li-name">${i.nombre}</div><div class="li-sub">${i.fecha}</div></div>
        <div class="li-amt" style="color:var(--tr);margin-right:8px">${fmt(i.importe)}</div>
        <div class="li-btn" onclick="borrarIVA(${i.id})" style="border:none"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="var(--t2)" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></div>
      </div>`).join('')||'<div style="font-size:13px;color:var(--t2);padding:6px 0">Sin registros</div>'}
      <div style="display:flex;gap:8px;margin-top:12px">
        <input type="text" id="ivaN" placeholder="Concepto" style="flex:1;padding:10px 12px;font-size:13px;border-radius:var(--rs);border:1.5px solid var(--brd);background:var(--card2);color:var(--tx);font-family:inherit"/>
        <input type="number" id="ivaI" placeholder="€" inputmode="decimal" style="width:72px;padding:10px;font-size:13px;border-radius:var(--rs);border:1.5px solid var(--brd);background:var(--card2);color:var(--tx);font-family:inherit"/>
        <button class="btn btn-tr" style="width:auto;padding:10px 14px;font-size:16px" onclick="addIVA()">+</button>
      </div>
      ${ivaT>0?`<button class="btn btn-dk" style="margin-top:10px;font-size:12px;padding:11px" onclick="liquidarIVA()">Liquidar IVA · Reiniciar a cero</button>`:''}
    </div>`;
  }

  if(gV==='bizums'){
    h+=`<div class="card" style="border-top:3px solid var(--red)">
      <div class="chdr"><span class="ctitle" style="color:var(--red)">Bizums / Deudas</span>${pend.length?`<span style="font-family:var(--num);font-size:18px;font-weight:800;color:var(--red)">−${fmt(pend.reduce((s,d)=>s+d.importe,0))}</span>`:''}
      </div>
      ${pend.map(d=>`<div class="li">
        <div class="li-ico" style="background:var(--red-l);color:var(--red)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg></div>
        <div class="li-body"><div class="li-name">${d.nombre}</div>${d.notas?`<div class="li-sub">${d.notas}</div>`:''}</div>
        <div class="li-amt" style="color:var(--red);margin-right:8px">−${fmt(d.importe)}</div>
        <button class="btn-pg" onclick="toggleDeuda(${d.id})">Pagado</button>
      </div>`).join('')||'<div style="font-size:13px;color:var(--t2);padding:6px 0">Sin pendientes</div>'}
      ${pag.length?`<div class="dlbl">Pagados</div>${pag.map(d=>`<div class="li" style="opacity:.4">
        <div class="li-ico" style="background:var(--green-l);color:var(--green)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg></div>
        <div class="li-body"><div class="li-name">${d.nombre}</div></div>
        <div class="li-amt" style="color:var(--green);margin-right:8px">${fmt(d.importe)}</div>
        <div class="li-btn" onclick="borrarDeuda(${d.id})" style="border:none"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="var(--t2)" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></div>
      </div>`).join('')}`:''}
      <div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--brd2)">
        <div class="fr"><label>¿A quién?</label><input type="text" id="dN" placeholder="Ej: María, cena"/></div>
        <div class="g2">
          <div class="fr"><label>Importe (€)</label><input type="number" id="dI" step="0.01" inputmode="decimal" placeholder="0,00"/></div>
          <div class="fr"><label>Notas</label><input type="text" id="dNt" placeholder="Opcional"/></div>
        </div>
        <button class="btn btn-re" onclick="addDeuda()">Añadir deuda/bizum</button>
        <div id="dMsg"></div>
      </div>
    </div>`;
  }

  eid('s-gastos').innerHTML=h;
  // init tipo extra form si existe
  if(gV==='recibos')renderTipoExtra();
}

function renderTipoExtra(){
  const t=eid('nT')?.value;if(!t)return;
  const el=eid('nExtra');if(!el)return;
  if(t==='fijo'||t==='habitual') el.innerHTML=`<div class="g2"><div class="fr"><label>Frecuencia</label><select id="nF"><option value="monthly">Mensual</option><option value="quarterly">Trimestral</option><option value="annual">Anual</option></select></div><div class="fr"><label>Fin (opcional)</label><input type="month" id="nFin"/></div></div>`;
  else if(t==='fraccionado') el.innerHTML=`<div class="g2"><div class="fr"><label>Mes inicio</label><input type="month" id="nIni" value="${hoy.getFullYear()}-${String(hoy.getMonth()+1).padStart(2,'0')}"/></div><div class="fr"><label>Mes fin</label><input type="month" id="nFin"/></div></div>`;
  else if(t==='puntual') el.innerHTML=`<div class="fr"><label>Mes</label><input type="month" id="nMes" value="${hoy.getFullYear()}-${String(hoy.getMonth()+1).padStart(2,'0')}"/></div>`;
  else el.innerHTML='';
}

function addG(){
  const n=eid('nN').value.trim(),i=parseFloat(eid('nI').value),d=parseInt(eid('nD').value)||1;
  const c=eid('nC').value,t=eid('nT').value;
  const msg=eid('nMsg');
  if(!n||isNaN(i)||i<=0){msg.className='merr';msg.textContent='⚠ Nombre e importe obligatorios';return;}
  const g={id:Date.now(),nombre:n,importe:i,cuenta:c,tipo:t,dia:d};
  if(t==='fijo'||t==='habitual'){
    g.frec=eid('nF')?.value||'monthly';
    if(g.frec==='quarterly')g.meses=[0,3,6,9];
    if(g.frec==='annual')g.mesAnual=hoy.getMonth();
    const fin=eid('nFin')?.value;
    if(fin){const[fy,fm]=fin.split('-').map(Number);g.finAnio=fy;g.finMes=fm-1;}
  }
  if(t==='fraccionado'){
    const ini=eid('nIni')?.value,fin=eid('nFin')?.value;
    if(!ini||!fin){msg.className='merr';msg.textContent='⚠ Indica mes inicio y fin';return;}
    const[iy,im]=ini.split('-').map(Number);const[fy,fm]=fin.split('-').map(Number);
    g.iniAnio=iy;g.iniMes=im-1;g.finAnio=fy;g.finMes=fm-1;
  }
  if(t==='puntual'){
    const mes=eid('nMes')?.value;
    if(mes){const[y,m]=mes.split('-').map(Number);g.anio=y;g.mesAnual=m-1;}
    else{g.anio=hoy.getFullYear();g.mesAnual=hoy.getMonth();}
  }
  DB.gastos.push(g);save();
  msg.className='mok';msg.textContent='✓ Añadido correctamente';
  setTimeout(()=>renderGastos(),900);
}

function guardarG(id){
  const g=DB.gastos.find(x=>x.id===id);if(!g)return;
  const n=eid('gN-'+id)?.value.trim();if(n)g.nombre=n;
  const i=parseFloat(eid('gI-'+id)?.value);if(!isNaN(i))g.importe=i;
  const d=parseInt(eid('gD-'+id)?.value);if(!isNaN(d)&&d>=1&&d<=31)g.dia=d;
  const c=eid('gC-'+id)?.value;if(c)g.cuenta=c;
  const t=eid('gT-'+id)?.value;if(t)g.tipo=t;
  const f=eid('gF-'+id)?.value;if(f)g.frec=f;
  const fin=eid('gFin-'+id)?.value;
  if(fin){const[fy,fm]=fin.split('-').map(Number);g.finAnio=fy;g.finMes=fm-1;}else{delete g.finAnio;delete g.finMes;}
  const ini=eid('gIni-'+id)?.value;
  if(ini){const[iy,im]=ini.split('-').map(Number);g.iniAnio=iy;g.iniMes=im-1;}
  const finF=eid('gFinF-'+id)?.value;
  if(finF&&g.tipo==='fraccionado'){const[fy,fm]=finF.split('-').map(Number);g.finAnio=fy;g.finMes=fm-1;}
  const mes=eid('gMes-'+id)?.value;
  if(mes&&g.tipo==='puntual'){const[y,m]=mes.split('-').map(Number);g.anio=y;g.mesAnual=m-1;}
  save();renderGastos();
}
function anularG(id){const g=DB.gastos.find(x=>x.id===id);if(!g)return;g.anulado=true;save();renderGastos();}
function reactivarG(id){const g=DB.gastos.find(x=>x.id===id);if(!g)return;delete g.anulado;save();renderGastos();}
function borrarG(id){DB.gastos=DB.gastos.filter(x=>x.id!==id);save();renderGastos();}
function limpiarAnulados(){DB.gastos=DB.gastos.filter(x=>!x.anulado);save();renderGastos();}
function addIVA(){const n=eid('ivaN').value.trim(),i=parseFloat(eid('ivaI').value);if(!n||isNaN(i))return;DB.iva.push({id:Date.now(),nombre:n,importe:i,fecha:hoy.toLocaleDateString('es-ES')});save();renderGastos();}
function borrarIVA(id){DB.iva=DB.iva.filter(x=>x.id!==id);save();renderGastos();}
function liquidarIVA(){DB.iva=[];save();renderGastos();}
function addDeuda(){
  const n=eid('dN').value.trim(),i=parseFloat(eid('dI').value),nt=eid('dNt').value.trim();
  const msg=eid('dMsg');
  if(!n||isNaN(i)||i<=0){msg.className='merr';msg.textContent='⚠ Nombre e importe obligatorios';return;}
  DB.deudas.push({id:Date.now(),nombre:n,importe:i,notas:nt,pagada:false});
  save();msg.className='mok';msg.textContent='✓ Añadido';setTimeout(()=>renderGastos(),900);
}
function toggleDeuda(id){const d=DB.deudas.find(x=>x.id===id);if(!d)return;d.pagada=!d.pagada;d.pagadaMes=mk(hoy.getFullYear(),hoy.getMonth());save();renderGastos();}
function borrarDeuda(id){DB.deudas=DB.deudas.filter(x=>x.id!==id);save();renderGastos();}

// ═══════════════════════════════════════════
// BACKUP
// ═══════════════════════════════════════════
function doExport(){
  const blob=new Blob([JSON.stringify({db:DB,exportado:new Date().toISOString()},null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download=`finanzas-${new Date().toLocaleDateString('es-ES').replace(/\//g,'-')}.json`;
  document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
}
function doImport(event){
  const file=event.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{const b=JSON.parse(e.target.result);if(!b.db){alert('⚠ Archivo no válido.');return;}DB=b.db;fixDB();save();renderInicio();alert('✓ Restaurado.');}
    catch(e){alert('⚠ Error al leer el archivo.');}
  };
  reader.readAsText(file);event.target.value='';
}

// ═══════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════
const R={inicio:renderInicio,cal:renderCal,obj:renderObj,prod:renderProd,gastos:renderGastos};
async function init(){
  loadLocal();renderInicio();
  const ok=await loadCloud();
  if(ok)renderInicio();
}
init();
</script>
