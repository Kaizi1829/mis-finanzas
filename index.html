<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>Finanzas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800;9..40,900&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F0F4FB;--surf:#FFFFFF;--card:#FFFFFF;--card2:#F7F9FE;
  --brd:#E4EAF4;--brd2:#EEF2FA;
  --blue:#4A7BE8;--blue-l:#EBF1FD;--blue-m:#C5D6FA;
  --green:#2BAA82;--green-l:#E6F7F2;--green-m:#A8DFD0;
  --red:#E0595A;--red-l:#FDEAEA;--red-m:#F5BBBB;
  --amber:#C87D12;--amber-l:#FDF4E3;--amber-m:#F5D8A0;
  /* Trade Republic + PIAS + Legado + AXA + IVA */
  --tr:#6E7EC0;--tr-l:#ECEFFE;--tr-m:#C4CAE8;
  --tx:#1A1F36;--t2:#6B7399;--t3:#B0B8D4;
  --r:18px;--rs:12px;
  --sh:0 2px 12px rgba(100,120,200,.08);--sh2:0 4px 24px rgba(100,120,200,.12);
  --num:'Outfit',sans-serif;
}
body{font-family:'DM Sans',-apple-system,sans-serif;background:var(--bg);color:var(--tx);-webkit-font-smoothing:antialiased;padding-bottom:96px;min-height:100vh}
.num{font-family:var(--num)}

/* SECTIONS */
.sec{display:none;padding:14px 15px 8px;animation:fi .22s ease}
.sec.active{display:block}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* HERO */
.hero{background:linear-gradient(160deg,#C8D8F8 0%,#D8E8F8 40%,#E0F0EC 100%);padding:50px 22px 24px;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;top:-60px;right:-40px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.35)}
.hero::after{content:'';position:absolute;bottom:-50px;left:-20px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.2)}
.hero-inner{position:relative;z-index:1}
.hero-label{font-size:11px;font-weight:700;color:rgba(74,123,232,.75);letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px}
.hero-total{font-family:var(--num);font-size:46px;font-weight:700;color:var(--tx);letter-spacing:-.5px;line-height:1;margin-bottom:4px}
.hero-date{font-size:11px;color:rgba(74,123,232,.6);margin-top:6px;font-weight:500}

/* ACCOUNT STRIP */
.accts-wrap{display:flex;gap:10px;overflow-x:auto;padding:16px 15px 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.accts-wrap::-webkit-scrollbar{display:none}
.acct-card{flex-shrink:0;width:148px;border-radius:16px;padding:15px;position:relative;overflow:hidden}
.acct-card::after{content:'';position:absolute;width:90px;height:90px;border-radius:50%;background:rgba(255,255,255,.15);top:-25px;right:-25px}
.acct-lbl{font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;opacity:.75;margin-bottom:10px}
.acct-val{font-family:var(--num);font-size:22px;font-weight:700;line-height:1;margin-bottom:4px;position:relative;z-index:1}
.acct-date{font-size:10px;opacity:.5}
.acct-bb{background:linear-gradient(135deg,#5B8EF0,#82AEFF);color:#fff}
.acct-sa{background:linear-gradient(135deg,#E07585,#F5A0AC);color:#fff}
.acct-tr{background:linear-gradient(135deg,#7E8FC4,#A0AFDC);color:#fff}

/* INV STRIP — hidden on resumen (info now in section) */
.inv-strip{display:flex;gap:8px;overflow-x:auto;padding:4px 15px 14px;scrollbar-width:none}
.inv-strip::-webkit-scrollbar{display:none}
.inv-pill{flex-shrink:0;display:flex;align-items:center;gap:7px;padding:8px 13px;border-radius:100px;background:var(--surf);border:1px solid var(--brd);box-shadow:var(--sh)}
.inv-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.inv-lbl{font-size:11px;color:var(--t2);font-weight:600}
.inv-val{font-family:var(--num);font-size:13px;font-weight:600}

/* ALERT BANNER */
.alert-wrap{padding:0 15px 10px}
.alert-banner{padding:12px 14px;border-radius:14px;background:var(--amber-l);border:1px solid var(--amber-m);display:flex;align-items:flex-start;gap:10px}
.alert-title{font-size:12px;font-weight:800;color:var(--amber);margin-bottom:3px}
.alert-txt{font-size:11px;font-weight:600;color:var(--amber);opacity:.85;line-height:1.4}

/* BOTTOM NAV */
.bnav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.96);backdrop-filter:blur(24px);border-top:1px solid var(--brd);display:flex;padding:10px 2px calc(10px + env(safe-area-inset-bottom));z-index:100;box-shadow:0 -4px 20px rgba(100,120,200,.08)}
.nb{flex:1;padding:3px 2px;border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;font-family:inherit}
.ni-wrap{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;transition:.18s}
.nl{font-size:9px;font-weight:700;color:var(--t3);letter-spacing:.03em;transition:.18s}
.ns{width:16px;height:16px;stroke:var(--t3);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:.18s}
.nb.active .ni-wrap{background:var(--blue-l)}
.nb.active .nl{color:var(--blue)}
.nb.active .ns{stroke:var(--blue)}

/* CARDS */
.card{background:var(--surf);border-radius:var(--r);padding:16px;margin-bottom:12px;border:1px solid var(--brd2);box-shadow:var(--sh)}
.card-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}
.card-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--t2)}
.page-title{font-size:22px;font-weight:800;letter-spacing:-.4px;margin-bottom:15px;color:var(--tx)}

/* LIST ITEMS */
.li{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--brd2)}
.li:last-child{border-bottom:none}
.li-icon{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:11px;font-weight:800}
.li-body{flex:1;min-width:0}
.li-title{font-size:13px;font-weight:600;color:var(--tx)}
.li-sub{font-size:11px;color:var(--t2);margin-top:2px}
.li-amount{font-family:var(--num);font-size:14px;font-weight:600;white-space:nowrap}
.li-action{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--brd);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;background:transparent}

/* FORMS */
.fr{display:flex;flex-direction:column;gap:5px;margin-bottom:11px}
.fr label{font-size:11px;font-weight:700;color:var(--t2);letter-spacing:.04em}
.fr input,.fr select{padding:11px 13px;font-size:14px;border-radius:var(--rs);border:1.5px solid var(--brd);background:var(--card2);color:var(--tx);width:100%;font-family:inherit;-webkit-appearance:none;transition:.2s}
.fr input:focus,.fr select:focus{outline:none;border-color:var(--blue);background:#fff;box-shadow:0 0 0 3px rgba(74,123,232,.1)}
.fg2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* TYPE PILLS (movimientos) */
.type-pills{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;margin-bottom:15px;padding-bottom:2px}
.type-pills::-webkit-scrollbar{display:none}
.tp{flex-shrink:0;display:flex;align-items:center;gap:6px;padding:9px 14px;border-radius:100px;border:1.5px solid var(--brd);background:var(--surf);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--t2);transition:.15s;box-shadow:var(--sh)}
.tp.on{border-color:var(--blue);background:var(--blue-l);color:var(--blue)}
.tp svg{stroke:var(--t2);transition:.15s}
.tp.on svg{stroke:var(--blue)}

/* BUTTONS */
.btn{width:100%;padding:14px;border-radius:var(--rs);border:none;font-size:14px;font-weight:700;cursor:pointer;color:#fff;font-family:inherit;transition:.15s}
.btn:active{transform:scale(.98);opacity:.9}
.btn-blue{background:var(--blue)}.btn-red{background:var(--red)}.btn-green{background:var(--green)}.btn-amber{background:var(--amber)}.btn-tr{background:var(--tr)}
.btn-dark{background:var(--card2);border:1.5px solid var(--brd);color:var(--tx)}
.btn-ghost{padding:10px 15px;border-radius:var(--rs);border:1.5px solid var(--brd);background:var(--surf);color:var(--t2);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:var(--sh)}
.btn-pagado{padding:6px 12px;border-radius:8px;border:1.5px solid var(--green-m);background:var(--green-l);color:var(--green);font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;transition:.15s}
.btn-pagado:active{opacity:.7}

/* TAGS */
.tag{display:inline-flex;align-items:center;font-size:10px;font-weight:700;padding:3px 8px;border-radius:100px}
.t-blue{background:var(--blue-l);color:var(--blue)}.t-red{background:var(--red-l);color:var(--red)}
.t-green{background:var(--green-l);color:var(--green)}.t-amber{background:var(--amber-l);color:var(--amber)}
.t-grey{background:var(--card2);color:var(--t2)}.t-tr{background:var(--tr-l);color:var(--tr)}

/* PROGRESS */
.prog{height:7px;border-radius:4px;background:var(--brd);overflow:hidden;margin:6px 0}
.prog-fill{height:100%;border-radius:4px;transition:.6s}
.pf-green{background:linear-gradient(90deg,#2BAA82,#5BC9A8)}
.pf-blue{background:linear-gradient(90deg,#4A7BE8,#82AEFF)}
.pf-red{background:linear-gradient(90deg,#E0595A,#F5A0A0)}
.pf-tr{background:linear-gradient(90deg,#6E7EC0,#9CAAE0)}

/* P&L BOXES */
.pnl-box{border-radius:var(--rs);padding:14px 16px;margin-bottom:12px;border:1px solid transparent}
.pnl-pos{background:var(--green-l);border-color:var(--green-m)}
.pnl-neg{background:var(--red-l);border-color:var(--red-m)}
.pnl-tr{background:var(--tr-l);border-color:var(--tr-m)}
.pnl-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.pnl-val{font-family:var(--num);font-size:28px;font-weight:700;letter-spacing:-.3px;line-height:1.1}
.pnl-sub{font-size:11px;margin-top:4px;font-weight:600}

/* MISC */
.ep{background:var(--card2);border-radius:var(--rs);padding:13px;margin-top:10px;display:none;border:1px solid var(--brd)}
.divlabel{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--t3);margin:13px 0 8px}
.msg-ok{font-size:13px;font-weight:700;color:var(--green);padding:12px;background:var(--green-l);border-radius:var(--rs);margin-top:10px;text-align:center;border:1px solid var(--green-m)}
.msg-err{font-size:13px;font-weight:700;color:var(--red);padding:12px;background:var(--red-l);border-radius:var(--rs);margin-top:10px;text-align:center}

/* STATS ROW */
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:13px}
.stat-box{background:var(--surf);border-radius:13px;padding:12px;text-align:center;border:1px solid var(--brd2);box-shadow:var(--sh)}
.stat-lbl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--t2);margin-bottom:5px}
.stat-val{font-family:var(--num);font-size:15px;font-weight:700}

/* CALENDAR */
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-top:8px}
.ch{font-size:9px;text-align:center;font-weight:700;color:var(--t3);padding:4px;letter-spacing:.05em}
.cd{font-family:var(--num);font-size:13px;font-weight:500;text-align:center;padding:8px 2px;border-radius:8px;color:var(--t2)}
.cd.bill{background:var(--blue-l);color:var(--blue);font-weight:700}
.cd.paid{background:var(--green-l);color:var(--green);font-weight:700}
.cd.today{outline:2px solid var(--blue);outline-offset:-2px;font-weight:800;color:var(--tx)}
.cd.empty{opacity:0}
.cd-badge{display:inline-flex;align-items:center;padding:4px 10px;border-radius:100px;font-size:11px;font-weight:700}
.cd-ok{background:var(--green-l);color:var(--green)}.cd-soon{background:var(--amber-l);color:var(--amber)}.cd-urg{background:var(--red-l);color:var(--red)}.cd-none{background:var(--card2);color:var(--t2)}

/* OBJ CARD */
.oc{background:var(--surf);border-radius:var(--r);padding:16px;margin-bottom:10px;border:1px solid var(--brd2);box-shadow:var(--sh)}
.oc.done{background:linear-gradient(135deg,#E6F7F2,#F0FCF8);border-color:var(--green-m)}

/* CHECKLIST */
.fi{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--brd2);cursor:pointer;user-select:none}
.fi:last-child{border-bottom:none}
.fi-chk{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--brd);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:.18s;background:#fff}
.fi.chk .fi-chk{background:var(--green);border-color:var(--green)}
.fi.nap{opacity:.22;pointer-events:none}
.fi-body{flex:1}
.fi-name{font-size:13px;font-weight:600;color:var(--tx)}
.fi.chk .fi-name{color:var(--t2);text-decoration:line-through}
.fi-sub{font-size:11px;color:var(--t2);margin-top:2px}
.fi-amt{font-family:var(--num);font-size:13px;font-weight:600;color:var(--t2)}
.baja{opacity:.35}

/* BACKUP BAR — pointer-events:none on container so it doesn't block clicks behind it */
.bkbar{position:fixed;top:0;right:0;z-index:300;padding:10px 13px;display:flex;gap:8px;pointer-events:none}
.bkbtn{display:flex;align-items:center;gap:5px;padding:6px 12px;border-radius:100px;font-size:11px;font-weight:700;cursor:pointer;background:rgba(255,255,255,.88);backdrop-filter:blur(12px);border:1px solid var(--blue-m);color:var(--blue);font-family:inherit;box-shadow:var(--sh);pointer-events:all}
</style>
</head>
<body>

<!-- BACKUP BAR -->
<div class="bkbar">
  <button class="bkbtn" onclick="exportarDatos()">
    <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    Exportar
  </button>
  <label class="bkbtn" style="cursor:pointer">
    <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
    Importar
    <input type="file" accept=".json" style="display:none" onchange="importarDatos(event)"/>
  </label>
</div>

<!-- HERO -->
<div class="hero" id="hero">
  <div class="hero-inner">
    <div class="hero-label">Patrimonio total</div>
    <div class="hero-total" id="heroTotal">—</div>
    <div class="hero-date" id="heroDate"></div>
  </div>
</div>
<div class="accts-wrap" id="accountsBar"></div>
<div id="alertWrap"></div>

<!-- SECTIONS -->
<div class="sec active" id="s-resumen"></div>
<div class="sec" id="s-cuentas"></div>
<div class="sec" id="s-movimientos"></div>
<div class="sec" id="s-inversiones"></div>
<div class="sec" id="s-objetivos"></div>
<div class="sec" id="s-calendario"></div>
<div class="sec" id="s-facturas"></div>

<!-- NAV -->
<nav class="bnav">
  <button class="nb active" onclick="show('resumen',this)"><div class="ni-wrap"><svg class="ns" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></div><span class="nl">Inicio</span></button>
  <button class="nb" onclick="show('cuentas',this)"><div class="ni-wrap"><svg class="ns" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg></div><span class="nl">Cuentas</span></button>
  <button class="nb" onclick="show('movimientos',this)"><div class="ni-wrap"><svg class="ns" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg></div><span class="nl">Añadir</span></button>
  <button class="nb" onclick="show('inversiones',this)"><div class="ni-wrap"><svg class="ns" viewBox="0 0 24 24"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg></div><span class="nl">Inversión</span></button>
  <button class="nb" onclick="show('objetivos',this)"><div class="ni-wrap"><svg class="ns" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg></div><span class="nl">Objetivos</span></button>
  <button class="nb" onclick="show('calendario',this)"><div class="ni-wrap"><svg class="ns" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></div><span class="nl">Calendario</span></button>
  <button class="nb" onclick="show('facturas',this)"><div class="ni-wrap"><svg class="ns" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></div><span class="nl">Facturas</span></button>
</nav>

<script>
// ════════════════════════════════════════
// CONSTANTS & HELPERS
// ════════════════════════════════════════
const hoy=new Date();
const SK='finanzas-marta-v9', SK_FACT='facturas-asesoria-marta-v3';
const diasSem=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const mesesN=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const mesesC=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

document.getElementById('heroDate').textContent=`${diasSem[hoy.getDay()]}, ${hoy.getDate()} de ${mesesN[hoy.getMonth()]} de ${hoy.getFullYear()}`;

function fmt(n){if(n==null)return'—';return Math.abs(parseFloat(n)).toFixed(2).replace('.',',')+' €';}
function fmtS(n){const v=parseFloat(n);return(v>=0?'+':'-')+Math.abs(v).toFixed(2).replace('.',',')+' €';}
function mesKey(y,m){return`${y}-${String(m).padStart(2,'0')}`;}
function isPast(dia,y,m){const ty=hoy.getFullYear(),tm=hoy.getMonth(),td=hoy.getDate();if(y<ty||(y===ty&&m<tm))return true;if(y===ty&&m===tm&&dia<td)return true;return false;}
function reciboActivo(r,y,m){if(r.finAnio!==undefined)if(y>r.finAnio||(y===r.finAnio&&m>r.finMes))return false;return true;}
function reciboAplica(r,y,m){if(!reciboActivo(r,y,m))return false;if(r.frec==='monthly')return true;if(r.frec==='quarterly')return r.meses&&r.meses.includes(m);if(r.frec==='annual')return r.mesAnual===m;if(r.frec==='once')return r.mesAnual===m&&(!r.anio||r.anio===y);return false;}
function getBBVABills(y,m){return DB.recibos.filter(r=>r.cuenta==='bbva'&&(r.tipo==='gasto'||r.tipo==='fraccionado')&&reciboAplica(r,y,m)).sort((a,b)=>a.dia-b.dia);}
function diasRestantes(f){if(!f)return null;const fd=new Date(f);fd.setHours(0,0,0,0);const hd=new Date();hd.setHours(0,0,0,0);return Math.ceil((fd-hd)/(864e5));}
function calcCuotasPagadas(){const ini=new Date('2026-05-01');if(hoy<ini)return 0;const m=(hoy.getFullYear()-ini.getFullYear())*12+(hoy.getMonth()-ini.getMonth());return Math.min(m+1,DB.prestamo.total);}
function ivaTotal(){return(DB.iva||[]).reduce((s,i)=>s+i.importe,0);}
function toDateInput(f){if(!f)return hoy.toISOString().split('T')[0];if(f.includes('-'))return f;const p=f.split('/');return p.length===3?`${p[2]}-${p[1].padStart(2,'0')}-${p[0].padStart(2,'0')}`:hoy.toISOString().split('T')[0];}
function fromDateInput(f){if(!f)return'';const p=f.split('-');return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:''}
function cColor(c){return c==='bbva'?'var(--blue)':c==='san'?'var(--red)':'var(--tr)';}
function cLight(c){return c==='bbva'?'var(--blue-l)':c==='san'?'var(--red-l)':'var(--tr-l)';}
function cLabel(c){return c==='bbva'?'BBVA':c==='san'?'Santander':'Trade Republic';}
function calcTotal(){return(DB.saldos.bbva?.val||0)+(DB.saldos.san?.val||0)+(DB.saldos.tr?.val||0);}
function calcAlertasBills(days=4){
  return DB.recibos.filter(r=>{
    if(!reciboAplica(r,hoy.getFullYear(),hoy.getMonth()))return false;
    if(isPast(r.dia,hoy.getFullYear(),hoy.getMonth()))return false;
    const d=r.dia-hoy.getDate();return d>=0&&d<=days;
  }).sort((a,b)=>a.dia-b.dia);
}
function distribuirTR(){
  const saldoTR=DB.saldos.tr?.val||0;
  const ordenados=[...DB.objetivos].sort((a,b)=>{if(!a.fecha&&!b.fecha)return 0;if(!a.fecha)return 1;if(!b.fecha)return-1;return new Date(a.fecha)-new Date(b.fecha);});
  let restante=saldoTR;const asignado={};
  ordenados.forEach(o=>{const c=Math.min(o.meta,Math.max(0,restante));asignado[o.id]=c;restante=Math.max(0,restante-o.meta);});
  return asignado;
}
function calcGastosBBVA(){
  const recibos=DB.recibos.filter(r=>r.cuenta==='bbva'&&(r.tipo==='gasto'||r.tipo==='fraccionado')&&reciboAplica(r,hoy.getFullYear(),hoy.getMonth()));
  const total=recibos.reduce((s,r)=>s+r.importe,0);
  const pendiente=recibos.filter(r=>!isPast(r.dia,hoy.getFullYear(),hoy.getMonth())).reduce((s,r)=>s+r.importe,0);
  return{total,pendiente};
}
function calcGastosSan(){
  const recibos=DB.recibos.filter(r=>r.cuenta==='san'&&(r.tipo==='gasto'||r.tipo==='fraccionado')&&reciboAplica(r,hoy.getFullYear(),hoy.getMonth()));
  const totalRecibos=recibos.reduce((s,r)=>s+r.importe,0);
  const pendienteRecibos=recibos.filter(r=>!isPast(r.dia,hoy.getFullYear(),hoy.getMonth())).reduce((s,r)=>s+r.importe,0);
  const bizumsMes=mesKey(hoy.getFullYear(),hoy.getMonth());
  const bizums=(DB.deudas||[]).filter(d=>d.pagada&&d.pagadaMes===bizumsMes).reduce((s,d)=>s+d.importe,0);
  return{total:totalRecibos+bizums,pendiente:pendienteRecibos};
}

}

function addMovimiento(){
  const tipo=movTipo,nombre=document.getElementById('mN')?.value.trim(),importe=parseFloat(document.getElementById('mI')?.value),msg=document.getElementById('mMsg');
  if(!nombre||isNaN(importe)||importe<=0){msg.className='msg-err';msg.textContent='⚠ Nombre e importe obligatorios.';return;}
  if(tipo==='gasto'){const frec=document.getElementById('mF').value,cuenta=document.getElementById('mC').value,dia=parseInt(document.getElementById('mD').value)||1,notas=document.getElementById('mNt')?.value.trim()||'',esF=document.getElementById('mEF')?.value==='si';const r={id:Date.now(),nombre,importe,tipo:'gasto',frec,cuenta,dia,notas};if(frec==='quarterly')r.meses=[0,3,6,9];if(frec==='annual'||frec==='once'){r.mesAnual=hoy.getMonth();if(frec==='once')r.anio=hoy.getFullYear();}if(esF){const k=mesKey(hoy.getFullYear(),hoy.getMonth());if(!FACT[k])FACT[k]={checks:{},extras:[]};FACT[k].extras.push({id:Date.now()+1,name:nombre,amt:importe,checked:false});saveFact();}DB.recibos.push(r);}
  if(tipo==='fraccionado'){const cuenta=document.getElementById('mC').value,dia=parseInt(document.getElementById('mD').value)||1,fini=document.getElementById('mFini').value,ffin=document.getElementById('mFfin').value;if(!fini||!ffin){msg.className='msg-err';msg.textContent='⚠ Indica mes inicio y fin.';return;}const[iniY,iniM]=fini.split('-').map(Number);const[finY,finM]=ffin.split('-').map(Number);let y=iniY,m=iniM-1;while(y<finY||(y===finY&&m<=finM-1)){DB.recibos.push({id:Date.now()+Math.random(),nombre,importe,tipo:'fraccionado',frec:'once',cuenta,dia,mesAnual:m,anio:y});m++;if(m>11){m=0;y++;}}}
  if(tipo==='iva'){const fecha=document.getElementById('mFini').value;if(!DB.iva)DB.iva=[];DB.iva.push({id:Date.now(),nombre,importe,fecha});}
  if(tipo==='deuda'){const notas=document.getElementById('mNt')?.value.trim()||'';if(!DB.deudas)DB.deudas=[];DB.deudas.push({id:Date.now(),nombre,importe,notas,pagada:false});}
  saveDB();msg.className='msg-ok';msg.textContent='✓ Guardado correctamente';
  setTimeout(()=>renderMovimientos(),1200);
}

function saveAxa(){const b=parseFloat(document.getElementById('axB').value),c=parseFloat(document.getElementById('axC').value),f=document.getElementById('axF').value.trim();if(!isNaN(b))DB.inversiones.axa.compra=b;if(!isNaN(c))DB.inversiones.axa.cierre=c;if(f)DB.inversiones.axa.fecha=f;saveDB();renderInversiones();}

// ════════════════════════════════════════
// OBJETIVOS
// ════════════════════════════════════════
function renderObjetivos(){
  const saldoTR=DB.saldos.tr?.val||0,totalMeta=DB.objetivos.reduce((s,o)=>s+o.meta,0),asignado=distribuirTR();
  const ordenados=[...DB.objetivos].sort((a,b)=>{if(!a.fecha&&!b.fecha)return 0;if(!a.fecha)return 1;if(!b.fecha)return-1;return new Date(a.fecha)-new Date(b.fecha);});
  let html=`<div class="page-title">Objetivos · Trade Republic</div>
  <div class="card" style="border-top:3px solid var(--tr)">
    <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:10px">
      <div><div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--tr)">Saldo TR</div><div class="num" style="font-size:28px;font-weight:700;margin-top:4px">${fmt(saldoTR)}</div></div>
      <div style="text-align:right"><div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--t2)">Total metas</div><div class="num" style="font-size:18px;font-weight:700;margin-top:4px">${fmt(totalMeta)}</div></div>
    </div>
    <div class="prog" style="height:8px"><div class="prog-fill pf-tr" style="width:${Math.min(100,(saldoTR/totalMeta*100)).toFixed(1)}%"></div></div>
    <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--t2);margin-top:5px;font-weight:600">
      <span>${Math.min(100,(saldoTR/totalMeta*100)).toFixed(0)}% cubierto</span>
      ${saldoTR<totalMeta?`<span style="color:var(--red)">Déficit ${fmt(totalMeta-saldoTR)}</span>`:`<span style="color:var(--green)">✓ Todo cubierto</span>`}
    </div>
    <div style="font-size:11px;color:var(--t3);margin-top:9px;padding-top:9px;border-top:1px solid var(--brd2)">El saldo TR se distribuye automáticamente por fecha más próxima</div>
  </div>`;
  html+=ordenados.map((o,idx)=>{
    const cubre=asignado[o.id]||0,faltan=Math.max(0,o.meta-cubre),pct=o.meta>0?Math.min(100,Math.round(cubre/o.meta*100)):0,cubierto=pct>=100,dias=diasRestantes(o.fecha);
    let cbCls='cd-none',cbTxt='Sin fecha';
    if(dias!==null){if(dias<0){cbTxt='Vencido';cbCls='cd-urg';}else if(dias<=30){cbTxt=`${dias}d`;cbCls='cd-urg';}else if(dias<=90){cbTxt=`${dias}d`;cbCls='cd-soon';}else{cbTxt=`${dias}d`;cbCls='cd-ok';}}
    return`<div class="oc${cubierto?' done':''}">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:11px">
        <div style="width:26px;height:26px;border-radius:50%;background:${cubierto?'var(--green)':'var(--blue-l)'};color:${cubierto?'#fff':'var(--blue)'};display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex-shrink:0">${cubierto?'✓':idx+1}</div>
        <div style="flex:1">
          <div style="font-size:16px;font-weight:800;letter-spacing:-.3px;color:${cubierto?'var(--green)':'var(--tx)'}">${o.nombre}</div>
          <div style="font-size:11px;color:var(--t2);margin-top:2px">${o.fecha?new Date(o.fecha).toLocaleDateString('es-ES',{day:'2-digit',month:'long',year:'numeric'}):'Sin fecha límite'}</div>
        </div>
        <span class="cd-badge ${cbCls}">${cbTxt}</span>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:12px;font-weight:600;margin-bottom:6px">
        <span style="color:var(--t2)">Cubierto <span class="num" style="color:${cubierto?'var(--green)':'var(--tx)'};font-size:13px;font-weight:700">${fmt(cubre)}</span></span>
        <span style="color:var(--t2)">Meta <span class="num" style="color:var(--tx);font-size:13px;font-weight:700">${fmt(o.meta)}</span></span>
      </div>
      <div class="prog"><div class="prog-fill ${cubierto?'pf-green':'pf-blue'}" style="width:${pct}%"></div></div>
      <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--t2);margin-top:4px">
        <span>${pct}% cubierto</span>${faltan>0?`<span style="color:var(--red)">Faltan ${fmt(faltan)}</span>`:`<span style="color:var(--green)">✓ Completo</span>`}
      </div>
      <div style="display:flex;gap:8px;margin-top:12px">
        ${cubierto?`<button class="btn btn-green" style="flex:2;padding:11px;font-size:13px" onclick="completarObjetivo(${o.id})">✓ Marcar pagado</button>`:''}
        <button class="btn-ghost" style="flex:1;padding:11px;font-size:12px" onclick="document.getElementById('eo-${o.id}').style.display=document.getElementById('eo-${o.id}').style.display==='block'?'none':'block'">Editar</button>
      </div>
      <div id="eo-${o.id}" class="ep"><div class="fg2"><div class="fr"><label>Nombre</label><input type="text" id="oN-${o.id}" value="${o.nombre}"/></div><div class="fr"><label>Meta (€)</label><input type="number" id="oM-${o.id}" value="${o.meta}" step="0.01" inputmode="decimal"/></div><div class="fr"><label>Fecha límite</label><input type="date" id="oF-${o.id}" value="${o.fecha||''}"/></div></div><div style="display:flex;gap:8px"><button class="btn btn-green" style="flex:1;padding:11px" onclick="guardarEditO(${o.id})">Guardar</button><button class="btn btn-red" style="flex:1;padding:11px" onclick="delObjetivo(${o.id})">Eliminar</button></div></div>
    </div>`;
  }).join('');
  html+=`<div class="card" style="border:2px dashed var(--brd)"><div class="card-title" style="margin-bottom:13px">Nuevo objetivo</div><div class="fg2"><div class="fr"><label>Nombre</label><input type="text" id="oNN" placeholder="Ej: Viaje Roma"/></div><div class="fr"><label>Meta (€)</label><input type="number" id="oNM" step="0.01" inputmode="decimal" placeholder="0,00"/></div><div class="fr"><label>Fecha límite</label><input type="date" id="oNF"/></div></div><button class="btn btn-blue" onclick="addObjetivo()">Guardar objetivo</button></div>`;
  document.getElementById('s-objetivos').innerHTML=html;
}
function completarObjetivo(id){
  const numId=Number(id);
  const o=DB.objetivos.find(x=>Number(x.id)===numId);
  if(!o)return;
  if(!DB.saldos.tr)DB.saldos.tr={val:0,fecha:''};
  DB.saldos.tr.val=Math.max(0,(DB.saldos.tr.val||0)-o.meta);
  DB.objetivos=DB.objetivos.filter(x=>Number(x.id)!==numId);
  saveDB();
  renderObjetivos();
}
function guardarEditO(id){const o=DB.objetivos.find(x=>x.id===id);if(!o)return;const n=document.getElementById('oN-'+id)?.value.trim();if(n)o.nombre=n;const m=parseFloat(document.getElementById('oM-'+id)?.value);if(!isNaN(m))o.meta=m;const f=document.getElementById('oF-'+id)?.value;if(f!==undefined)o.fecha=f;saveDB();renderObjetivos();}
function delObjetivo(id){if(!confirm('¿Eliminar objetivo?'))return;DB.objetivos=DB.objetivos.filter(x=>x.id!==id);saveDB();renderObjetivos();}
function addObjetivo(){const nombre=document.getElementById('oNN').value.trim(),meta=parseFloat(document.getElementById('oNM').value),fecha=document.getElementById('oNF').value;if(!nombre||isNaN(meta))return;DB.objetivos.push({id:Date.now(),nombre,meta,fecha});saveDB();renderObjetivos();}

// ════════════════════════════════════════
// CALENDARIO  (fix: pointer-events en bkbar ya solucionado en CSS)

let curYear=hoy.getFullYear(),curMonth=hoy.getMonth();
function renderCalendario(){
  document.getElementById('s-calendario').innerHTML=`
    <div class="page-title">Calendario</div>
    <div style="display:flex;gap:10px;margin-bottom:15px;align-items:center">
      <button class="btn-ghost" style="padding:9px 18px;font-size:16px" onclick="changeMes(-1)">←</button>
      <span id="calTitle" style="flex:1;text-align:center;font-size:18px;font-weight:800;letter-spacing:-.3px"></span>
      <button class="btn-ghost" style="padding:9px 18px;font-size:16px" onclick="changeMes(1)">→</button>
    </div>
    <div class="stats-row">
      <div class="stat-box"><div class="stat-lbl">Total</div><div class="stat-val" id="tTotal" style="color:var(--blue)">—</div></div>
      <div class="stat-box"><div class="stat-lbl">Pagado</div><div class="stat-val" id="tPaid" style="color:var(--green)">—</div></div>
      <div class="stat-box"><div class="stat-lbl">Pendiente</div><div class="stat-val" id="tPend" style="color:var(--red)">—</div></div>
    </div>
    <div class="card" style="padding:12px">
      <div class="cg"><div class="ch">L</div><div class="ch">M</div><div class="ch">X</div><div class="ch">J</div><div class="ch">V</div><div class="ch">S</div><div class="ch">D</div></div>
      <div class="cg" id="calDays"></div>
    </div>
    <div class="card" id="calList"></div>`;
  renderCal();
}
function changeMes(d){curMonth+=d;if(curMonth>11){curMonth=0;curYear++;}if(curMonth<0){curMonth=11;curYear--;}renderCal();}
function renderCal(){
  if(!document.getElementById('calTitle'))return;
  document.getElementById('calTitle').textContent=mesesC[curMonth]+' '+curYear;
  const bills=getBBVABills(curYear,curMonth);const byDay={};bills.forEach(b=>{if(!byDay[b.dia])byDay[b.dia]=[];byDay[b.dia].push(b);});
  let total=0,paid=0,pending=0;bills.forEach(b=>{total+=b.importe;if(isPast(b.dia,curYear,curMonth))paid+=b.importe;else pending+=b.importe;});
  document.getElementById('tTotal').textContent=fmt(total);document.getElementById('tPaid').textContent=fmt(paid);document.getElementById('tPend').textContent=fmt(pending);
  const firstDay=new Date(curYear,curMonth,1).getDay(),offset=firstDay===0?6:firstDay-1,daysInM=new Date(curYear,curMonth+1,0).getDate();
  let html='';for(let i=0;i<offset;i++)html+=`<div class="cd empty">·</div>`;
  for(let d=1;d<=daysInM;d++){const hb=byDay[d],isToday=hoy.getFullYear()===curYear&&hoy.getMonth()===curMonth&&d===hoy.getDate(),past=isPast(d,curYear,curMonth);html+=`<div class="cd${hb?(past?' paid':' bill'):''}${isToday?' today':''}">${d}</div>`;}
  document.getElementById('calDays').innerHTML=html;
  let lh=`<div class="card-hdr"><span class="card-title" style="color:var(--blue)">BBVA · ${mesesC[curMonth]}</span><span class="num" style="font-size:13px;font-weight:700;color:var(--red)">−${fmt(pending)}</span></div>`;
  bills.forEach(b=>{const past=isPast(b.dia,curYear,curMonth);lh+=`<div class="li"><div class="li-icon" style="background:var(--blue-l);color:var(--blue);font-size:9px;font-weight:800">d.${b.dia}</div><div class="li-body"><div class="li-title">${b.nombre}</div></div><span class="tag ${past?'t-green':'t-amber'}">${past?'Pagado':'Pendiente'}</span><div class="li-amount" style="color:${past?'var(--t2)':'var(--red)'};margin-left:8px">${past?'':'-'}${fmt(b.importe)}</div></div>`;});
  lh+=`<div style="background:var(--blue-l);border:1px solid var(--blue-m);border-radius:var(--rs);padding:11px 14px;margin-top:8px;display:flex;justify-content:space-between;align-items:center"><span style="font-size:12px;font-weight:700;color:var(--blue)">Total BBVA ${mesesC[curMonth]}</span><span class="num" style="font-size:16px;font-weight:700;color:var(--blue)">−${fmt(total)}</span></div>`;
  document.getElementById('calList').innerHTML=lh;
}

// ════════════════════════════════════════
// FACTURAS
// ════════════════════════════════════════
const FIJAS=[{id:'aje',name:'AJE',amt:48,frec:'quarterly',meses:[0,3,6,9]},{id:'neting',name:'Neting',amt:48.39,frec:'monthly'},{id:'google',name:'Google ONE',amt:2.99,frec:'monthly'},{id:'appwb',name:'App WB',amt:3.09,frec:'monthly'},{id:'arrabal',name:'Arrabal & Díaz',amt:60,frec:'quarterly',meses:[1,4,7,10]},{id:'alquiler',name:'Alquiler',amt:540,frec:'monthly'},{id:'ssalud',name:'Seguro de salud',amt:74.90,frec:'monthly'},{id:'shogar',name:'Seguro de hogar',amt:78.26,frec:'annual',mes:1},{id:'regular',name:'Regularización autónomo',amt:178.08,frec:'special',check:(y,m)=>y===2026&&[3,4,5].includes(m)}];
function factAplica(f,y,m){if(f.frec==='monthly')return true;if(f.frec==='quarterly')return f.meses.includes(m);if(f.frec==='annual')return f.mes===m;if(f.frec==='special')return f.check(y,m);return false;}
function tagFact(f){if(f.frec==='monthly')return't-blue';if(f.frec==='quarterly')return't-amber';if(f.frec==='annual')return't-grey';return't-red';}
function tagLabel(f){if(f.frec==='monthly')return'Mensual';if(f.frec==='quarterly')return'Trimestral';if(f.frec==='annual')return'Anual';return'Especial';}
let factY=hoy.getFullYear(),factM=hoy.getMonth();
function getFactMes(y,m){const k=mesKey(y,m);if(!FACT[k])FACT[k]={checks:{},extras:[]};return FACT[k];}
function renderFacturas(){
  const e=getFactMes(factY,factM),disp=FIJAS.filter(f=>factAplica(f,factY,factM)),noDisp=FIJAS.filter(f=>!factAplica(f,factY,factM));
  const totalF=disp.length+e.extras.length,okF=disp.filter(f=>e.checks[f.id]).length+e.extras.filter(x=>x.checked).length,pct=totalF?Math.round(okF/totalF*100):0;
  let html=`<div class="page-title">Facturas</div>
    <div style="display:flex;gap:10px;margin-bottom:15px;align-items:center"><button class="btn-ghost" style="padding:9px 18px;font-size:16px" onclick="changeFactMes(-1)">←</button><span style="flex:1;text-align:center;font-size:18px;font-weight:800;letter-spacing:-.3px">${mesesC[factM]} ${factY}</span><button class="btn-ghost" style="padding:9px 18px;font-size:16px" onclick="changeFactMes(1)">→</button></div>
    <div class="stats-row"><div class="stat-box"><div class="stat-lbl">Total</div><div class="stat-val">${totalF}</div></div><div class="stat-box"><div class="stat-lbl">Guardadas</div><div class="stat-val" style="color:var(--green)">${okF}</div></div><div class="stat-box"><div class="stat-lbl">Pendientes</div><div class="stat-val" style="color:var(--red)">${totalF-okF}</div></div></div>
    <div style="margin-bottom:13px"><div style="display:flex;justify-content:space-between;font-size:11px;font-weight:700;color:var(--t2);margin-bottom:5px"><span>Progreso</span><span>${pct}%</span></div><div class="prog"><div class="prog-fill pf-green" style="width:${pct}%"></div></div></div>
    <div class="card"><div class="card-hdr"><span class="card-title">Facturas deducibles</span></div>${disp.map(f=>{const chk=!!e.checks[f.id];return`<div class="fi${chk?' chk':''}" onclick="toggleFact('${f.id}')"><div class="fi-chk">${chk?`<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`:''}</div><div class="fi-body"><div class="fi-name">${f.name} <span class="tag ${tagFact(f)}">${tagLabel(f)}</span></div><div class="fi-sub">${chk?'✓ Guardada en carpeta':'Pendiente de guardar'}</div></div><div class="fi-amt">${fmt(f.amt)}</div></div>`;}).join('')}</div>`;
  if(noDisp.length)html+=`<div class="card"><div class="card-hdr"><span class="card-title">No aplican este mes</span></div>${noDisp.map(f=>`<div class="fi nap"><div class="fi-chk"></div><div class="fi-body"><div class="fi-name">${f.name} <span class="tag ${tagFact(f)}">${tagLabel(f)}</span></div></div><div class="fi-amt">${fmt(f.amt)}</div></div>`).join('')}</div>`;
  html+=`<div class="card"><div class="card-hdr"><span class="card-title">Gastos extra</span></div>${e.extras.map(x=>`<div class="fi${x.checked?' chk':''}" onclick="toggleExtra(${x.id})"><div class="fi-chk">${x.checked?`<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`:''}</div><div class="fi-body"><div class="fi-name">${x.name} <span class="tag t-red">Extra</span></div><div class="fi-sub">${x.checked?'✓ Guardada':'Pendiente'}</div></div><div class="fi-amt">${x.amt?fmt(x.amt):'—'}</div></div>`).join('')||`<div style="font-size:13px;color:var(--t2);padding:8px 0">Sin gastos extra este mes</div>`}
  <div style="display:flex;gap:8px;margin-top:12px"><input type="text" id="eC" placeholder="Concepto" style="flex:1;padding:10px 12px;font-size:13px;border-radius:var(--rs);border:1.5px solid var(--brd);background:var(--card2);color:var(--tx);font-family:inherit"/><input type="number" id="eI" placeholder="€" inputmode="decimal" style="width:70px;padding:10px;font-size:13px;border-radius:var(--rs);border:1.5px solid var(--brd);background:var(--card2);color:var(--tx);font-family:inherit"/><button class="btn btn-blue" style="width:auto;padding:10px 16px;font-size:18px;line-height:1" onclick="addExtra()">+</button></div></div>
  <button class="btn-ghost" style="width:100%;margin-top:4px;padding:11px" onclick="resetFactMes()">↩ Reiniciar mes</button>`;
  document.getElementById('s-facturas').innerHTML=html;
}
function changeFactMes(d){factM+=d;if(factM>11){factM=0;factY++;}if(factM<0){factM=11;factY--;}renderFacturas();}
function resetFactMes(){if(!confirm(`¿Reiniciar ${mesesC[factM]} ${factY}?`))return;const k=mesKey(factY,factM);if(FACT[k]){FACT[k].checks={};FACT[k].extras=[];}saveFact();renderFacturas();}
function toggleFact(id){const e=getFactMes(factY,factM);e.checks[id]=!e.checks[id];saveFact();renderFacturas();}
function toggleExtra(id){const e=getFactMes(factY,factM);const x=e.extras.find(x=>x.id===id);if(x){x.checked=!x.checked;saveFact();renderFacturas();}}
function addExtra(){const c=document.getElementById('eC').value.trim(),i=parseFloat(document.getElementById('eI').value);if(!c)return;const e=getFactMes(factY,factM);e.extras.push({id:Date.now(),name:c,amt:isNaN(i)?null:i,checked:false});saveFact();renderFacturas();}

// ════════════════════════════════════════
// BACKUP
// ════════════════════════════════════════
function exportarDatos(){const b={db:DB,fact:FACT,exportado:new Date().toISOString()};const blob=new Blob([JSON.stringify(b,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`finanzas-${new Date().toLocaleDateString('es-ES').replace(/\//g,'-')}.json`;document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);alert('✓ Backup exportado. Guárdalo en Google Drive.');}
function importarDatos(event){const file=event.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=function(e){try{const b=JSON.parse(e.target.result);if(!b.db||!b.db._v){alert('⚠ Archivo no válido.');return;}if(!confirm(`¿Restaurar backup del ${new Date(b.exportado).toLocaleDateString('es-ES')}?`))return;DB=b.db;FACT=b.fact||{};saveDB();saveFact();renderResumen();alert('✓ Restaurado.');}catch(e){alert('⚠ Error.');}};reader.readAsText(file);event.target.value='';}

// INIT
// ════════════════════════════════════════
const renders={resumen:renderResumen,cuentas:renderCuentas,movimientos:renderMovimientos,inversiones:renderInversiones,objetivos:renderObjetivos,calendario:renderCalendario,facturas:renderFacturas};
loadDB();loadFact();renderResumen();
