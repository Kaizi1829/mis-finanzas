<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bbva:#2563EB;--san:#DC2626;--tr:#18181B;--inv:#16A34A;
  --bbva-light:#EFF6FF;--san-light:#FEF2F2;--tr-light:#F4F4F5;--inv-light:#F0FDF4;
  --bg:#F1F5F9;--card:#fff;--border:#E2E8F0;
  --text:#0F172A;--text2:#64748B;--text3:#94A3B8;
  --gradient-top:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%)
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:80px}

/* TOP */
.topbar{background:var(--gradient-top);color:#fff;padding:20px 16px 24px;position:relative;overflow:hidden}
.topbar::after{content:'';position:absolute;top:-30px;right:-30px;width:140px;height:140px;background:rgba(255,255,255,.04);border-radius:50%}
.topbar::before{content:'';position:absolute;bottom:-40px;left:-20px;width:100px;height:100px;background:rgba(255,255,255,.03);border-radius:50%}
.topbar-inner{position:relative;z-index:1}
.topbar h1{font-size:13px;font-weight:600;opacity:.7;letter-spacing:.05em;text-transform:uppercase;margin-bottom:4px}
.topbar .total-label{font-size:12px;opacity:.6;margin-bottom:2px}
.topbar .total-val{font-size:36px;font-weight:800;letter-spacing:-.5px;line-height:1}
.topbar .fecha{font-size:11px;opacity:.5;margin-top:6px}

/* ACCOUNT CARDS */
.accounts-scroll{display:flex;gap:10px;overflow-x:auto;padding:14px 16px 4px;scrollbar-width:none;-ms-overflow-style:none}
.accounts-scroll::-webkit-scrollbar{display:none}
.acct-card{flex-shrink:0;width:140px;border-radius:14px;padding:14px;color:#fff;position:relative;overflow:hidden}
.acct-card::after{content:'';position:absolute;top:-15px;right:-15px;width:70px;height:70px;background:rgba(255,255,255,.1);border-radius:50%}
.acct-bb{background:linear-gradient(135deg,#1D4ED8,#2563EB)}
.acct-sa{background:linear-gradient(135deg,#B91C1C,#DC2626)}
.acct-tr{background:linear-gradient(135deg,#18181B,#3F3F46)}
.acct-in{background:linear-gradient(135deg,#15803D,#16A34A)}
.acct-card .ac-label{font-size:10px;opacity:.75;font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin-bottom:6px}
.acct-card .ac-val{font-size:20px;font-weight:800;line-height:1;position:relative;z-index:1}
.acct-card .ac-sub{font-size:10px;opacity:.65;margin-top:4px;position:relative;z-index:1}

/* INV STRIP */
.inv-strip{display:flex;gap:8px;overflow-x:auto;padding:0 16px 10px;scrollbar-width:none}
.inv-strip::-webkit-scrollbar{display:none}
.inv-chip{flex-shrink:0;background:#fff;border-radius:12px;padding:10px 14px;border:1px solid var(--border);min-width:120px}
.inv-chip .ic-label{font-size:10px;color:var(--text3);font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px}
.inv-chip .ic-val{font-size:16px;font-weight:800;color:var(--inv)}
.inv-chip .ic-sub{font-size:10px;color:var(--text3);margin-top:2px}

/* SECTIONS */
.sec{display:none;padding:12px 14px}
.sec.active{display:block}

/* CARDS */
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.card h3{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
.h-bb{color:var(--bbva)}.h-sa{color:var(--san)}.h-tr{color:var(--tr)}.h-in{color:var(--inv)}.h-m{color:var(--text2)}
.bt-bb{border-top:3px solid var(--bbva)}.bt-sa{border-top:3px solid var(--san)}.bt-tr{border-top:3px solid var(--tr)}.bt-in{border-top:3px solid var(--inv)}

/* ROWS */
.row{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--border)}
.row:last-child{border-bottom:none}
.rn{flex:1;font-size:13px;color:var(--text)}
.rs{font-size:10px;color:var(--text3);margin-top:1px}
.ra{font-size:13px;font-weight:700;white-space:nowrap}
.c-bb{color:var(--bbva)}.c-sa{color:var(--san)}.c-tr{color:var(--tr)}.c-in{color:var(--inv)}
.neg{color:#DC2626}.pos{color:#16A34A}.muted{color:var(--text3)}

/* BADGE */
.badge{font-size:9px;padding:2px 7px;border-radius:20px;white-space:nowrap;font-weight:700}
.bw{background:#FEF3C7;color:#92400E}.bd{background:#DCFCE7;color:#166534}.bp{background:#FEE2E2;color:#991B1B}.boff{background:#F1F5F9;color:#64748B}
.b-iva{background:#EDE9FE;color:#5B21B6}.b-deuda{background:#FFE4E6;color:#9F1239}.b-frac{background:#E0F2FE;color:#0369A1}

/* TOTBAR */
.totbar{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:10px}
.totbox{background:#fff;border-radius:10px;padding:8px 6px;text-align:center;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.totbox .tl{font-size:9px;color:var(--text3);margin-bottom:2px;font-weight:600;text-transform:uppercase}
.totbox .tv{font-size:15px;font-weight:800}

/* BAR */
.bar-bg{height:6px;border-radius:3px;background:#E2E8F0;overflow:hidden;margin-top:4px}
.bar-fill{height:100%;border-radius:3px}
.prog-bar{height:8px;border-radius:4px;background:#E2E8F0;overflow:hidden;margin:6px 0}
.prog-fill{height:100%;border-radius:4px;background:var(--inv);transition:.4s}

/* FORMS */
.fr{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.fr label{font-size:11px;color:var(--text2);font-weight:700}
.fr input,.fr select,.fr textarea{padding:10px 12px;font-size:14px;border-radius:10px;border:1.5px solid var(--border);background:#fff;color:var(--text);width:100%;-webkit-appearance:none}
.fr input:focus,.fr select:focus{outline:none;border-color:var(--bbva)}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{width:100%;padding:13px;border-radius:12px;border:none;font-size:14px;font-weight:800;cursor:pointer;color:#fff;margin-top:4px;letter-spacing:.02em}
.btn-bb{background:var(--bbva)}.btn-sa{background:var(--san)}.btn-tr{background:var(--tr)}.btn-in{background:var(--inv)}
.btn-sm{padding:7px 12px;border-radius:8px;border:1.5px solid var(--border);background:#fff;color:var(--text2);font-size:12px;font-weight:600;cursor:pointer}

/* CAL */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-top:6px}
.ch{font-size:9px;text-align:center;font-weight:700;color:var(--text3);padding:3px}
.cd{font-size:11px;text-align:center;padding:6px 2px;border-radius:6px;color:var(--text3)}
.cd.bill{background:#DBEAFE;color:var(--bbva);font-weight:700}
.cd.paid{background:#DCFCE7;color:var(--inv);font-weight:700}
.cd.today{outline:2px solid var(--bbva);outline-offset:-1px}
.cd.empty{opacity:0}

/* FACTURAS */
.fi{display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;margin-bottom:6px;border:1.5px solid var(--border);background:#fff;cursor:pointer;user-select:none;-webkit-user-select:none;transition:.15s}
.fi:active{transform:scale(.98)}
.fi.chk{background:#F0FDF4;border-color:#86EFAC}
.fi.chk .fn{color:var(--text3);text-decoration:line-through}
.fi.nap{opacity:.35;pointer-events:none}
.cc{width:26px;height:26px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800}
.fi.chk .cc{background:var(--inv);border-color:var(--inv);color:#fff}
.fb{flex:1;min-width:0}
.fn{font-size:13px;font-weight:700;color:var(--text)}
.fm{font-size:11px;color:var(--text3);margin-top:1px}
.ftag{font-size:9px;padding:2px 7px;border-radius:20px;margin-left:4px;font-weight:700}
.ftr{background:#DBEAFE;color:#1E40AF}.ftt{background:#FEF3C7;color:#92400E}.fta{background:#F3E8FF;color:#6B21A8}.fte{background:#FEE2E2;color:#991B1B}

/* DEUDA ITEM */
.deuda-item{display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;margin-bottom:6px;border:1.5px solid #FFE4E6;background:#FFF1F2}
.deuda-item.pagada{opacity:.5;background:#F0FDF4;border-color:#86EFAC}
.deuda-check{width:26px;height:26px;border-radius:50%;border:2px solid #FDA4AF;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer}
.deuda-item.pagada .deuda-check{background:var(--inv);border-color:var(--inv);color:#fff}

/* ALERT */
.alert{padding:10px 12px;border-radius:10px;font-size:12px;margin-top:8px}
.aw{background:#FFFBEB;color:#92400E;border:1px solid #FDE68A}.ai{background:#F0FDF4;color:#166534;border:1px solid #86EFAC}

/* EDIT PANEL */
.edit-panel{background:#F8FAFC;border-radius:12px;padding:12px;margin-top:8px;display:none;border:1px solid var(--border)}
.edit-inline{display:flex;gap:6px;align-items:center;margin-bottom:8px}
.edit-inline input{flex:1;padding:8px 10px;font-size:13px;border-radius:8px;border:1.5px solid var(--border);background:#fff;color:var(--text)}
.save-btn{padding:8px 14px;border-radius:8px;border:none;font-size:12px;font-weight:800;color:#fff;background:var(--inv);white-space:nowrap;cursor:pointer}

/* OBJ */
.obj-card{background:#fff;border-radius:14px;padding:14px;margin-bottom:8px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.countdown{font-size:30px;font-weight:900;line-height:1}
.cd-ok{color:var(--inv)}.cd-soon{color:#D97706}.cd-urgent{color:var(--san)}.cd-none{color:var(--text3)}

.recibo-baja{opacity:.4}
.section-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);margin:14px 0 6px}
.msg-ok{color:var(--inv);font-size:13px;margin-top:8px;font-weight:700;text-align:center;padding:10px;background:#F0FDF4;border-radius:10px}
.msg-err{color:var(--san);font-size:13px;margin-top:8px;font-weight:700;text-align:center;padding:10px;background:#FEF2F2;border-radius:10px}

/* IVA */
.iva-total{background:linear-gradient(135deg,#5B21B6,#7C3AED);color:#fff;border-radius:14px;padding:16px;margin-bottom:10px;text-align:center}
.iva-total .il{font-size:11px;opacity:.75;font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.iva-total .iv{font-size:32px;font-weight:900}
.iva-total .is{font-size:11px;opacity:.65;margin-top:4px}

/* BACKUP */
.backup-bar{position:fixed;top:0;right:0;z-index:200;padding:8px;display:flex;gap:6px}
.backup-bar button,.backup-bar label{background:rgba(255,255,255,.9);backdrop-filter:blur(10px);border:1px solid rgba(0,0,0,.1);border-radius:20px;padding:5px 10px;font-size:11px;font-weight:700;cursor:pointer;color:var(--text);display:flex;align-items:center;gap:4px;box-shadow:0 2px 8px rgba(0,0,0,.1)}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.95);backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;z-index:100;padding-bottom:env(safe-area-inset-bottom)}
.bottom-nav button{flex:1;padding:8px 2px 6px;border:none;background:none;font-size:9px;color:var(--text3);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:600}
.bottom-nav button .ico{font-size:20px;line-height:1}
.bottom-nav button.active{color:var(--bbva)}
</style>
</head>

const mesesN=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const mesesC=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
document.getElementById('fechaHoy').textContent=`${diasSem[hoy.getDay()]} ${hoy.getDate()} de ${mesesN[hoy.getMonth()]} de ${hoy.getFullYear()}`;

const SK='finanzas-marta-v6';
const SK_FACT='facturas-asesoria-marta-v3';

    {id:15,nombre:'Regularización autónomo',importe:178.08,tipo:'gasto',frec:'quarterly',cuenta:'bbva',dia:30,meses:[3,4,5],notas:'Abr-Jun 2026'},
    {id:16,nombre:'Shein 2/3',importe:68.07,tipo:'fraccionado',frec:'once',cuenta:'bbva',dia:15,mesAnual:4,anio:2026,notas:''},

let DB=defaultDB();
let FACT={};

function loadDB(){try{const r=localStorage.getItem(SK);if(r){const t=JSON.parse(r);if(t._v>=6)DB=t;}}catch(e){}}
function saveDB(){try{localStorage.setItem(SK,JSON.stringify(DB));}catch(e){}}
function loadFact(){try{const r=localStorage.getItem(SK_FACT);if(r)FACT=JSON.parse(r);}catch(e){}}
function saveFact(){try{localStorage.setItem(SK_FACT,JSON.stringify(FACT));}catch(e){}}

function fmt(n){return n!=null?parseFloat(n).toFixed(2).replace('.',',')+' €':'—';}
function mesKey(y,m){return `${y}-${String(m).padStart(2,'0')}`;}
function cuentaLabel(c){return c==='bbva'?'BBVA':c==='san'?'Santander':'Trade Republic';}
function cuentaColor(c){return c==='bbva'?'var(--bbva)':c==='san'?'var(--san)':'var(--tr)';}
function isPast(dia,y,m){
  const ty=hoy.getFullYear(),tm=hoy.getMonth(),td=hoy.getDate();
  if(y<ty||(y===ty&&m<tm))return true;
  if(y===ty&&m===tm&&dia<td)return true;
  return false;
}
function reciboActivo(r,y,m){
  if(r.finAnio!==undefined&&r.finMes!==undefined)
    if(y>r.finAnio||(y===r.finAnio&&m>r.finMes))return false;
  return true;
}
function reciboAplica(r,y,m){
  if(!reciboActivo(r,y,m))return false;
  if(r.frec==='monthly')return true;
  if(r.frec==='quarterly')return r.meses&&r.meses.includes(m);
  if(r.frec==='annual')return r.mesAnual===m;
  if(r.frec==='once')return r.mesAnual===m&&(!r.anio||r.anio===y);
  return false;
}
function getBBVABills(y,m){
  return DB.recibos.filter(r=>r.cuenta==='bbva'&&(r.tipo==='gasto'||r.tipo==='fraccionado')&&reciboAplica(r,y,m)).sort((a,b)=>a.dia-b.dia);
}
function diasRestantes(f){
  if(!f)return null;
  const fd=new Date(f);fd.setHours(0,0,0,0);
  const hd=new Date();hd.setHours(0,0,0,0);
  return Math.ceil((fd-hd)/(1000*60*60*24));
}
function calcCuotasPagadas(){
  const inicio=new Date('2026-05-01');
  if(hoy<inicio)return 0;
  const m=(hoy.getFullYear()-inicio.getFullYear())*12+(hoy.getMonth()-inicio.getMonth());
  return Math.min(m+1,DB.prestamo.total);
}
function ivaTotal(){return(DB.iva||[]).reduce((s,i)=>s+i.importe,0);}

function show(id,btn){
  document.querySelectorAll('.sec').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.bottom-nav button').forEach(b=>b.classList.remove('active'));
  document.getElementById('s-'+id).classList.add('active');
  btn.classList.add('active');
  // Mostrar/ocultar accounts bar solo en resumen
  const ab=document.getElementById('accountsBar');
  const is=document.getElementById('invStrip');
  if(id==='resumen'){ab.style.display='flex';is.style.display='flex';}

function addMovimiento(){
  const tipo=document.getElementById('mTipo').value;
  const nombre=document.getElementById('mN')?.value.trim();
  const importe=parseFloat(document.getElementById('mI')?.value);
  const msg=document.getElementById('mMsg');
  if(!nombre||isNaN(importe)||importe<=0){msg.className='msg-err';msg.textContent='⚠ Nombre e importe obligatorios.';return;}

  if(tipo==='gasto'){
    const frec=document.getElementById('mF').value;
    const cuenta=document.getElementById('mC').value;
    const dia=parseInt(document.getElementById('mD').value)||1;
    const notas=document.getElementById('mNt').value.trim();
    const esF=document.getElementById('mEF').value==='si';
    const r={id:Date.now(),nombre,importe,tipo:'gasto',frec,cuenta,dia,notas};
    if(frec==='quarterly')r.meses=[0,3,6,9];
    if(frec==='annual'||frec==='once'){r.mesAnual=hoy.getMonth();if(frec==='once')r.anio=hoy.getFullYear();}
    if(esF){const k=mesKey(hoy.getFullYear(),hoy.getMonth());if(!FACT[k])FACT[k]={checks:{},extras:[]};FACT[k].extras.push({id:Date.now()+1,name:nombre,amt:importe,checked:false});saveFact();}
    DB.recibos.push(r);
  }

  if(tipo==='fraccionado'){
    const cuenta=document.getElementById('mC').value;
    const dia=parseInt(document.getElementById('mD').value)||1;
    const notas=document.getElementById('mNt').value.trim();
    const fini=document.getElementById('mFini').value;
    const ffin=document.getElementById('mFfin').value;
    if(!fini||!ffin){msg.className='msg-err';msg.textContent='⚠ Indica fecha inicio y fin.';return;}
    const [iniY,iniM]=fini.split('-').map(Number);
    const [finY,finM]=ffin.split('-').map(Number);
    const r={id:Date.now(),nombre,importe,tipo:'fraccionado',frec:'once',cuenta,dia,notas,
      mesAnual:iniM-1,anio:iniY,finAnio:finY,finMes:finM-1};
    // Crear una entrada por cada mes
    let y=iniY,m=iniM-1;
    while(y<finY||(y===finY&&m<=finM-1)){
      DB.recibos.push({...r,id:Date.now()+Math.random(),mesAnual:m,anio:y,frec:'once',finAnio:undefined,finMes:undefined});
      m++;if(m>11){m=0;y++;}
    }
  }

  if(tipo==='iva'){
    const fecha=document.getElementById('mFini').value;
    const notas=document.getElementById('mNt').value.trim();
    if(!DB.iva)DB.iva=[];
    DB.iva.push({id:Date.now(),nombre,importe,fecha,notas});
  }

  if(tipo==='deuda'){
    const notas=document.getElementById('mNt').value.trim();
    if(!DB.deudas)DB.deudas=[];
    DB.deudas.push({id:Date.now(),nombre,importe,notas,pagada:false,fecha:hoy.toISOString().split('T')[0]});
  }

  saveDB();
  msg.className='msg-ok';msg.textContent='✓ Guardado correctamente';
  setTimeout(()=>renderMovimientos(),1500);
}

function toggleDeuda(id){const d=(DB.deudas||[]).find(x=>x.id===id);if(!d)return;d.pagada=!d.pagada;saveDB();renderMovimientos();renderResumen();}
function eliminarDeuda(id){DB.deudas=(DB.deudas||[]).filter(x=>x.id!==id);saveDB();renderMovimientos();}
function eliminarIVA(id){DB.iva=(DB.iva||[]).filter(x=>x.id!==id);saveDB();renderMovimientos();renderTopBar();}
function liquidarIVA(){if(!confirm('¿Liquidar el IVA? Esto borrará todos los conceptos acumulados.'))return;DB.iva=[];saveDB();renderMovimientos();renderTopBar();}
function toggleEditR(id){const el=document.getElementById('editR-'+id);if(el)el.style.display=el.style.display==='block'?'none':'block';}
function guardarEditR(id){
  const r=DB.recibos.find(x=>x.id===id);if(!r)return;

}
function darDeBaja(id){const r=DB.recibos.find(x=>x.id===id);if(!r)return;r.finAnio=hoy.getFullYear();r.finMes=hoy.getMonth();saveDB();renderMovimientos();}
function reactivarRecibo(id){const r=DB.recibos.find(x=>x.id===id);if(!r)return;delete r.finAnio;delete r.finMes;saveDB();renderMovimientos();}

  document.getElementById('s-inversiones').innerHTML=`

  if(!document.getElementById('calTitle'))return;

  bills.forEach(b=>{total+=b.importe;if(isPast(b.dia,curYear,curMonth))paid+=b.importe;else pending+=b.importe;});
  document.getElementById('tTotal').textContent=fmt(total);
  document.getElementById('tPaid').textContent=fmt(paid);
  document.getElementById('tPend').textContent=fmt(pending);
  const firstDay=new Date(curYear,curMonth,1).getDay();
  const offset=firstDay===0?6:firstDay-1;
  const daysInM=new Date(curYear,curMonth+1,0).getDate();
  let html='';
  for(let i=0;i<offset;i++)html+=`<div class="cd empty">·</div>`;
  for(let d=1;d<=daysInM;d++){
    const hb=byDay[d];const isToday=hoy.getFullYear()===curYear&&hoy.getMonth()===curMonth&&d===hoy.getDate();
    const past=isPast(d,curYear,curMonth);
    html+=`<div class="cd${hb?(past?' paid':' bill'):''}${isToday?' today':''}">${d}</div>`;
  }

  let lh=`<h3 class="h-bb" style="margin-bottom:10px">BBVA ${mesesC[curMonth]} · Pendiente <span class="neg">${fmt(pending)}</span></h3>`;

const FIJAS=[

  {id:'arrabal',name:'Arrabal & Díaz',amt:60,frec:'quarterly',meses:[1,4,7,10]},
  {id:'alquiler',name:'Alquiler',amt:540,frec:'monthly'},
  {id:'ssalud',name:'Seguro de salud',amt:74.90,frec:'monthly'},
  {id:'shogar',name:'Seguro de hogar',amt:78.26,frec:'annual',mes:1},
  {id:'regular',name:'Regularización autónomo',amt:178.08,frec:'special',check:(y,m)=>y===2026&&[3,4,5].includes(m)},
];
function factAplica(f,y,m){if(f.frec==='monthly')return true;if(f.frec==='quarterly')return f.meses.includes(m);if(f.frec==='annual')return f.mes===m;if(f.frec==='special')return f.check(y,m);return false;}
function tagFact(f){if(f.frec==='monthly')return['Mensual','ftr'];if(f.frec==='quarterly')return['Trimestral','ftt'];if(f.frec==='annual')return['Anual','fta'];return['Especial','fte'];}
let factY=hoy.getFullYear(),factM=hoy.getMonth();
function getFactMes(y,m){const k=mesKey(y,m);if(!FACT[k])FACT[k]={checks:{},extras:[]};return FACT[k];}
function renderFacturas(){
  const e=getFactMes(factY,factM);
  const disp=FIJAS.filter(f=>factAplica(f,factY,factM));
  const noDisp=FIJAS.filter(f=>!factAplica(f,factY,factM));
  const totalF=disp.length+e.extras.length;
  const okF=disp.filter(f=>e.checks[f.id]).length+e.extras.filter(x=>x.checked).length;
  const pct=totalF?Math.round(okF/totalF*100):0;
  let html=`
    <div style="display:flex;gap:8px;margin-bottom:10px;align-items:center">
      <button class="btn-sm" onclick="changeFactMes(-1)">← Ant.</button>
      <span style="flex:1;text-align:center;font-size:16px;font-weight:800">${mesesC[factM]} ${factY}</span>
      <button class="btn-sm" onclick="changeFactMes(1)">Sig. →</button>
    </div>
    <div class="totbar">
      <div class="totbox"><div class="tl">Total</div><div class="tv">${totalF}</div></div>
      <div class="totbox"><div class="tl">Guardadas ✓</div><div class="tv pos">${okF}</div></div>
      <div class="totbox"><div class="tl">Pendientes</div><div class="tv" style="color:#E65100">${totalF-okF}</div></div>
    </div>
    <div class="prog-bar" style="height:10px;margin-bottom:4px"><div class="prog-fill" style="width:${pct}%"></div></div>
    <div style="font-size:11px;color:var(--text3);text-align:right;margin-bottom:10px;font-weight:600">${okF} de ${totalF} guardadas (${pct}%)</div>`;
  disp.forEach(f=>{
    const chk=!!e.checks[f.id];const[tl,tc]=tagFact(f);
    html+=`<div class="fi${chk?' chk':''}" onclick="toggleFact('${f.id}')">
      <div class="cc">${chk?'✓':''}</div>
      <div class="fb"><div class="fn">${f.name}<span class="ftag ${tc}">${tl}</span></div><div class="fm">${chk?'✓ Guardada en carpeta':'Pendiente de guardar'}</div></div>
      <div style="font-size:13px;font-weight:800;color:var(--text3)">${fmt(f.amt)}</div>
    </div>`;
  });
  if(noDisp.length){
    html+=`<div class="section-label">No aplican este mes</div>`;
    noDisp.forEach(f=>{const[tl,tc]=tagFact(f);html+=`<div class="fi nap"><div class="cc"></div><div class="fb"><div class="fn">${f.name}<span class="ftag ${tc}">${tl}</span></div></div><div style="font-size:12px;color:var(--text3)">${fmt(f.amt)}</div></div>`;});
  }
  html+=`<div class="section-label">Gastos extra (cenas, reuniones…)</div>`;
  e.extras.forEach(x=>{html+=`<div class="fi${x.checked?' chk':''}" onclick="toggleExtra(${x.id})"><div class="cc">${x.checked?'✓':''}</div><div class="fb"><div class="fn">${x.name}<span class="ftag fte">Extra</span></div><div class="fm">${x.checked?'✓ Guardada':'Pendiente'}</div></div><div style="font-size:13px;font-weight:800;color:var(--text3)">${fmt(x.amt)}</div></div>`;});
  html+=`<div style="display:flex;gap:8px;margin-top:10px">
    <input type="text" id="eC" placeholder="Concepto extra" style="flex:1;padding:10px;font-size:13px;border-radius:10px;border:1.5px solid var(--border);background:#fff;color:var(--text)"/>
    <input type="number" id="eI" placeholder="€" inputmode="decimal" style="width:75px;padding:10px;font-size:13px;border-radius:10px;border:1.5px solid var(--border);background:#fff;color:var(--text)"/>
    <button class="btn btn-bb" style="width:auto;padding:10px 14px" onclick="addExtra()">+</button>
  </div>
  <button class="btn-sm" style="width:100%;margin-top:10px;color:#DC2626" onclick="resetFactMes()">↺ Reiniciar mes</button>`;
  document.getElementById('s-facturas').innerHTML=html;
}
function changeFactMes(d){factM+=d;if(factM>11){factM=0;factY++;}if(factM<0){factM=11;factY--;}renderFacturas();}
function resetFactMes(){if(!confirm(`¿Reiniciar ${mesesC[factM]} ${factY}?`))return;const k=mesKey(factY,factM);if(FACT[k]){FACT[k].checks={};FACT[k].extras=[];}saveFact();renderFacturas();}
function toggleFact(id){const e=getFactMes(factY,factM);e.checks[id]=!e.checks[id];saveFact();renderFacturas();}
function toggleExtra(id){const e=getFactMes(factY,factM);const x=e.extras.find(x=>x.id===id);if(x){x.checked=!x.checked;saveFact();renderFacturas();}}
function addExtra(){
  const c=document.getElementById('eC').value.trim();const i=parseFloat(document.getElementById('eI').value);
  if(!c)return;
  const e=getFactMes(factY,factM);
  e.extras.push({id:Date.now(),name:c,amt:isNaN(i)?null:i,checked:false});
  saveFact();renderFacturas();
}

// ── BACKUP ───────────────────────────────────────────────
function exportarDatos(){
  const backup={db:DB,fact:FACT,exportado:new Date().toISOString()};
  const blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=`finanzas-marta-${new Date().toLocaleDateString('es-ES').replace(/\//g,'-')}.json`;
  document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
  alert('✓ Datos exportados. Guárdalos en Google Drive para tenerlos seguros.');
}
function importarDatos(event){
  const file=event.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const backup=JSON.parse(e.target.result);
      if(!backup.db||!backup.db._v){alert('⚠ Archivo no válido.');return;}
      if(!confirm(`¿Restaurar backup del ${new Date(backup.exportado).toLocaleDateString('es-ES')}?`))return;
      DB=backup.db;FACT=backup.fact||{};saveDB();saveFact();
      renderResumen();alert('✓ Datos restaurados.');
    }catch(err){alert('⚠ Error al leer el archivo.');}
  };
  reader.readAsText(file);event.target.value='';
