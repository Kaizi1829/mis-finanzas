<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>Mis Finanzas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800;9..40,900&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F0F4FB;--surf:#FFF;--card:#FFF;--card2:#F7F9FE;
  --brd:#E4EAF4;--brd2:#EEF2FA;
  --blue:#4A7BE8;--blue-l:#EBF1FD;--blue-m:#C5D6FA;
  --green:#2BAA82;--green-l:#E6F7F2;--green-m:#A8DFD0;
  --red:#E0595A;--red-l:#FDEAEA;--red-m:#F5BBBB;
  --amber:#C87D12;--amber-l:#FDF4E3;--amber-m:#F5D8A0;
  --tr:#6E7EC0;--tr-l:#ECEFFE;--tr-m:#C4CAE8;
  --tx:#1A1F36;--t2:#6B7399;--t3:#B0B8D4;
  --r:18px;--rs:12px;
  --sh:0 2px 12px rgba(100,120,200,.08);
  --num:'Outfit',sans-serif;
}
body{font-family:'DM Sans',-apple-system,sans-serif;background:var(--bg);color:var(--tx);-webkit-font-smoothing:antialiased;padding-bottom:90px;min-height:100vh}
.num{font-family:var(--num)}

/* SECTIONS */
.sec{display:none;padding:14px 15px 8px;animation:fi .2s ease}
.sec.active{display:block}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* HERO */
.hero{background:linear-gradient(160deg,#C8D8F8 0%,#D8E8F8 40%,#E0F0EC 100%);padding:50px 22px 22px;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;top:-60px;right:-40px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.35)}
.hero::after{content:'';position:absolute;bottom:-50px;left:-20px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.2)}
.hero-inner{position:relative;z-index:1}
.hero-label{font-size:11px;font-weight:700;color:rgba(74,123,232,.75);letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px}
.hero-total{font-family:var(--num);font-size:44px;font-weight:700;color:var(--tx);letter-spacing:-.5px;line-height:1;margin-bottom:4px}
.hero-date{font-size:11px;color:rgba(74,123,232,.6);margin-top:6px;font-weight:500}

/* NAV */
.bnav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.96);backdrop-filter:blur(24px);border-top:1px solid var(--brd);display:flex;padding:10px 2px calc(10px + env(safe-area-inset-bottom));z-index:100;box-shadow:0 -4px 20px rgba(100,120,200,.08)}
.nb{flex:1;padding:3px 2px;border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;font-family:inherit}
.ni-wrap{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;transition:.18s}
.nl{font-size:9px;font-weight:700;color:var(--t3);letter-spacing:.03em;transition:.18s}
.ns{width:16px;height:16px;stroke:var(--t3);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:.18s}
.nb.active .ni-wrap{background:var(--blue-l)}
.nb.active .nl{color:var(--blue)}
.nb.active .ns{stroke:var(--blue)}

/* CARDS */
.card{background:var(--surf);border-radius:var(--r);padding:16px;margin-bottom:12px;border:1px solid var(--brd2);box-shadow:var(--sh)}
.card-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}
.card-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--t2)}
.page-title{font-size:22px;font-weight:800;letter-spacing:-.4px;margin-bottom:15px}

/* LIST */
.li{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--brd2)}
.li:last-child{border-bottom:none}
.li-icon{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:10px;font-weight:800}
.li-body{flex:1;min-width:0}
.li-title{font-size:13px;font-weight:600;color:var(--tx)}
.li-sub{font-size:11px;color:var(--t2);margin-top:2px}
.li-amount{font-family:var(--num);font-size:14px;font-weight:600;white-space:nowrap}
.li-action{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--brd);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;background:transparent}

/* FORMS */
.fr{display:flex;flex-direction:column;gap:5px;margin-bottom:11px}
.fr label{font-size:11px;font-weight:700;color:var(--t2);letter-spacing:.04em}
.fr input,.fr select,.fr textarea{padding:11px 13px;font-size:14px;border-radius:var(--rs);border:1.5px solid var(--brd);background:var(--card2);color:var(--tx);width:100%;font-family:inherit;-webkit-appearance:none;transition:.2s}
.fr input:focus,.fr select:focus{outline:none;border-color:var(--blue);background:#fff;box-shadow:0 0 0 3px rgba(74,123,232,.1)}
.fg2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* BUTTONS */
.btn{width:100%;padding:13px;border-radius:var(--rs);border:none;font-size:14px;font-weight:700;cursor:pointer;color:#fff;font-family:inherit;transition:.15s}
.btn:active{transform:scale(.98)}
.btn-blue{background:var(--blue)}.btn-red{background:var(--red)}.btn-green{background:var(--green)}
.btn-amber{background:var(--amber)}.btn-tr{background:var(--tr)}
.btn-dark{background:var(--card2);border:1.5px solid var(--brd);color:var(--tx)}
.btn-ghost{padding:9px 14px;border-radius:var(--rs);border:1.5px solid var(--brd);background:var(--surf);color:var(--t2);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
.btn-sm{padding:5px 11px;border-radius:8px;border:none;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;color:#fff}
.btn-pagado{padding:6px 12px;border-radius:8px;border:1.5px solid var(--green-m);background:var(--green-l);color:var(--green);font-size:11px;font-weight:700;cursor:pointer;font-family:inherit}

/* TAGS */
.tag{display:inline-flex;align-items:center;font-size:10px;font-weight:700;padding:3px 8px;border-radius:100px}
.t-blue{background:var(--blue-l);color:var(--blue)}.t-red{background:var(--red-l);color:var(--red)}
.t-green{background:var(--green-l);color:var(--green)}.t-amber{background:var(--amber-l);color:var(--amber)}
.t-grey{background:var(--card2);color:var(--t2)}.t-tr{background:var(--tr-l);color:var(--tr)}

/* PROGRESS */
.prog{height:7px;border-radius:4px;background:var(--brd);overflow:hidden;margin:6px 0}
.prog-fill{height:100%;border-radius:4px;transition:.6s}
.pf-green{background:linear-gradient(90deg,#2BAA82,#5BC9A8)}
.pf-blue{background:linear-gradient(90deg,#4A7BE8,#82AEFF)}
.pf-red{background:linear-gradient(90deg,#E0595A,#F5A0A0)}
.pf-tr{background:linear-gradient(90deg,#6E7EC0,#9CAAE0)}

/* P&L BOX */
.pnl-box{border-radius:var(--rs);padding:14px 16px;margin-bottom:12px;border:1px solid transparent}
.pnl-pos{background:var(--green-l);border-color:var(--green-m)}
.pnl-neg{background:var(--red-l);border-color:var(--red-m)}
.pnl-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.pnl-val{font-family:var(--num);font-size:26px;font-weight:700;letter-spacing:-.3px}
.pnl-sub{font-size:11px;margin-top:4px;font-weight:600}

/* MISC */
.ep{background:var(--card2);border-radius:var(--rs);padding:13px;margin-top:10px;display:none;border:1px solid var(--brd2)}
.divlabel{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--t3);margin:13px 0 8px}
.msg-ok{font-size:13px;font-weight:700;color:var(--green);padding:12px;background:var(--green-l);border-radius:var(--rs);margin-top:10px;text-align:center;border:1px solid var(--green-m)}
.msg-err{font-size:13px;font-weight:700;color:var(--red);padding:12px;background:var(--red-l);border-radius:var(--rs);margin-top:10px;text-align:center}
.stats-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat-box{background:var(--surf);border-radius:14px;padding:14px;border:1px solid var(--brd2);box-shadow:var(--sh)}
.stat-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--t2);margin-bottom:6px}
.stat-val{font-family:var(--num);font-size:22px;font-weight:700}
.stat-sub{font-size:11px;color:var(--t2);margin-top:3px}
.baja{opacity:.35}

/* HABITUALES CHECK */
.hab-item{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--brd2);cursor:pointer;user-select:none}
.hab-item:last-child{border-bottom:none}
.hab-chk{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--brd);flex-shrink:0;display:flex;align-items:center;justify-content:center;background:#fff;transition:.18s}
.hab-item.on .hab-chk{background:var(--green);border-color:var(--green)}
.hab-body{flex:1}
.hab-name{font-size:13px;font-weight:600;color:var(--tx)}
.hab-item.on .hab-name{color:var(--t2)}
.hab-amt{font-family:var(--num);font-size:13px;font-weight:600;color:var(--t2)}

/* CALENDAR STRIP */
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-top:8px}
.ch{font-size:9px;text-align:center;font-weight:700;color:var(--t3);padding:4px}
.cd{font-family:var(--num);font-size:12px;font-weight:500;text-align:center;padding:7px 2px;border-radius:8px;color:var(--t2)}
.cd.bill{background:var(--blue-l);color:var(--blue);font-weight:700}
.cd.bill-san{background:var(--red-l);color:var(--red);font-weight:700}
.cd.paid{background:var(--green-l);color:var(--green);font-weight:700}
.cd.today{outline:2px solid var(--blue);outline-offset:-2px;font-weight:800;color:var(--tx)}
.cd.empty{opacity:0}
.cd-badge{display:inline-flex;align-items:center;padding:4px 10px;border-radius:100px;font-size:11px;font-weight:700}
.cd-ok{background:var(--green-l);color:var(--green)}.cd-soon{background:var(--amber-l);color:var(--amber)}
.cd-urg{background:var(--red-l);color:var(--red)}.cd-none{background:var(--card2);color:var(--t2)}

/* ACCT CARDS */
.acct-card{flex-shrink:0;width:148px;border-radius:16px;padding:15px;position:relative;overflow:hidden}
.acct-card::after{content:'';position:absolute;width:90px;height:90px;border-radius:50%;background:rgba(255,255,255,.15);top:-25px;right:-25px}
.acct-lbl{font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;opacity:.75;margin-bottom:10px}
.acct-val{font-family:var(--num);font-size:22px;font-weight:700;line-height:1;margin-bottom:4px;position:relative;z-index:1}
.acct-date{font-size:10px;opacity:.5}
.acct-bb{background:linear-gradient(135deg,#5B8EF0,#82AEFF);color:#fff}
.acct-sa{background:linear-gradient(135deg,#E07585,#F5A0AC);color:#fff}
.acct-tr{background:linear-gradient(135deg,#7E8FC4,#A0AFDC);color:#fff}
.accts-wrap{display:flex;gap:10px;overflow-x:auto;padding:14px 15px 6px;scrollbar-width:none}
.accts-wrap::-webkit-scrollbar{display:none}

/* FACTURAS CHECK */
.fi{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--brd2);cursor:pointer;user-select:none}
.fi:last-child{border-bottom:none}
.fi-chk{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--brd);flex-shrink:0;display:flex;align-items:center;justify-content:center;background:#fff;transition:.18s}
.fi.chk .fi-chk{background:var(--green);border-color:var(--green)}
.fi.nap{opacity:.22;pointer-events:none}
.fi-body{flex:1}
.fi-name{font-size:13px;font-weight:600}
.fi.chk .fi-name{color:var(--t2);text-decoration:line-through}
.fi-sub{font-size:11px;color:var(--t2);margin-top:2px}
.fi-amt{font-family:var(--num);font-size:13px;font-weight:600;color:var(--t2)}

/* BKBAR */
.bkbar{position:fixed;top:0;right:0;z-index:300;padding:10px 13px;display:flex;gap:8px;pointer-events:none}
.bkbtn{display:flex;align-items:center;gap:5px;padding:6px 12px;border-radius:100px;font-size:11px;font-weight:700;cursor:pointer;background:rgba(255,255,255,.88);backdrop-filter:blur(12px);border:1px solid var(--blue-m);color:var(--blue);font-family:inherit;box-shadow:var(--sh);pointer-events:all}

/* OBJ */
.oc{background:var(--surf);border-radius:var(--r);padding:16px;margin-bottom:10px;border:1px solid var(--brd2);box-shadow:var(--sh)}
.oc.done{background:linear-gradient(135deg,#E6F7F2,#F0FCF8);border-color:var(--green-m)}

/* MES NAV */
.mes-nav{display:flex;gap:10px;margin-bottom:15px;align-items:center}
.mes-nav span{flex:1;text-align:center;font-size:18px;font-weight:800;letter-spacing:-.3px}
</style>
</head>
<body>

<div class="bkbar">
  <button class="bkbtn" onclick="exportar()">
    <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    Exportar
  </button>
  <label class="bkbtn" style="cursor:pointer">
    <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
    Importar
    <input type="file" accept=".json" style="display:none" onchange="importar(event)"/>
  </label>
</div>

<div class="hero" id="hero">
  <div class="hero-inner">
    <div class="hero-label">Patrimonio total</div>
    <div class="hero-total" id="heroTotal">—</div>
    <div class="hero-date" id="heroDate"></div>
  </div>
</div>
<div class="accts-wrap" id="acctBar"></div>

<div class="sec active" id="s-inicio"></div>
<div class="sec" id="s-bbva"></div>
<div class="sec" id="s-santander"></div>
<div class="sec" id="s-tr"></div>
<div class="sec" id="s-productos"></div>
<div class="sec" id="s-iva"></div>
<div class="sec" id="s-facturas"></div>

<nav class="bnav">
  <button class="nb active" onclick="show('inicio',this)">
    <div class="ni-wrap"><svg class="ns" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></div>
    <span class="nl">Inicio</span>
  </button>
  <button class="nb" onclick="show('bbva',this)">
    <div class="ni-wrap"><svg class="ns" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg></div>
    <span class="nl">BBVA</span>
  </button>
  <button class="nb" onclick="show('santander',this)">
    <div class="ni-wrap"><svg class="ns" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg></div>
    <span class="nl">Santander</span>
  </button>
  <button class="nb" onclick="show('tr',this)">
    <div class="ni-wrap"><svg class="ns" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg></div>
    <span class="nl">Objetivos</span>
  </button>
  <button class="nb" onclick="show('productos',this)">
    <div class="ni-wrap"><svg class="ns" viewBox="0 0 24 24"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg></div>
    <span class="nl">Productos</span>
  </button>
  <button class="nb" onclick="show('iva',this)">
    <div class="ni-wrap"><svg class="ns" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="9" y1="15" x2="15" y2="9"/></svg></div>
    <span class="nl">IVA</span>
  </button>
  <button class="nb" onclick="show('facturas',this)">
    <div class="ni-wrap"><svg class="ns" viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg></div>
    <span class="nl">Facturas</span>
  </button>
</nav>

<script>
// ══════════════════════════════════════════
// GLOBALS
// ══════════════════════════════════════════
const hoy = new Date();
const SK = 'marta-finanzas-v1';
const mesesN = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const mesesC = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const diasS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
document.getElementById('heroDate').textContent = `${diasS[hoy.getDay()]}, ${hoy.getDate()} de ${mesesN[hoy.getMonth()]} de ${hoy.getFullYear()}`;

function fmt(n) { if(n==null)return'—'; return Math.abs(parseFloat(n)).toFixed(2).replace('.',',')+' €'; }
function mesKey(y,m) { return `${y}-${String(m).padStart(2,'0')}`; }
function isPast(dia,y,m) {
  const ty=hoy.getFullYear(),tm=hoy.getMonth(),td=hoy.getDate();
  if(y<ty||(y===ty&&m<tm))return true;
  if(y===ty&&m===tm&&dia<td)return true;
  return false;
}
function reciboActivo(r,y,m) {
  if(r.finAnio!==undefined) if(y>r.finAnio||(y===r.finAnio&&m>r.finMes))return false;
  return true;
}
function reciboAplica(r,y,m) {
  if(!reciboActivo(r,y,m))return false;
  if(r.frec==='monthly')return true;
  if(r.frec==='quarterly')return r.meses&&r.meses.includes(m);
  if(r.frec==='annual')return r.mesAnual===m;
  if(r.frec==='once')return r.mesAnual===m&&(!r.anio||r.anio===y);
  return false;
}
function diasRestantes(f) {
  if(!f)return null;
  const fd=new Date(f);fd.setHours(0,0,0,0);
  const hd=new Date();hd.setHours(0,0,0,0);
  return Math.ceil((fd-hd)/864e5);
}
function calcCuotasPagadas() {
  const ini=new Date('2026-05-01');if(hoy<ini)return 0;
  const m=(hoy.getFullYear()-ini.getFullYear())*12+(hoy.getMonth()-ini.getMonth());
  return Math.min(m+1,DB.prestamo.total);
}
function toDateInput(f) {
  if(!f)return hoy.toISOString().split('T')[0];
  if(f.includes('-'))return f;
  const p=f.split('/');return p.length===3?`${p[2]}-${p[1].padStart(2,'0')}-${p[0].padStart(2,'0')}`:hoy.toISOString().split('T')[0];
}
function fromDateInput(f) { if(!f)return'';const p=f.split('-');return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:''; }

// ══════════════════════════════════════════
// DB
// ══════════════════════════════════════════
function defaultDB() {
  return {
    _v: 1,
    saldos: {
      bbva: {val:512, fecha:'22/04/2026'},
      san:  {val:12.98, fecha:'22/04/2026'},
      tr:   {val:60.87, fecha:'22/04/2026'}
    },
    // BBVA — recibos fijos
    bbvaRecibos: [
      {id:1, nombre:'Neting', importe:48.39, frec:'monthly', dia:7},
      {id:2, nombre:'PIAS', importe:50, frec:'monthly', dia:10},
      {id:3, nombre:'Dr Smile', importe:41.46, frec:'monthly', dia:10, finAnio:2026, finMes:5},
      {id:4, nombre:'Aspiradora', importe:26.75, frec:'monthly', dia:10, finAnio:2026, finMes:11},
      {id:5, nombre:'Google ONE', importe:2.99, frec:'monthly', dia:10},
      {id:6, nombre:'Comparsa', importe:16, frec:'monthly', dia:16},
      {id:7, nombre:'App WB', importe:3.09, frec:'monthly', dia:24},
      {id:8, nombre:'DIGI', importe:10, frec:'monthly', dia:30},
      {id:9, nombre:'Legado Activo AXA', importe:20, frec:'monthly', dia:30},

function show(id, btn) {
  document.querySelectorAll('.sec').forEach(s=>s.classList.remove('active'));

  document.getElementById('s-'+id).classList.add('active');

}

function renderInicio() {
  renderHeader();
  const y=hoy.getFullYear(), m=hoy.getMonth();

  // BBVA: pagado vs pendiente este mes
  const bbvaBills = DB.bbvaRecibos.filter(r=>reciboAplica(r,y,m));
  const bbvaTotal = bbvaBills.reduce((s,r)=>s+r.importe,0);
  const bbvaPend  = bbvaBills.filter(r=>!isPast(r.dia,y,m)).reduce((s,r)=>s+r.importe,0);
  const bbvaPag   = bbvaTotal - bbvaPend;
  const bbvaPct   = bbvaTotal>0?Math.round(bbvaPag/bbvaTotal*100):0;

  // Santander: fijos + habituales activos + extras
  const sanFijos = DB.sanRecibos.filter(r=>reciboAplica(r,y,m));
  const sanFijosTotal = sanFijos.reduce((s,r)=>s+r.importe,0);
  const sanFijosPend  = sanFijos.filter(r=>!isPast(r.dia,y,m)).reduce((s,r)=>s+r.importe,0);
  const mk = mesKey(y,m);
  const sanActivos = DB.sanGastosMes[mk]||[];
  const sanExtras  = DB.sanExtrasMes[mk]||[];
  const sanVarTotal = sanActivos.reduce((s,g)=>s+g.importe,0) + sanExtras.reduce((s,g)=>s+g.importe,0);
  const sanTotal = sanFijosTotal + sanVarTotal;
  const sanPend  = sanFijosPend; // variables se consideran ya "gastadas"
  const sanPct   = sanTotal>0?Math.round((sanTotal-sanPend)/sanTotal*100):0;

  // Deudas pendientes
  const deudasPend = (DB.deudas||[]).filter(d=>!d.pagada);

  // Próximos recibos (ambas cuentas, próximos 5 días)
  const hoy_d = hoy.getDate();
  const proxBBVA = bbvaBills.filter(r=>!isPast(r.dia,y,m)&&(r.dia-hoy_d)<=5).sort((a,b)=>a.dia-b.dia);
  const proxSAN  = sanFijos.filter(r=>!isPast(r.dia,y,m)&&(r.dia-hoy_d)<=5).sort((a,b)=>a.dia-b.dia);
  const proximos = [...proxBBVA.map(r=>({...r,banco:'BBVA',color:'var(--blue)',light:'var(--blue-l)'})),
                    ...proxSAN.map(r=>({...r,banco:'Santander',color:'var(--red)',light:'var(--red-l)'}))].sort((a,b)=>a.dia-b.dia);

  let html = '';

  // Resumen BBVA
  html += `<div class="card" style="border-top:3px solid var(--blue)">
    <div class="card-hdr"><span class="card-title" style="color:var(--blue)">BBVA — ${mesesC[m]}</span><span class="tag t-blue">${bbvaPct}% pagado</span></div>
    <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:8px">
      <div>
        <div style="font-size:10px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.07em;margin-bottom:4px">Pendiente</div>
        <div class="num" style="font-size:28px;font-weight:700;color:var(--blue)">−${fmt(bbvaPend)}</div>
      </div>
      <div style="text-align:right">
        <div style="font-size:10px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.07em;margin-bottom:4px">Total mes</div>
        <div class="num" style="font-size:16px;font-weight:700;color:var(--t2)">−${fmt(bbvaTotal)}</div>
      </div>
    </div>
    <div class="prog"><div class="prog-fill pf-blue" style="width:${bbvaPct}%"></div></div>
    <div style="font-size:11px;color:var(--t2);margin-top:4px">Pagado ${fmt(bbvaPag)}</div>
  </div>`;

  // Resumen Santander
  html += `<div class="card" style="border-top:3px solid var(--red)">
    <div class="card-hdr"><span class="card-title" style="color:var(--red)">Santander — ${mesesC[m]}</span><span class="tag t-red">${sanPct}% pagado</span></div>
    <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:8px">
      <div>
        <div style="font-size:10px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.07em;margin-bottom:4px">Fijos pendientes</div>
        <div class="num" style="font-size:28px;font-weight:700;color:var(--red)">−${fmt(sanPend)}</div>
      </div>
      <div style="text-align:right">
        <div style="font-size:10px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.07em;margin-bottom:4px">Total mes</div>
        <div class="num" style="font-size:16px;font-weight:700;color:var(--t2)">−${fmt(sanTotal)}</div>
      </div>
    </div>
    <div class="prog"><div class="prog-fill pf-red" style="width:${sanPct}%"></div></div>
    <div style="font-size:11px;color:var(--t2);margin-top:4px">Fijos ${fmt(sanFijosTotal)} · Variables ${fmt(sanVarTotal)}</div>
  </div>`;

  // Próximos vencimientos (≤5 días)
  if(proximos.length) {
    html += `<div class="card" style="border-top:3px solid var(--amber)">
      <div class="card-hdr"><span class="card-title" style="color:var(--amber)">Próximos vencimientos</span><span class="tag t-amber">${proximos.length} recibo${proximos.length>1?'s':''}</span></div>
      ${proximos.map(r=>`<div class="li">
        <div class="li-icon" style="background:${r.light};color:${r.color};font-size:9px;font-weight:800">d.${r.dia}</div>
        <div class="li-body"><div class="li-title">${r.nombre}</div><div class="li-sub">${r.banco}</div></div>
        <div class="li-amount" style="color:var(--red)">−${fmt(r.importe)}</div>
      </div>`).join('')}
    </div>`;
  }

  // Deudas/Bizums
  if(deudasPend.length) {
    html += `<div class="card" style="border-top:3px solid var(--red)">
      <div class="card-hdr"><span class="card-title" style="color:var(--red)">Bizums pendientes</span><span class="num" style="font-size:17px;font-weight:700;color:var(--red)">−${fmt(deudasPend.reduce((s,d)=>s+d.importe,0))}</span></div>
      ${deudasPend.map(d=>`<div class="li">
        <div class="li-icon" style="background:var(--red-l);color:var(--red)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg></div>
        <div class="li-body"><div class="li-title">${d.nombre}</div>${d.notas?`<div class="li-sub">${d.notas}</div>`:''}</div>
        <div class="li-amount" style="color:var(--red);margin-right:8px">−${fmt(d.importe)}</div>
        <button class="btn-pagado" onclick="pagarDeuda(${d.id})">Pagado</button>
      </div>`).join('')}
    </div>`;
  }

  document.getElementById('s-inicio').innerHTML = html;
}
function pagarDeuda(id) {
  const d=(DB.deudas||[]).find(x=>x.id===id);
  if(!d)return; d.pagada=true; d.pagadaMes=mesKey(hoy.getFullYear(),hoy.getMonth());
  save(); renderInicio();
}

let bbvaMesY=hoy.getFullYear(), bbvaMesM=hoy.getMonth();
function renderBBVA() {
  const y=bbvaMesY, m=bbvaMesM;
  const recibos = DB.bbvaRecibos.filter(r=>reciboAplica(r,y,m)).sort((a,b)=>a.dia-b.dia);

  const pag   = total-pend;
  const pct   = total>0?Math.round(pag/total*100):0;

  // Calendario visual
  const byDay={};
  recibos.forEach(r=>{if(!byDay[r.dia])byDay[r.dia]=[];byDay[r.dia].push(r);});
  const firstDay=new Date(y,m,1).getDay(), offset=firstDay===0?6:firstDay-1;
  const daysInM=new Date(y,m+1,0).getDate();
  let calHtml='';
  for(let i=0;i<offset;i++) calHtml+=`<div class="cd empty">·</div>`;
  for(let d=1;d<=daysInM;d++){
    const hb=byDay[d], isToday=hoy.getFullYear()===y&&hoy.getMonth()===m&&d===hoy.getDate();
    const past=isPast(d,y,m);
    calHtml+=`<div class="cd${hb?(past?' paid':' bill'):''}${isToday?' today':''}">${d}</div>`;
  }

  const finLabel = r => r.finAnio!==undefined
    ? `<span class="tag t-amber" style="margin-left:4px;font-size:9px">hasta ${mesesC[r.finMes].toLowerCase()} ${r.finAnio}</span>` : '';
  const frecLabel = r => ({monthly:'Mensual',quarterly:'Trimestral',annual:'Anual',once:'Único'}[r.frec]||r.frec);

  let html = `<div class="page-title" style="color:var(--blue)">BBVA — Recibos</div>
  <div class="mes-nav">
    <button class="btn-ghost" onclick="bbvaMes(-1)">←</button>
    <span>${mesesC[m]} ${y}</span>
    <button class="btn-ghost" onclick="bbvaMes(1)">→</button>
  </div>
  <div class="stats-row">
    <div class="stat-box" style="border-top:3px solid var(--blue)">
      <div class="stat-lbl" style="color:var(--blue)">Pendiente</div>
      <div class="stat-val" style="color:var(--blue)">−${fmt(pend)}</div>
      <div class="stat-sub">de ${fmt(total)} total</div>
      <div class="prog" style="margin-top:8px;margin-bottom:0"><div class="prog-fill pf-blue" style="width:${pct}%"></div></div>
    </div>
    <div class="stat-box" style="border-top:3px solid var(--green)">
      <div class="stat-lbl" style="color:var(--green)">Pagado</div>
      <div class="stat-val" style="color:var(--green)">−${fmt(pag)}</div>
      <div class="stat-sub">${pct}% del mes</div>
    </div>
  </div>
  <div class="card" style="padding:12px">
    <div class="cg"><div class="ch">L</div><div class="ch">M</div><div class="ch">X</div><div class="ch">J</div><div class="ch">V</div><div class="ch">S</div><div class="ch">D</div></div>
    <div class="cg">${calHtml}</div>
  </div>
  <div class="card" style="border-top:3px solid var(--blue)">
    <div class="card-hdr"><span class="card-title" style="color:var(--blue)">Recibos del mes</span></div>
    ${recibos.map(r=>{
      const past=isPast(r.dia,y,m);
      return `<div class="li">
        <div class="li-icon" style="background:var(--blue-l);color:var(--blue);font-size:9px;font-weight:800">d.${r.dia}</div>
        <div class="li-body">
          <div class="li-title">${r.nombre} ${finLabel(r)}</div>
          <div class="li-sub">${frecLabel(r)}</div>
        </div>
        <span class="tag ${past?'t-green':'t-amber'}" style="margin-right:6px">${past?'Pagado':'Pendiente'}</span>
        <div class="li-amount" style="color:${past?'var(--t2)':'var(--red)'}">−${fmt(r.importe)}</div>
      </div>`;
    }).join('')||'<div style="font-size:13px;color:var(--t2);padding:8px 0">Sin recibos este mes</div>'}
    <div style="background:var(--blue-l);border-radius:var(--rs);padding:11px 14px;margin-top:10px;display:flex;justify-content:space-between;align-items:center">
      <span style="font-size:12px;font-weight:700;color:var(--blue)">Total BBVA ${mesesC[m]}</span>
      <span class="num" style="font-size:16px;font-weight:700;color:var(--blue)">−${fmt(total)}</span>
    </div>
  </div>
  <div class="card" style="border-top:3px solid var(--blue)">
    <div class="card-hdr"><span class="card-title" style="color:var(--blue)">Todos los recibos</span></div>
    ${DB.bbvaRecibos.map(r=>{
      const activo=reciboActivo(r,y,m);
      const fl=frecLabel(r);
      return `<div class="${activo?'':'baja'}"><div class="li">
        <div class="li-icon" style="background:var(--blue-l);color:var(--blue);font-size:9px;font-weight:800">d.${r.dia}</div>
        <div class="li-body">
          <div class="li-title">${r.nombre} ${finLabel(r)}</div>
          <div class="li-sub">${fl}${!activo?' · Baja':''}</div>
        </div>
        <div class="li-amount" style="color:var(--red);margin-right:8px">−${fmt(r.importe)}</div>
        <div class="li-action" onclick="toggleEditBBVA(${r.id})" style="border-radius:8px">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="var(--t2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>

        <div style="display:flex;gap:8px">
          <button class="btn btn-green" style="flex:1;padding:10px;font-size:13px" onclick="guardarBBVA(${r.id})">✓ Guardar</button>

          <button class="btn btn-red" style="padding:10px 12px;font-size:12px" onclick="borrarRecibo('bbva',${r.id})">🗑</button>
        </div>
      </div></div>`;
    }).join('')}
  </div>
  <div class="card" style="border:2px dashed var(--brd)">
    <div class="card-title" style="margin-bottom:13px">Añadir recibo BBVA</div>
    <div class="fr"><label>Nombre</label><input type="text" id="bbvaN" placeholder="Ej: Netflix"/></div>
    <div class="fg2">
      <div class="fr"><label>Importe (€)</label><input type="number" id="bbvaI" step="0.01" inputmode="decimal" placeholder="0,00"/></div>
      <div class="fr"><label>Día de cargo</label><input type="number" id="bbvaD" min="1" max="31" placeholder="1"/></div>
    </div>
    <div class="fg2">
      <div class="fr"><label>Frecuencia</label>
        <select id="bbvaF"><option value="monthly">Mensual</option><option value="quarterly">Trimestral</option><option value="annual">Anual</option><option value="once">Único</option></select>
      </div>
      <div class="fr"><label>Fin (opcional)</label><input type="month" id="bbvaFin" placeholder="aaaa-mm"/></div>

function bbvaMes(d){bbvaMesM+=d;if(bbvaMesM>11){bbvaMesM=0;bbvaMesY++;}if(bbvaMesM<0){bbvaMesM=11;bbvaMesY--;}renderBBVA();}
function toggleEditBBVA(id){const el=document.getElementById('eb-'+id);if(el)el.style.display=el.style.display==='block'?'none':'block';}
function guardarBBVA(id){
  const r=DB.bbvaRecibos.find(x=>x.id===id);if(!r)return;
  const n=document.getElementById('ebN-'+id)?.value.trim();if(n)r.nombre=n;
  const i=parseFloat(document.getElementById('ebI-'+id)?.value);if(!isNaN(i))r.importe=i;
  save();renderBBVA();
}
function bajaRecibo(bank,id){
  const arr=bank==='bbva'?DB.bbvaRecibos:DB.sanRecibos;
  const r=arr.find(x=>x.id===id);if(!r)return;
  r.finAnio=hoy.getFullYear();r.finMes=hoy.getMonth();
  save();bank==='bbva'?renderBBVA():renderSantander();
}
function altaRecibo(bank,id){
  const arr=bank==='bbva'?DB.bbvaRecibos:DB.sanRecibos;
  const r=arr.find(x=>x.id===id);if(!r)return;
  delete r.finAnio;delete r.finMes;
  save();bank==='bbva'?renderBBVA():renderSantander();
}
function borrarRecibo(bank,id){
  if(bank==='bbva')DB.bbvaRecibos=DB.bbvaRecibos.filter(x=>x.id!==id);
  else DB.sanRecibos=DB.sanRecibos.filter(x=>x.id!==id);
  save();bank==='bbva'?renderBBVA():renderSantander();
}
function addBBVA(){
  const nombre=document.getElementById('bbvaN').value.trim();
  const importe=parseFloat(document.getElementById('bbvaI').value);
  const dia=parseInt(document.getElementById('bbvaD').value)||1;
  const frec=document.getElementById('bbvaF').value;
  const fin=document.getElementById('bbvaFin').value;
  const msg=document.getElementById('bbvaMsg');
  if(!nombre||isNaN(importe)||importe<=0){msg.className='msg-err';msg.textContent='⚠ Nombre e importe obligatorios';return;}
  const r={id:Date.now(),nombre,importe,frec,dia};
  if(frec==='quarterly')r.meses=[0,3,6,9];
  if(frec==='annual'||frec==='once'){r.mesAnual=hoy.getMonth();if(frec==='once')r.anio=hoy.getFullYear();}
  if(fin){const[fy,fm]=fin.split('-').map(Number);r.finAnio=fy;r.finMes=fm-1;}
  DB.bbvaRecibos.push(r);save();
  msg.className='msg-ok';msg.textContent='✓ Recibo añadido';
  setTimeout(()=>renderBBVA(),900);
}

// SANTANDER
// ══════════════════════════════════════════
let sanMesY=hoy.getFullYear(), sanMesM=hoy.getMonth();
function renderSantander() {
  const y=sanMesY, m=sanMesM, mk=mesKey(y,m);
  const fijos=DB.sanRecibos.filter(r=>reciboAplica(r,y,m)).sort((a,b)=>a.dia-b.dia);
  const fijosTotal=fijos.reduce((s,r)=>s+r.importe,0);
  const fijosPend=fijos.filter(r=>!isPast(r.dia,y,m)).reduce((s,r)=>s+r.importe,0);
  const activos=DB.sanGastosMes[mk]||[];
  const extras=DB.sanExtrasMes[mk]||[];
  const varTotal=activos.reduce((s,g)=>s+g.importe,0)+extras.reduce((s,g)=>s+g.importe,0);
  const totalMes=fijosTotal+varTotal;

  const finLabel=r=>r.finAnio!==undefined?`<span class="tag t-amber" style="margin-left:4px;font-size:9px">hasta ${mesesC[r.finMes].toLowerCase()} ${r.finAnio}</span>`:'' ;

  let html=`<div class="page-title" style="color:var(--red)">Santander — Gastos</div>
  <div class="mes-nav">
    <button class="btn-ghost" onclick="sanMes(-1)">←</button>
    <span>${mesesC[m]} ${y}</span>
    <button class="btn-ghost" onclick="sanMes(1)">→</button>
  </div>
  <div class="stats-row">
    <div class="stat-box" style="border-top:3px solid var(--red)">
      <div class="stat-lbl" style="color:var(--red)">Total mes</div>
      <div class="stat-val" style="color:var(--red)">−${fmt(totalMes)}</div>
      <div class="stat-sub">Fijos ${fmt(fijosTotal)} · Variables ${fmt(varTotal)}</div>
    </div>
    <div class="stat-box" style="border-top:3px solid var(--amber)">
      <div class="stat-lbl" style="color:var(--amber)">Fijos pendientes</div>
      <div class="stat-val" style="color:var(--amber)">−${fmt(fijosPend)}</div>
      <div class="stat-sub">de ${fmt(fijosTotal)} fijos</div>
    </div>
  </div>

  <!-- RECIBOS FIJOS -->
  <div class="card" style="border-top:3px solid var(--red)">
    <div class="card-hdr"><span class="card-title" style="color:var(--red)">Recibos fijos</span><span class="num" style="font-size:15px;font-weight:700;color:var(--red)">−${fmt(fijosTotal)}</span></div>
    ${fijos.map(r=>{
      const past=isPast(r.dia,y,m);
      return `<div class="li">
        <div class="li-icon" style="background:var(--red-l);color:var(--red);font-size:9px;font-weight:800">d.${r.dia}</div>
        <div class="li-body"><div class="li-title">${r.nombre} ${finLabel(r)}</div></div>
        <span class="tag ${past?'t-green':'t-amber'}" style="margin-right:6px">${past?'Pagado':'Pendiente'}</span>
        <div class="li-amount" style="color:${past?'var(--t2)':'var(--red)'}">−${fmt(r.importe)}</div>
      </div>`;
    }).join('')||'<div style="font-size:13px;color:var(--t2);padding:8px 0">Sin recibos fijos este mes</div>'}
  </div>

  <!-- HABITUALES -->
  <div class="card" style="border-top:3px solid var(--amber)">
    <div class="card-hdr"><span class="card-title" style="color:var(--amber)">Gastos habituales</span><span class="num" style="font-size:14px;font-weight:700;color:var(--amber)">−${fmt(activos.reduce((s,g)=>s+g.importe,0))}</span></div>
    <div style="font-size:11px;color:var(--t2);margin-bottom:10px">Activa los que hayas hecho este mes. Puedes editar el importe.</div>
    ${DB.sanHabituales.map(h=>{
      const activo=activos.find(g=>g.habId===h.id);
      return `<div class="hab-item${activo?' on':''}" onclick="toggleHabitual(${h.id})">
        <div class="hab-chk">${activo?`<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`:''}
        </div>
        <div class="hab-body">
          <div class="hab-name">${h.nombre}</div>
          <div style="font-size:10px;color:var(--t2)">${h.cat}</div>
        </div>
        <div style="display:flex;align-items:center;gap:6px" onclick="event.stopPropagation()">
          ${activo?`<input type="number" value="${activo.importe}" step="1" inputmode="decimal" style="width:64px;padding:5px 8px;font-size:13px;border-radius:8px;border:1.5px solid var(--brd);background:var(--card2);color:var(--tx);font-family:var(--num);font-weight:700" onchange="editHabImporte(${h.id},this.value)"/>`:`<span class="hab-amt">${fmt(h.importe)}</span>`}
        </div>
      </div>`;
    }).join('')}
    <div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--brd2)">
      <div style="font-size:10px;font-weight:700;color:var(--t2);letter-spacing:.04em;margin-bottom:8px">GESTIONAR HABITUALES</div>
      ${DB.sanHabituales.map(h=>`
        <div class="li" style="padding:8px 0">
          <div class="li-body"><div class="li-title" style="font-size:12px">${h.nombre}</div><div class="li-sub">${h.cat}</div></div>
          <div class="li-amount" style="color:var(--t2);margin-right:6px;font-size:12px">${fmt(h.importe)}</div>
          <div class="li-action" onclick="toggleEditHab(${h.id})" style="border-radius:8px">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="var(--t2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          </div>
        </div>
        <div id="eh-${h.id}" class="ep">
          <div class="fg2" style="margin-bottom:8px">
            <div class="fr"><label>Nombre</label><input type="text" id="ehN-${h.id}" value="${h.nombre}"/></div>
            <div class="fr"><label>Importe base (€)</label><input type="number" id="ehI-${h.id}" value="${h.importe}" step="0.01" inputmode="decimal"/></div>
            <div class="fr"><label>Categoría</label><input type="text" id="ehC-${h.id}" value="${h.cat}"/></div>
          </div>
          <div style="display:flex;gap:8px">
            <button class="btn btn-green" style="flex:1;padding:10px;font-size:13px" onclick="guardarHab(${h.id})">✓ Guardar</button>
            <button class="btn btn-red" style="padding:10px 12px;font-size:12px" onclick="borrarHab(${h.id})">🗑</button>
          </div>
        </div>`).join('')}
      <div style="display:flex;gap:8px;margin-top:10px">
        <input type="text" id="habN" placeholder="Nuevo habitual" style="flex:1;padding:10px 12px;font-size:13px;border-radius:var(--rs);border:1.5px solid var(--brd);background:var(--card2);color:var(--tx);font-family:inherit"/>
        <input type="number" id="habI" placeholder="€" inputmode="decimal" style="width:68px;padding:10px;font-size:13px;border-radius:var(--rs);border:1.5px solid var(--brd);background:var(--card2);color:var(--tx);font-family:inherit"/>
        <button class="btn btn-amber" style="width:auto;padding:10px 14px;font-size:16px" onclick="addHabitual()">+</button>
      </div>
    </div>
  </div>

  <!-- GASTOS EXTRA -->
  <div class="card" style="border-top:3px solid var(--red)">
    <div class="card-hdr"><span class="card-title" style="color:var(--red)">Gastos extra del mes</span><span class="num" style="font-size:14px;font-weight:700;color:var(--red)">−${fmt(extras.reduce((s,g)=>s+g.importe,0))}</span></div>
    ${extras.map(g=>`<div class="li">
      <div class="li-body"><div class="li-title">${g.nombre}</div></div>
      <div class="li-amount" style="color:var(--red);margin-right:8px">−${fmt(g.importe)}</div>
      <div class="li-action" onclick="borrarExtra(${g.id})" style="border:none">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="var(--t2)" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </div>
    </div>`).join('')||'<div style="font-size:13px;color:var(--t2);padding:6px 0">Sin gastos extra este mes</div>'}
    <div style="display:flex;gap:8px;margin-top:10px">
      <input type="text" id="exN" placeholder="Concepto" style="flex:1;padding:10px 12px;font-size:13px;border-radius:var(--rs);border:1.5px solid var(--brd);background:var(--card2);color:var(--tx);font-family:inherit"/>
      <input type="number" id="exI" placeholder="€" inputmode="decimal" style="width:68px;padding:10px;font-size:13px;border-radius:var(--rs);border:1.5px solid var(--brd);background:var(--card2);color:var(--tx);font-family:inherit"/>
      <button class="btn btn-red" style="width:auto;padding:10px 14px;font-size:16px" onclick="addExtra()">+</button>
    </div>
  </div>

  <!-- RECIBOS FIJOS (gestión) -->
  <div class="card" style="border:2px dashed var(--brd)">
    <div class="card-title" style="margin-bottom:13px">Añadir recibo fijo Santander</div>
    <div class="fr"><label>Nombre</label><input type="text" id="sanN" placeholder="Ej: Seguro coche"/></div>
    <div class="fg2">
      <div class="fr"><label>Importe (€)</label><input type="number" id="sanI" step="0.01" inputmode="decimal" placeholder="0,00"/></div>
      <div class="fr"><label>Día de cargo</label><input type="number" id="sanD" min="1" max="31" placeholder="1"/></div>
    </div>
    <div class="fg2">
      <div class="fr"><label>Frecuencia</label>
        <select id="sanF"><option value="monthly">Mensual</option><option value="quarterly">Trimestral</option><option value="annual">Anual</option><option value="once">Único</option></select>
      </div>
      <div class="fr"><label>Fin (opcional)</label><input type="month" id="sanFin"/></div>
    </div>
    <button class="btn btn-red" onclick="addSanRecibo()">Añadir recibo</button>
    <div id="sanMsg"></div>
  </div>

  <!-- TODOS LOS RECIBOS FIJOS SANTANDER (gestión) -->
  <div class="card" style="border-top:3px solid var(--red)">
    <div class="card-hdr"><span class="card-title" style="color:var(--red)">Todos los recibos fijos</span></div>
    ${DB.sanRecibos.map(r=>{
      const activo=reciboActivo(r,y,m);
      return `<div class="${activo?'':'baja'}"><div class="li">
        <div class="li-icon" style="background:var(--red-l);color:var(--red);font-size:9px;font-weight:800">d.${r.dia}</div>
        <div class="li-body"><div class="li-title">${r.nombre} ${finLabel(r)}</div><div class="li-sub">${({monthly:'Mensual',quarterly:'Trimestral',annual:'Anual',once:'Único'}[r.frec]||r.frec)}${!activo?' · Baja':''}</div></div>
        <div class="li-amount" style="color:var(--red);margin-right:8px">−${fmt(r.importe)}</div>
        <div class="li-action" onclick="toggleEditSAN(${r.id})" style="border-radius:8px">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="var(--t2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        </div>
      </div>
      <div id="es-${r.id}" class="ep">
        <div class="fg2" style="margin-bottom:8px">
          <div class="fr"><label>Nombre</label><input type="text" id="esN-${r.id}" value="${r.nombre}"/></div>
          <div class="fr"><label>Importe (€)</label><input type="number" id="esI-${r.id}" value="${r.importe}" step="0.01" inputmode="decimal"/></div>
        </div>
        <div style="display:flex;gap:8px">
          <button class="btn btn-green" style="flex:1;padding:10px;font-size:13px" onclick="guardarSAN(${r.id})">✓ Guardar</button>
          ${activo?`<button class="btn btn-red" style="flex:1;padding:10px;font-size:12px" onclick="bajaRecibo('san',${r.id})">Dar de baja</button>`:`<button class="btn btn-dark" style="flex:1;padding:10px;font-size:12px" onclick="altaRecibo('san',${r.id})">Reactivar</button>`}
          <button class="btn btn-red" style="padding:10px 12px;font-size:12px" onclick="borrarRecibo('san',${r.id})">🗑</button>
        </div>
      </div></div>`;
    }).join('')||'<div style="font-size:13px;color:var(--t2);padding:8px 0">Sin recibos registrados</div>'}
  </div>`;

  document.getElementById('s-santander').innerHTML = html;
}
function sanMes(d){sanMesM+=d;if(sanMesM>11){sanMesM=0;sanMesY++;}if(sanMesM<0){sanMesM=11;sanMesY--;}renderSantander();}
function toggleHabitual(habId){
  const mk=mesKey(sanMesY,sanMesM);
  if(!DB.sanGastosMes[mk])DB.sanGastosMes[mk]=[];
  const idx=DB.sanGastosMes[mk].findIndex(g=>g.habId===habId);
  if(idx>=0)DB.sanGastosMes[mk].splice(idx,1);
  else{const h=DB.sanHabituales.find(x=>x.id===habId);if(h)DB.sanGastosMes[mk].push({habId,importe:h.importe});}
  save();renderSantander();
}
function editHabImporte(habId,val){
  const mk=mesKey(sanMesY,sanMesM);
  if(!DB.sanGastosMes[mk])return;
  const g=DB.sanGastosMes[mk].find(x=>x.habId===habId);
  if(g){g.importe=parseFloat(val)||0;save();}
}
function toggleEditHab(id){const el=document.getElementById('eh-'+id);if(el)el.style.display=el.style.display==='block'?'none':'block';}
function guardarHab(id){
  const h=DB.sanHabituales.find(x=>x.id===id);if(!h)return;
  const n=document.getElementById('ehN-'+id)?.value.trim();if(n)h.nombre=n;
  const i=parseFloat(document.getElementById('ehI-'+id)?.value);if(!isNaN(i))h.importe=i;
  const c=document.getElementById('ehC-'+id)?.value.trim();if(c)h.cat=c;
  save();renderSantander();
}
function borrarHab(id){DB.sanHabituales=DB.sanHabituales.filter(x=>x.id!==id);save();renderSantander();}
function addHabitual(){
  const n=document.getElementById('habN').value.trim();
  const i=parseFloat(document.getElementById('habI').value);
  if(!n)return;
  DB.sanHabituales.push({id:Date.now(),nombre:n,importe:isNaN(i)?0:i,cat:'otro'});
  save();renderSantander();
}
function addExtra(){
  const n=document.getElementById('exN').value.trim();
  const i=parseFloat(document.getElementById('exI').value);
  if(!n)return;
  const mk=mesKey(sanMesY,sanMesM);
  if(!DB.sanExtrasMes[mk])DB.sanExtrasMes[mk]=[];
  DB.sanExtrasMes[mk].push({id:Date.now(),nombre:n,importe:isNaN(i)?0:i});
  save();renderSantander();
}
function borrarExtra(id){
  const mk=mesKey(sanMesY,sanMesM);
  if(DB.sanExtrasMes[mk])DB.sanExtrasMes[mk]=DB.sanExtrasMes[mk].filter(x=>x.id!==id);
  save();renderSantander();
}
function toggleEditSAN(id){const el=document.getElementById('es-'+id);if(el)el.style.display=el.style.display==='block'?'none':'block';}
function guardarSAN(id){
  const r=DB.sanRecibos.find(x=>x.id===id);if(!r)return;
  const n=document.getElementById('esN-'+id)?.value.trim();if(n)r.nombre=n;
  const i=parseFloat(document.getElementById('esI-'+id)?.value);if(!isNaN(i))r.importe=i;
  save();renderSantander();
}
function addSanRecibo(){
  const nombre=document.getElementById('sanN').value.trim();
  const importe=parseFloat(document.getElementById('sanI').value);
  const dia=parseInt(document.getElementById('sanD').value)||1;
  const frec=document.getElementById('sanF').value;
  const fin=document.getElementById('sanFin').value;
  const msg=document.getElementById('sanMsg');
  if(!nombre||isNaN(importe)||importe<=0){msg.className='msg-err';msg.textContent='⚠ Nombre e importe obligatorios';return;}
  const r={id:Date.now(),nombre,importe,frec,dia};
  if(frec==='quarterly')r.meses=[0,3,6,9];
  if(frec==='annual'||frec==='once'){r.mesAnual=hoy.getMonth();if(frec==='once')r.anio=hoy.getFullYear();}
  if(fin){const[fy,fm]=fin.split('-').map(Number);r.finAnio=fy;r.finMes=fm-1;}
  DB.sanRecibos.push(r);save();
  msg.className='msg-ok';msg.textContent='✓ Recibo añadido';
  setTimeout(()=>renderSantander(),900);
}

// ══════════════════════════════════════════
// TRADE REPUBLIC — OBJETIVOS
// ══════════════════════════════════════════
function renderTR() {
  const saldoTR=DB.saldos.tr?.val||0;
  const totalMeta=DB.objetivos.reduce((s,o)=>s+o.meta,0);
  const ordenados=[...DB.objetivos].sort((a,b)=>{
    if(!a.fecha&&!b.fecha)return 0;if(!a.fecha)return 1;if(!b.fecha)return -1;
    return new Date(a.fecha)-new Date(b.fecha);
  });
  let restante=saldoTR;
  const asignado={};
  ordenados.forEach(o=>{const c=Math.min(o.meta,Math.max(0,restante));asignado[o.id]=c;restante=Math.max(0,restante-o.meta);});

  let html=`<div class="page-title" style="color:var(--tr)">Trade Republic — Objetivos</div>
  <div class="card" style="border-top:3px solid var(--tr)">
    <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:10px">
      <div>
        <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--tr)">Saldo disponible</div>
        <div class="num" style="font-size:32px;font-weight:700;margin-top:4px">${fmt(saldoTR)}</div>
      </div>
      <div style="text-align:right">
        <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--t2)">Total metas</div>
        <div class="num" style="font-size:18px;font-weight:700;margin-top:4px">${fmt(totalMeta)}</div>
      </div>
    </div>
    <div class="prog" style="height:8px"><div class="prog-fill pf-tr" style="width:${Math.min(100,(saldoTR/totalMeta*100)||0).toFixed(1)}%"></div></div>
    <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--t2);margin-top:5px;font-weight:600">
      <span>${Math.min(100,(saldoTR/totalMeta*100)||0).toFixed(0)}% cubierto</span>
      ${saldoTR<totalMeta?`<span style="color:var(--red)">Déficit ${fmt(totalMeta-saldoTR)}</span>`:`<span style="color:var(--green)">✓ Todo cubierto</span>`}
    </div>
    <div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--brd2)">
      <div class="fr"><label>Actualizar saldo TR (€)</label><input type="number" id="trSaldo" value="${saldoTR}" step="0.01" inputmode="decimal"/></div>
      <div class="fr"><label>Fecha</label><input type="date" id="trFecha" value="${toDateInput(DB.saldos.tr?.fecha)}"/></div>
      <button class="btn btn-tr" onclick="actualizarTR()">Guardar saldo</button>
    </div>
  </div>`;

  html+=ordenados.map((o,idx)=>{
    const cubre=asignado[o.id]||0, faltan=Math.max(0,o.meta-cubre);
    const pct=o.meta>0?Math.min(100,Math.round(cubre/o.meta*100)):0;
    const cubierto=pct>=100;
    const dias=diasRestantes(o.fecha);
    let cbCls='cd-none',cbTxt='Sin fecha';
    if(dias!==null){if(dias<0){cbTxt='Vencido';cbCls='cd-urg';}else if(dias<=30){cbTxt=`${dias}d`;cbCls='cd-urg';}else if(dias<=90){cbTxt=`${dias}d`;cbCls='cd-soon';}else{cbTxt=`${dias}d`;cbCls='cd-ok';}}
    return `<div class="oc${cubierto?' done':''}">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:11px">
        <div style="width:26px;height:26px;border-radius:50%;background:${cubierto?'var(--green)':'var(--tr-l)'};color:${cubierto?'#fff':'var(--tr)'};display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex-shrink:0">${cubierto?'✓':idx+1}</div>
        <div style="flex:1">
          <div style="font-size:16px;font-weight:800;color:${cubierto?'var(--green)':'var(--tx)'}">${o.nombre}</div>
          <div style="font-size:11px;color:var(--t2);margin-top:2px">${o.fecha?new Date(o.fecha).toLocaleDateString('es-ES',{day:'2-digit',month:'long',year:'numeric'}):'Sin fecha límite'}</div>
        </div>
        <span class="cd-badge ${cbCls}">${cbTxt}</span>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:12px;font-weight:600;margin-bottom:6px">
        <span style="color:var(--t2)">Cubierto <span class="num" style="color:${cubierto?'var(--green)':'var(--tx)'};font-size:13px;font-weight:700">${fmt(cubre)}</span></span>
        <span style="color:var(--t2)">Meta <span class="num" style="font-size:13px;font-weight:700">${fmt(o.meta)}</span></span>
      </div>
      <div class="prog"><div class="prog-fill ${cubierto?'pf-green':'pf-tr'}" style="width:${pct}%"></div></div>
      <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--t2);margin-top:4px">
        <span>${pct}%</span>${faltan>0?`<span style="color:var(--red)">Faltan ${fmt(faltan)}</span>`:`<span style="color:var(--green)">✓ Completo</span>`}
      </div>
      <div style="display:flex;gap:8px;margin-top:12px">
        ${cubierto?`<button class="btn btn-green" style="flex:2;padding:11px;font-size:13px" onclick="completarObjetivo(${o.id})">✓ Marcar pagado</button>`:''}
        <button class="btn-ghost" style="flex:1;padding:11px;font-size:12px" onclick="document.getElementById('eo-${o.id}').style.display=document.getElementById('eo-${o.id}').style.display==='block'?'none':'block'">Editar</button>
      </div>

function actualizarTR(){
  const v=parseFloat(document.getElementById('trSaldo').value);
  const f=fromDateInput(document.getElementById('trFecha').value);
  if(isNaN(v))return;
  DB.saldos.tr={val:v,fecha:f};save();renderTR();
}
function completarObjetivo(id){
  const numId=Number(id);
  const o=DB.objetivos.find(x=>Number(x.id)===numId);if(!o)return;
  if(!DB.saldos.tr)DB.saldos.tr={val:0,fecha:''};
  DB.saldos.tr.val=Math.max(0,(DB.saldos.tr.val||0)-o.meta);
  DB.objetivos=DB.objetivos.filter(x=>Number(x.id)!==numId);
  save();renderTR();
}
function guardarObjetivo(id){
  const o=DB.objetivos.find(x=>x.id===id);if(!o)return;
  const n=document.getElementById('oN-'+id)?.value.trim();if(n)o.nombre=n;
  const m=parseFloat(document.getElementById('oM-'+id)?.value);if(!isNaN(m))o.meta=m;
  const f=document.getElementById('oF-'+id)?.value;if(f!==undefined)o.fecha=f;
  save();renderTR();
}
function borrarObjetivo(id){DB.objetivos=DB.objetivos.filter(x=>x.id!==id);save();renderTR();}
function addObjetivo(){
  const nombre=document.getElementById('oNN').value.trim();
  const meta=parseFloat(document.getElementById('oNM').value);
  const fecha=document.getElementById('oNF').value;
  if(!nombre||isNaN(meta))return;
  DB.objetivos.push({id:Date.now(),nombre,meta,fecha});save();renderTR();
}

function factAplica(f,y,m){if(f.frec==='monthly')return true;if(f.frec==='quarterly')return f.meses.includes(m);if(f.frec==='annual')return f.mes===m;if(f.frec==='special')return f.check(y,m);return false;}

function getFactMes(y,m){const k=mesKey(y,m);if(!DB.facturas[k])DB.facturas[k]={checks:{},extras:[]};return DB.facturas[k];}

  const disp=FIJAS_FACT.filter(f=>factAplica(f,factY,factM));
  const noDisp=FIJAS_FACT.filter(f=>!factAplica(f,factY,factM));
  const totalF=disp.length+e.extras.length;
  const okF=disp.filter(f=>e.checks[f.id]).length+e.extras.filter(x=>x.checked).length;
  const pct=totalF?Math.round(okF/totalF*100):0;

  let html=`<div class="page-title">Facturas deducibles</div>
  <div class="mes-nav">
    <button class="btn-ghost" onclick="factMes(-1)">←</button>
    <span>${mesesC[factM]} ${factY}</span>
    <button class="btn-ghost" onclick="factMes(1)">→</button>

    <div class="stat-box" style="padding:11px;text-align:center"><div class="stat-lbl">Total</div><div class="stat-val" style="font-size:18px">${totalF}</div></div>
    <div class="stat-box" style="padding:11px;text-align:center"><div class="stat-lbl">Guardadas</div><div class="stat-val" style="font-size:18px;color:var(--green)">${okF}</div></div>
    <div class="stat-box" style="padding:11px;text-align:center"><div class="stat-lbl">Pendientes</div><div class="stat-val" style="font-size:18px;color:var(--red)">${totalF-okF}</div></div>
  </div>
  <div style="margin-bottom:13px">
    <div style="display:flex;justify-content:space-between;font-size:11px;font-weight:700;color:var(--t2);margin-bottom:5px"><span>Progreso</span><span>${pct}%</span></div>
    <div class="prog"><div class="prog-fill pf-green" style="width:${pct}%"></div></div>
  </div>
  <div class="card">
    <div class="card-hdr"><span class="card-title">Facturas deducibles</span></div>
    ${disp.map(f=>{const chk=!!e.checks[f.id];return`<div class="fi${chk?' chk':''}" onclick="toggleFact('${f.id}')">
      <div class="fi-chk">${chk?`<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`:''}</div>
      <div class="fi-body"><div class="fi-name">${f.name}</div><div class="fi-sub">${chk?'✓ Guardada':'Pendiente'}</div></div>
      <div class="fi-amt">${fmt(f.amt)}</div>
    </div>`;}).join('')}
  </div>`;

  if(noDisp.length) html+=`<div class="card">
    <div class="card-hdr"><span class="card-title">No aplican este mes</span></div>
    ${noDisp.map(f=>`<div class="fi nap"><div class="fi-chk"></div><div class="fi-body"><div class="fi-name" style="color:var(--t2)">${f.name}</div></div><div class="fi-amt">${fmt(f.amt)}</div></div>`).join('')}
  </div>`;

  html+=`<div class="card">
    <div class="card-hdr"><span class="card-title">Gastos extra deducibles</span></div>
    ${e.extras.map(x=>`<div class="fi${x.checked?' chk':''}" onclick="toggleFactExtra(${x.id})">
      <div class="fi-chk">${x.checked?`<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`:''}</div>
      <div class="fi-body"><div class="fi-name">${x.name}</div><div class="fi-sub">${x.checked?'✓ Guardada':'Pendiente'}</div></div>
      <div class="fi-amt">${x.amt?fmt(x.amt):'—'}</div>
    </div>`).join('')||'<div style="font-size:13px;color:var(--t2);padding:6px 0">Sin gastos extra</div>'}
    <div style="display:flex;gap:8px;margin-top:10px">
      <input type="text" id="feC" placeholder="Concepto" style="flex:1;padding:10px 12px;font-size:13px;border-radius:var(--rs);border:1.5px solid var(--brd);background:var(--card2);color:var(--tx);font-family:inherit"/>
      <input type="number" id="feI" placeholder="€" inputmode="decimal" style="width:68px;padding:10px;font-size:13px;border-radius:var(--rs);border:1.5px solid var(--brd);background:var(--card2);color:var(--tx);font-family:inherit"/>
      <button class="btn btn-green" style="width:auto;padding:10px 14px;font-size:16px" onclick="addFactExtra()">+</button>
    </div>
  </div>
  <button class="btn-ghost" style="width:100%;margin-top:4px;padding:11px" onclick="resetFactMes()">↩ Reiniciar mes</button>`;

  document.getElementById('s-facturas').innerHTML=html;
}
function factMes(d){factM+=d;if(factM>11){factM=0;factY++;}if(factM<0){factM=11;factY--;}renderFacturas();}
function toggleFact(id){const e=getFactMes(factY,factM);e.checks[id]=!e.checks[id];save();renderFacturas();}
function toggleFactExtra(id){const e=getFactMes(factY,factM);const x=e.extras.find(x=>x.id===id);if(x){x.checked=!x.checked;save();renderFacturas();}}
function addFactExtra(){const c=document.getElementById('feC').value.trim(),i=parseFloat(document.getElementById('feI').value);if(!c)return;const e=getFactMes(factY,factM);e.extras.push({id:Date.now(),name:c,amt:isNaN(i)?null:i,checked:false});save();renderFacturas();}
function resetFactMes(){const k=mesKey(factY,factM);if(DB.facturas[k]){DB.facturas[k].checks={};DB.facturas[k].extras=[];}save();renderFacturas();}

// ══════════════════════════════════════════
// BACKUP
// ══════════════════════════════════════════
function exportar(){
  const blob=new Blob([JSON.stringify({db:DB,exportado:new Date().toISOString()},null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download=`finanzas-${new Date().toLocaleDateString('es-ES').replace(/\//g,'-')}.json`;
  document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
}
function importar(event){
  const file=event.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const b=JSON.parse(e.target.result);
      if(!b.db||!b.db._v){alert('⚠ Archivo no válido.');return;}
      DB=b.db;save();renderInicio();
      alert('✓ Restaurado correctamente.');
    }catch(e){alert('⚠ Error al leer el archivo.');}
  };
  reader.readAsText(file);event.target.value='';
}

// ══════════════════════════════════════════
// INIT
// ══════════════════════════════════════════
const renders={inicio:renderInicio,bbva:renderBBVA,santander:renderSantander,tr:renderTR,productos:renderProductos,iva:renderIVA,facturas:renderFacturas};
load();
renderInicio();
</script>
</body>
